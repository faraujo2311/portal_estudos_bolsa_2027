"opts":["conjunção.","advérbio.","preposição.","numeral cardinal."],"ans":"D","exp":"Dois informa quantidade exata de livros."},{"tipo":"questao","id":"LP-02-d17","nivel":"objetiva","enun":"\u003cp>Assinale a frase em que “alto” funciona como advérbio:\u003c/p>","opts":["O muro alto caiu.","Os alunos falaram alto.","O edifício alto fica perto.","Uma montanha alta apareceu."],"ans":"B","exp":"Falaram alto: alto modifica o verbo; não varia com alunos."},{"tipo":"questao","id":"LP-02-d18","nivel":"objetiva","enun":"\u003cp>Em “Embora chovesse, fomos ao parque”, “embora” é:\u003c/p>","opts":["pronome relativo.","adjetivo.","conjunção concessiva.","substantivo comum."],"ans":"C","exp":"Embora introduz obstáculo que não impediu a ação."}]}]},{"id":"1.2.2","cod":"LP-03","titulo":"Semântica: o sentido das palavras","bncc":"EF69LP05, EF69LP48","tempo":"1h30","dia":"Dia 3 (23/10)","objetivo":"Reconhecer relações de sentido entre palavras (sinonímia, antonímia, homonímia, paronímia, polissemia), distinguir sentido denotativo de conotativo e identificar figuras de linguagem e ambiguidades.","secoes":[{"id":"1.2.2-s1","video":{"url":"","sugestao":""},"tipo":"aquecimento","titulo":"Aquecimento","check":"Fiz o aquecimento","itens":[{"tipo":"flips","cartas":[{"frente":"Qual palavra tem sentido parecido com “contente”?","verso":"alegre, feliz."},{"frente":"Qual o contrário de “antigo”?","verso":"novo, moderno."},{"frente":"Em “Ele tem um coração de pedra”, o coração é feito de pedra?","verso":"não; a expressão significa que a pessoa é insensível (sentido figurado)."}]}]},{"id":"1.2.2-s2","video":{"url":"","sugestao":"Professor Noslen: figuras de linguagem","link":"https://www.youtube.com/results?search_query=figuras%20de%20linguagem"},"tipo":"leitura","titulo":"Aprenda com o esquema","check":"Vi o esquema","itens":[{"tipo":"infografico","html":"\n\u003cdiv class=\"ig\">\n  \u003cp class=\"ig-titulo\">Conectivos: a lógica entre as ideias\u003c/p>\n  \u003cp class=\"ig-sub\">Vire cada conectivo para ver a relação que ele cria.\u003c/p>\n  \u003cdiv class=\"cartas quatro\">\n    \u003cbutton class=\"carta c-coral\" data-acao=\"virar\">\u003cspan class=\"frente\">\u003cb class=\"grande\">mas\u003c/b>\u003c/span>\u003cspan class=\"verso\">\u003cb>Oposição\u003c/b>Estudei, mas errei.\u003c/span>\u003c/button>\n    \u003cbutton class=\"carta c-menta\" data-acao=\"virar\">\u003cspan class=\"frente\">\u003cb class=\"grande\">embora\u003c/b>\u003c/span>\u003cspan class=\"verso\">\u003cb>Concessão\u003c/b>Embora cansada, continuei.\u003c/span>\u003c/button>\n    \u003cbutton class=\"carta c-lavanda\" data-acao=\"virar\">\u003cspan class=\"frente\">\u003cb class=\"grande\">porque\u003c/b>\u003c/span>\u003cspan class=\"verso\">\u003cb>Causa ou explicação\u003c/b>Parei porque chovia.\u003c/span>\u003c/button>\n    \u003cbutton class=\"carta c-amarelo\" data-acao=\"virar\">\u003cspan class=\"frente\">\u003cb class=\"grande\">portanto\u003c/b>\u003c/span>\u003cspan class=\"verso\">\u003cb>Conclusão\u003c/b>Pratiquei; portanto, melhorei.\u003c/span>\u003c/button>\n  \u003c/div>\n\u003c/div>"},{"tipo":"quadro","estilo":"esquema","titulo":"Quatro relações que a prova costuma misturar","html":"\u003cp>MAS contrapõe. EMBORA apresenta um obstáculo que não impede o fato principal (concessão). PORQUE dá causa ou explicação, conforme o contexto. PORTANTO apresenta resultado de um raciocínio (conclusão). Faça uma seta entre as ideias e teste a relação antes de responder.\u003c/p>"}]},{"id":"1.2.2-s3","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"O que é semântica","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Semântica é a parte da gramática que estuda o \u003cstrong>significado\u003c/strong> das palavras e das frases. Uma mesma palavra pode ter sentidos diferentes conforme o contexto, e palavras diferentes podem ter sentidos parecidos. Entender essas relações ajuda a interpretar textos e a escrever com precisão.\u003c/p>"},{"tipo":"img","src":"img:p_semantica","legenda":"As principais relações de sentido entre palavras."}]},{"id":"1.2.2-s4","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Sinônimos e antônimos","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>\u003cstrong>Sinônimos\u003c/strong> têm sentido semelhante: \u003cem>rápido / veloz / célere\u003c/em>; \u003cem>começar / iniciar\u003c/em>. Atenção: a sinonímia depende do contexto. “Ele é um aluno \u003cstrong>brilhante\u003c/strong>” = inteligente; “A estrela está \u003cstrong>brilhante\u003c/strong>” = luminosa.\u003c/p>\u003cp>\u003cstrong>Antônimos\u003c/strong> têm sentidos opostos: \u003cem>generoso × egoísta\u003c/em>; \u003cem>aceitar × recusar\u003c/em>; \u003cem>feliz × infeliz\u003c/em> (prefixo de negação).\u003c/p>"}]},{"id":"1.2.2-s5","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Homônimos e parônimos","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>\u003cstrong>Homônimos\u003c/strong> são palavras iguais na pronúncia e/ou na escrita, mas com sentidos diferentes:\u003c/p>\u003cul>\u003cli>\u003cstrong>Homófonas\u003c/strong> (mesmo som, escrita diferente): \u003cem>concerto\u003c/em> (apresentação musical) × \u003cem>conserto\u003c/em> (reparo); \u003cem>sessão\u003c/em> (reunião, exibição) × \u003cem>seção\u003c/em> (setor, divisão) × \u003cem>cessão\u003c/em> (ato de ceder); \u003cem>cela\u003c/em> (prisão) × \u003cem>sela\u003c/em> (do cavalo); \u003cem>cem\u003c/em> (número) × \u003cem>sem\u003c/em> (falta).\u003c/li>\u003cli>\u003cstrong>Homógrafas\u003c/strong> (mesma escrita, pronúncia diferente): \u003cem>colher\u003c/em> (verbo, “ê”) × \u003cem>colher\u003c/em> (talher, “é”); \u003cem>gosto\u003c/em> (verbo) × \u003cem>gosto\u003c/em> (sabor).\u003c/li>\u003cli>\u003cstrong>Perfeitas\u003c/strong> (mesma escrita e som): \u003cem>são\u003c/em> (santo) × \u003cem>são\u003c/em> (sadio) × \u003cem>são\u003c/em> (verbo ser).\u003c/li>\u003c/ul>\u003cp>\u003cstrong>Parônimos\u003c/strong> são palavras parecidas, mas não iguais, que costumam ser confundidas:\u003c/p>\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Palavra\u003c/th>\u003cth>Significado\u003c/th>\u003cth>Palavra\u003c/th>\u003cth>Significado\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>comprimento\u003c/td>\u003ctd>medida, extensão\u003c/td>\u003ctd>cumprimento\u003c/td>\u003ctd>saudação; ato de cumprir\u003c/td>\u003c/tr>\u003ctr>\u003ctd>descrição\u003c/td>\u003ctd>ato de descrever\u003c/td>\u003ctd>discrição\u003c/td>\u003ctd>qualidade de quem é discreto\u003c/td>\u003c/tr>\u003ctr>\u003ctd>eminente\u003c/td>\u003ctd>importante, notável\u003c/td>\u003ctd>iminente\u003c/td>\u003ctd>que está prestes a acontecer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tráfego\u003c/td>\u003ctd>trânsito de veículos\u003c/td>\u003ctd>tráfico\u003c/td>\u003ctd>comércio ilegal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ratificar\u003c/td>\u003ctd>confirmar\u003c/td>\u003ctd>retificar\u003c/td>\u003ctd>corrigir\u003c/td>\u003c/tr>\u003ctr>\u003ctd>emigrar\u003c/td>\u003ctd>sair do país\u003c/td>\u003ctd>imigrar\u003c/td>\u003ctd>entrar em outro país\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.2.2-s6","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Polissemia","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Uma palavra é \u003cstrong>polissêmica\u003c/strong> quando tem vários sentidos relacionados entre si. Exemplo com “pé”: \u003cem>pé\u003c/em> de pessoa, \u003cem>pé\u003c/em> da mesa, \u003cem>pé\u003c/em> de alface, \u003cem>pé\u003c/em> da página, “estar de \u003cem>pé\u003c/em>” (de acordo). O contexto mostra qual sentido vale. Outro exemplo: “pegar” o ônibus (tomar), “pegar” uma gripe (contrair), “a moda pegou” (se espalhou).\u003c/p>"}]},{"id":"1.2.2-s7","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Denotação e conotação","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Denotação (sentido literal)\u003c/th>\u003cth>Conotação (sentido figurado)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>O sentido de dicionário, objetivo.\u003c/td>\u003ctd>Um sentido novo, criado pelo contexto, expressivo.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>“O \u003cstrong>coração\u003c/strong> bate 70 vezes por minuto.”\u003c/td>\u003ctd>“Ela tem um \u003cstrong>coração\u003c/strong> de ouro.” (é bondosa)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>“Comprei uma \u003cstrong>pedra\u003c/strong> para o aquário.”\u003c/td>\u003ctd>“Aquela prova foi uma \u003cstrong>pedra\u003c/strong> no caminho.” (obstáculo)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Comum em notícias, verbetes, textos científicos.\u003c/td>\u003ctd>Comum em poemas, crônicas, anúncios, letras de música.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.2.2-s8","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Hiperônimo e hipônimo; campo semântico","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>\u003cstrong>Hiperônimo\u003c/strong> é a palavra de sentido mais geral; \u003cstrong>hipônimo\u003c/strong> é a de sentido mais específico. \u003cem>Fruta\u003c/em> é hiperônimo de \u003cem>manga, caju, acerola\u003c/em>. Isso é muito usado para evitar repetição: “Comprei \u003cstrong>mangas\u003c/strong>. As \u003cstrong>frutas\u003c/strong> estavam doces.” \u003cstrong>Campo semântico\u003c/strong> é o conjunto de palavras de um mesmo assunto: \u003cem>escola\u003c/em> → aluno, professor, caderno, recreio, prova.\u003c/p>"}]},{"id":"1.2.2-s9","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Figuras de linguagem mais cobradas","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Figura\u003c/th>\u003cth>O que faz\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Comparação\u003c/td>\u003ctd>Aproxima dois elementos usando conectivo (como, feito, tal qual)\u003c/td>\u003ctd>“Seus olhos brilham \u003cstrong>como\u003c/strong> estrelas.”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Metáfora\u003c/td>\u003ctd>Comparação sem conectivo: um elemento “é” o outro\u003c/td>\u003ctd>“Seus olhos \u003cstrong>são\u003c/strong> estrelas.”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Personificação (prosopopeia)\u003c/td>\u003ctd>Dá características humanas a seres não humanos\u003c/td>\u003ctd>“O vento \u003cstrong>sussurrava\u003c/strong> nas janelas.”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hipérbole\u003c/td>\u003ctd>Exagero intencional\u003c/td>\u003ctd>“Já te falei \u003cstrong>um milhão de vezes\u003c/strong>!”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Eufemismo\u003c/td>\u003ctd>Suaviza uma ideia desagradável\u003c/td>\u003ctd>“Ele \u003cstrong>faltou com a verdade\u003c/strong>.” (mentiu)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ironia\u003c/td>\u003ctd>Diz o contrário do que pensa\u003c/td>\u003ctd>“Que \u003cstrong>beleza\u003c/strong>, tirou zero de novo!”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Antítese\u003c/td>\u003ctd>Aproxima ideias opostas\u003c/td>\u003ctd>“Era o \u003cstrong>riso\u003c/strong> e o \u003cstrong>choro\u003c/strong> da mesma tarde.”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paradoxo\u003c/td>\u003ctd>Ideias opostas que parecem impossíveis juntas\u003c/td>\u003ctd>“O \u003cstrong>silêncio\u003c/strong> da sala \u003cstrong>gritava\u003c/strong>.”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Onomatopeia\u003c/td>\u003ctd>Imita sons\u003c/td>\u003ctd>“\u003cstrong>Tic-tac\u003c/strong>, o relógio não parava.”\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.2.2-s10","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Ambiguidade","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Uma frase é \u003cstrong>ambígua\u003c/strong> quando admite mais de uma interpretação. Em textos de humor, a ambiguidade pode ser proposital; em textos informativos, pode criar dúvidas e convém avaliá-la conforme o contexto.\u003c/p>\u003cp class=\"frase-exemplo\">“O policial prendeu o ladrão \u003cstrong>em sua casa\u003c/strong>.” — Na casa de quem: do policial ou do ladrão?\u003c/p>\u003cp class=\"frase-exemplo\">Para desfazer: “O policial prendeu o ladrão na casa \u003cstrong>do ladrão\u003c/strong>.” ou “…na \u003cstrong>própria\u003c/strong> casa do policial.”\u003c/p>"},{"tipo":"quadro","estilo":"dica","titulo":"Dica de prova","html":"\u003cp>Quando a questão perguntar “o sentido da palavra no texto”, nunca responda com o sentido do dicionário sem antes reler a frase. Troque a palavra pela alternativa e veja se a frase continua com o mesmo sentido.\u003c/p>"}]},{"id":"1.2.2-s11","video":{"url":"","sugestao":"Professora Pamba: Pamba sinônimos antônimos homônimos parônimos","link":"https://www.youtube.com/results?search_query=Pamba%20sin%C3%B4nimos%20ant%C3%B4nimos%20hom%C3%B4nimos%20par%C3%B4nimos"},"tipo":"leitura","titulo":"Fique atento e resumo","check":"Revisei o resumo","itens":[{"tipo":"quadro","estilo":"atencao","titulo":"Fique atento: erros mais comuns","html":"\u003cul>\u003cli>Confundir \u003cstrong>homônimos\u003c/strong> e \u003cstrong>parônimos\u003c/strong>: concerto/conserto soam iguais (homônimos); comprimento/cumprimento só são parecidos (parônimos).\u003c/li>\u003cli>Classificar \u003cstrong>comparação\u003c/strong> como metáfora: se houver \u003cem>como, feito, tal qual, parece\u003c/em>, é comparação.\u003c/li>\u003cli>Esquecer que \u003cstrong>sinônimo depende do contexto\u003c/strong>: “pesado” pode ser “de muito peso” ou “difícil”.\u003c/li>\u003cli>Confundir \u003cstrong>ironia\u003c/strong> com mentira: na ironia, o contexto mostra que o falante quer dizer o oposto.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"resumo","titulo":"Resumo para revisar","html":"\u003cul>\u003cli>Sinônimos: sentido parecido. Antônimos: sentido oposto.\u003c/li>\u003cli>Homônimos: iguais na escrita e/ou som, sentidos diferentes. Parônimos: parecidos, sentidos diferentes.\u003c/li>\u003cli>Polissemia: uma palavra com vários sentidos ligados entre si.\u003c/li>\u003cli>Denotação = literal. Conotação = figurado.\u003c/li>\u003cli>Figuras: comparação, metáfora, personificação, hipérbole, eufemismo, ironia, antítese, paradoxo, onomatopeia.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"saiba","titulo":"Para saber mais","html":"\u003cul>\u003cli>\u003ca href=\"https://www.todamateria.com.br\" target=\"_blank\" rel=\"noopener\">Toda Matéria — busque “figuras de linguagem” e “homônimos e parônimos”\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://brasilescola.uol.com.br\" target=\"_blank\" rel=\"noopener\">Brasil Escola — busque “semântica”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professor Noslen\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=figuras%20de%20linguagem\" target=\"_blank\" rel=\"noopener\">buscar “figuras de linguagem”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professora Pamba\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=Pamba%20sin%C3%B4nimos%20ant%C3%B4nimos%20hom%C3%B4nimos%20par%C3%B4nimos\" target=\"_blank\" rel=\"noopener\">buscar “Pamba sinônimos antônimos homônimos parônimos”\u003c/a>\u003c/li>\u003c/ul>"}]},{"id":"1.2.2-s12","video":{"url":"","sugestao":""},"tipo":"exemplos","titulo":"Exemplos resolvidos","check":"Vi os exemplos","itens":[{"tipo":"exemplo","nivel":"facil","enun":"\u003cp>Complete com \u003cem>sessão\u003c/em>, \u003cem>seção\u003c/em> ou \u003cem>cessão\u003c/em>: “A ______ de cinema começa às 19h. Os brinquedos ficam na ______ infantil da loja.”\u003c/p>","res":"\u003cp>Sessão = exibição/reunião → “A \u003cstrong>sessão\u003c/strong> de cinema”.\u003c/p>\u003cp>Seção = setor/divisão → “na \u003cstrong>seção\u003c/strong> infantil”.\u003c/p>"},{"tipo":"exemplo","nivel":"medio","enun":"\u003cp>Identifique a figura de linguagem: “A cidade dormia tranquila sob a chuva.”\u003c/p>","res":"\u003cp>Cidades não dormem: foi dada uma ação humana a algo não humano. É \u003cstrong>personificação\u003c/strong> (prosopopeia). O efeito é mostrar que a cidade estava silenciosa e calma.\u003c/p>"},{"tipo":"exemplo","nivel":"dificil","enun":"\u003cp>Explique a ambiguidade e reescreva a frase de duas formas: “Vendo cachorro de raça bem bravo.”\u003c/p>","res":"\u003cp>A frase pode significar que o \u003cem>cachorro\u003c/em> é bem bravo ou que a \u003cem>raça\u003c/em> é brava (e há ainda o duplo sentido de “vendo”: verbo vender ou ver).\u003c/p>\u003cp>Reescritas possíveis: “Vendo um cachorro bravo, de raça.” / “Vende-se cachorro de uma raça conhecida por ser brava.”\u003c/p>"},{"tipo":"quadro","estilo":"caso","titulo":"Estudo de caso: Por que “embora” não é conclusão?","html":"\u003cp>“Embora chovesse, saímos.” O trecho “chovesse” representa obstáculo; “saímos” ocorreu apesar dele. Logo, CONCESSÃO. Para conclusão, caberia “Chovia; portanto, ficamos em casa”.\u003c/p>"}]},{"id":"1.2.2-s13","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Exercícios de fixação","check":"Fiz as questões","intro":"Resolva sem consultar a explicação. Nas questões de múltipla escolha, assinale apenas uma opção; nas atividades discursivas, registre uma justificativa curta. Confira o gabarito ao final.","itens":[{"tipo":"questao","id":"LP-03-q1","nivel":"facil","enun":"\u003cp>Em “O atleta foi célere na última volta”, a palavra “célere” pode ser substituída, sem mudança de sentido, por:\u003c/p>","opts":["cansado.","famoso.","lento.","rápido."],"ans":"D","exp":"Célere significa veloz, rápido. “Lento” é antônimo."},{"tipo":"questao","id":"LP-03-q2","nivel":"facil","enun":"\u003cp>Qual é um antônimo de “generoso”?\u003c/p>","opts":["bondoso","solidário","egoísta","gentil"],"ans":"C","exp":"Generoso é quem dá, reparte; o oposto é egoísta (ou mesquinho). As demais são sinônimos aproximados."},{"tipo":"questao","id":"LP-03-q3","nivel":"medio","enun":"\u003cp>Complete corretamente: “O ______ do piano foi adiado porque o instrumento precisa de ______.”\u003c/p>","opts":["concerto — conserto","conserto — concerto","concerto — concerto","conserto — conserto"],"ans":"A","exp":"Concerto = apresentação musical; conserto = reparo. São homônimos homófonos."},{"tipo":"questao","id":"LP-03-q4","nivel":"facil","discursiva":true,"linhas":4,"enun":"\u003cp>Explique o sentido da palavra “coração” em cada frase e diga se é denotativo ou conotativo: (I) “O coração humano bate cerca de 70 vezes por minuto.” (II) “Minha avó tem um coração de ouro.”\u003c/p>","resposta":"(I) Órgão do corpo: sentido denotativo (literal). (II) Bondade, generosidade: sentido conotativo (figurado).","exp":"Meio ponto para cada frase."},{"tipo":"questao","id":"LP-03-q5","nivel":"medio","enun":"\u003cp>Em “Já te falei um milhão de vezes para fechar a porta!”, a figura de linguagem é:\u003c/p>","opts":["eufemismo.","hipérbole.","personificação.","antítese."],"ans":"B","exp":"Há exagero intencional (“um milhão de vezes”) para dar ênfase: hipérbole."},{"tipo":"questao","id":"LP-03-q6","nivel":"dificil","enun":"\u003cp>A frase “O policial prendeu o ladrão em sua casa” é ambígua porque:\u003c/p>","opts":["não se sabe quem é o policial.","o verbo “prender” tem dois sentidos.","não se sabe quando a prisão ocorreu.","não fica claro se a casa é do policial ou do ladrão."],"ans":"D","exp":"O possessivo “sua” pode se referir tanto ao policial quanto ao ladrão. Para desfazer: “na casa do ladrão”."},{"tipo":"questao","id":"LP-03-q7","nivel":"medio","discursiva":true,"linhas":4,"enun":"\u003cp>Explique o sentido do verbo “pegar” em cada frase: (I) “Vou pegar o ônibus das 7h.” (II) “Ele pegou uma gripe forte.” (III) “Essa moda pegou rápido.” Qual o nome desse fenômeno?\u003c/p>","resposta":"(I) tomar, embarcar; (II) contrair; (III) espalhar-se, tornar-se popular. O fenômeno é a polissemia.","exp":"Ponto inteiro com os três sentidos e o nome; meio ponto se faltar o nome ou um sentido."},{"tipo":"questao","id":"LP-03-q8","nivel":"facil","enun":"\u003cp>Em “O vento sussurrava segredos nas janelas”, há:\u003c/p>","opts":["personificação.","hipérbole.","ironia.","onomatopeia."],"ans":"A","exp":"Sussurrar e contar segredos são ações humanas atribuídas ao vento."},{"tipo":"questao","id":"LP-03-q9","nivel":"medio","enun":"\u003cp>Assinale a alternativa que completa corretamente: “O ______ da sala é de 6 metros.” / “Fiz um ______ ao diretor na entrada.”\u003c/p>","opts":["cumprimento — comprimento","comprimento — comprimento","comprimento — cumprimento","cumprimento — cumprimento"],"ans":"C","exp":"Comprimento = medida; cumprimento = saudação. São parônimos."},{"tipo":"questao","id":"LP-03-q10","nivel":"dificil","enun":"\u003cp>Ao ver o boletim do irmão, Ana disse: “Que maravilha! Mais um zero para a coleção!”. A fala de Ana é um exemplo de:\u003c/p>","opts":["eufemismo, pois suaviza a nota.","ironia, pois diz o contrário do que pensa.","comparação, pois compara notas.","metáfora, pois a nota é uma coleção."],"ans":"B","exp":"Ana não acha a nota uma maravilha: o contexto (zero) mostra que ela diz o oposto do que pensa, com tom de crítica. É ironia."},{"tipo":"questao","id":"LP-03-q11","nivel":"medio","enun":"\u003cp>Em “O ex-jogador faltou com a verdade na entrevista”, a expressão destacada é um eufemismo para:\u003c/p>","opts":["esqueceu.","mentiu.","atrasou-se.","exagerou."],"ans":"B","exp":"Eufemismo suaviza uma ideia desagradável: “faltar com a verdade” = mentir."},{"tipo":"questao","id":"LP-03-q12","nivel":"dificil","discursiva":true,"linhas":4,"enun":"\u003cp>Na frase “O silêncio da sala gritava a ansiedade dos alunos antes da prova”, identifique duas figuras de linguagem e explique o efeito de sentido.\u003c/p>","resposta":"Paradoxo (ou antítese): “silêncio” e “gritava” são ideias opostas reunidas. Personificação: o silêncio “grita”, ação humana. Efeito: mostrar que, mesmo sem barulho, a ansiedade era tão forte que se percebia claramente.","exp":"Ponto inteiro com duas figuras e o efeito; meio ponto com uma figura e o efeito."}]},{"id":"1.2.2-s14","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Desafio extra: mais 6 questões objetivas","check":"Fiz o desafio","itens":[{"tipo":"questao","id":"LP-03-d13","nivel":"objetiva","enun":"\u003cp>“Portanto” estabelece relação de:\u003c/p>","opts":["conclusão.","oposição.","concessão.","alternância."],"ans":"A","exp":"Portanto introduz conclusão decorrente do que foi afirmado."},{"tipo":"questao","id":"LP-03-d14","nivel":"objetiva","enun":"\u003cp>“Embora estivesse cansada, terminou o treino.” Há relação de:\u003c/p>","opts":["causa.","concessão.","finalidade.","adição."],"ans":"B","exp":"O cansaço não impede a conclusão do treino."},{"tipo":"questao","id":"LP-03-d15","nivel":"objetiva","enun":"\u003cp>“Aquele atleta é uma máquina.” O sentido é:\u003c/p>","opts":["científico.","literal.","figurado.","irônico obrigatório."],"ans":"C","exp":"Máquina funciona como metáfora de resistência/eficiência."},{"tipo":"questao","id":"LP-03-d16","nivel":"objetiva","enun":"\u003cp>O antônimo de “escasso” no contexto “recursos escassos” é:\u003c/p>","opts":["limitado.","raro.","pequeno.","abundante."],"ans":"D","exp":"Escasso = pouco; abundante = muito."},{"tipo":"questao","id":"LP-03-d17","nivel":"objetiva","enun":"\u003cp>O par “descrição / discrição” exemplifica:\u003c/p>","opts":["paronímia.","sinonímia.","antonímia.","polissemia."],"ans":"A","exp":"Palavras parecidas na forma, mas com sentidos distintos, são parônimas."},{"tipo":"questao","id":"LP-03-d18","nivel":"objetiva","enun":"\u003cp>Em “O banco da praça estava molhado”, “banco” designa:\u003c/p>","opts":["instituição financeira.","assento.","conjunto de peixes.","local de provas."],"ans":"B","exp":"O contexto “da praça” identifica a acepção de assento."}]}]}]},{"num":"1.3","titulo":"Sintaxe e Concordância","intro":"Este é o coração da gramática do edital: transitividade do verbo, predicativo do sujeito, adjunto adnominal, complemento nominal e concordância verbal. Os temas estão em ordem de pré-requisito; não pule etapas.","temas":[{"id":"1.3.1","cod":"LP-04","titulo":"Transitividade verbal","bncc":"EF07LP07, EF08LP07","tempo":"1h30","dia":"Dia 3 (23/10)","objetivo":"Classificar verbos em intransitivos, transitivos diretos, transitivos indiretos e transitivos diretos e indiretos, identificando objeto direto e objeto indireto.","secoes":[{"id":"1.3.1-s1","video":{"url":"","sugestao":""},"tipo":"aquecimento","titulo":"Aquecimento","check":"Fiz o aquecimento","itens":[{"tipo":"flips","cartas":[{"frente":"Em “Os alunos estudaram”, quem é o sujeito?","verso":"os alunos."},{"frente":"Cite três preposições.","verso":"a, de, em, para, com, por, sem…"},{"frente":"Em “Ela comprou pão”, o que ela comprou?","verso":"pão (é o complemento do verbo)."}]}]},{"id":"1.3.1-s2","video":{"url":"https://www.youtube.com/watch?v=y2haxLgR4BM","sugestao":"Professor Noslen: Noslen transitividade verbal","link":"https://www.youtube.com/results?search_query=Noslen%20transitividade%20verbal"},"tipo":"leitura","titulo":"Aprenda com o esquema","check":"Vi o esquema","itens":[{"tipo":"infografico","html":"\n\u003cdiv class=\"ig\">\n  \u003cp class=\"ig-titulo\">Descubra o complemento do verbo\u003c/p>\n  \u003cp class=\"ig-sub\">Faça a pergunta ao verbo e toque na linha para conferir.\u003c/p>\n  \u003cdiv class=\"linhas-ig\">\n    \u003cbutton class=\"linha-ig\" data-acao=\"revelar\">\u003cb>comprei\u003c/b>\u003cspan class=\"perg\">o quê?\u003c/span>\u003cspan class=\"oculto\">um livro\u003c/span>\u003cspan class=\"oculto tag\">VTD + objeto direto\u003c/span>\u003c/button>\n    \u003cbutton class=\"linha-ig\" data-acao=\"revelar\">\u003cb>gosto\u003c/b>\u003cspan class=\"perg\">de quê?\u003c/span>\u003cspan class=\"oculto\">de música\u003c/span>\u003cspan class=\"oculto tag\">VTI + objeto indireto\u003c/span>\u003c/button>\n    \u003cbutton class=\"linha-ig\" data-acao=\"revelar\">\u003cb>entreguei\u003c/b>\u003cspan class=\"perg\">o quê? a quem?\u003c/span>\u003cspan class=\"oculto\">a carta / à professora\u003c/span>\u003cspan class=\"oculto tag\">VTDI + OD + OI\u003c/span>\u003c/button>\n  \u003c/div>\n\u003c/div>"},{"tipo":"quadro","estilo":"esquema","titulo":"Complemento do verbo não é qualquer palavra depois dele","html":"\u003cp>“A turma resolveu o problema ontem.” — resolveu O QUÊ? “o problema” é objeto direto; “ontem” é circunstância de tempo. “A turma gostou do desafio.” — gostou DE QUÊ? “do desafio” é objeto indireto, pois a preposição é exigida pelo verbo.\u003c/p>"}]},{"id":"1.3.1-s3","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"A estrutura da oração","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Uma oração costuma ter \u003cstrong>sujeito\u003c/strong> (de quem se fala) e \u003cstrong>predicado\u003c/strong> (o que se diz do sujeito). O núcleo do predicado, muitas vezes, é o \u003cstrong>verbo\u003c/strong>. A transitividade estuda se o verbo \u003cstrong>precisa ou não de complemento\u003c/strong> para ter sentido completo.\u003c/p>"},{"tipo":"img","src":"img:p_oracao","legenda":"Uma oração com sujeito, verbo e dois complementos."}]},{"id":"1.3.1-s4","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Verbos significativos e verbos de ligação","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>A transitividade vale só para os \u003cstrong>verbos significativos\u003c/strong> (que indicam ação ou acontecimento: correr, comprar, gostar). Os \u003cstrong>verbos de ligação\u003c/strong> (ser, estar, ficar, parecer…) apenas ligam o sujeito a uma característica e serão estudados no tema 1.3.2.\u003c/p>"}]},{"id":"1.3.1-s5","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Os quatro tipos de verbo","check":"Li esta parte","itens":[{"tipo":"img","src":"img:p_transitividade","legenda":"Fluxograma para classificar o verbo."},{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Tipo\u003c/th>\u003cth>O que precisa\u003c/th>\u003cth>Pergunta ao verbo\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Intransitivo (VI)\u003c/td>\u003ctd>Nada: tem sentido completo\u003c/td>\u003ctd>—\u003c/td>\u003ctd>O bebê \u003cstrong>dormiu\u003c/strong>. / O avião \u003cstrong>partiu\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transitivo direto (VTD)\u003c/td>\u003ctd>Complemento \u003cstrong>sem\u003c/strong> preposição: objeto direto (OD)\u003c/td>\u003ctd>o quê? / quem?\u003c/td>\u003ctd>Lucas \u003cstrong>comprou\u003c/strong> \u003cem>um tênis\u003c/em>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transitivo indireto (VTI)\u003c/td>\u003ctd>Complemento \u003cstrong>com\u003c/strong> preposição: objeto indireto (OI)\u003c/td>\u003ctd>de quê? a quem? em quê? com quem?\u003c/td>\u003ctd>Nós \u003cstrong>precisamos\u003c/strong> \u003cem>de ajuda\u003c/em>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transitivo direto e indireto (VTDI)\u003c/td>\u003ctd>Dois complementos: OD e OI\u003c/td>\u003ctd>o quê? + a quem?\u003c/td>\u003ctd>A professora \u003cstrong>entregou\u003c/strong> \u003cem>as provas\u003c/em> \u003cem>aos alunos\u003c/em>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.3.1-s6","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Como descobrir o complemento: o método das perguntas","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003col>\u003cli>Ache o verbo da oração.\u003c/li>\u003cli>Pergunte ao verbo: “quem ___ , ___ o quê?” ou “___ de quê / a quem / em quê?”.\u003c/li>\u003cli>Se a resposta vier \u003cstrong>sem preposição obrigatória\u003c/strong>, é objeto direto. Se vier \u003cstrong>com preposição exigida pelo verbo\u003c/strong>, é objeto indireto.\u003c/li>\u003cli>Se não houver pergunta que faça sentido, o verbo é intransitivo.\u003c/li>\u003c/ol>\u003cp class=\"frase-exemplo\">“Maria \u003cstrong>gosta\u003c/strong> de chocolate.” → Maria gosta \u003cstrong>de quê\u003c/strong>? \u003cem>de chocolate\u003c/em> → OI → VTI.\u003c/p>\u003cp class=\"frase-exemplo\">“Os meninos \u003cstrong>encontraram\u003c/strong> o cachorro perdido.” → encontraram \u003cstrong>o quê\u003c/strong>? \u003cem>o cachorro perdido\u003c/em> → OD → VTD.\u003c/p>"}]},{"id":"1.3.1-s7","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Pronomes oblíquos como complemento","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Os pronomes \u003cstrong>o, a, os, as\u003c/strong> funcionam como \u003cstrong>objeto direto\u003c/strong>; \u003cstrong>lhe, lhes\u003c/strong> funcionam como \u003cstrong>objeto indireto\u003c/strong>.\u003c/p>\u003cp class=\"frase-exemplo\">“Eu \u003cstrong>o\u003c/strong> vi ontem.” (vi quem? o → OD)\u003c/p>\u003cp class=\"frase-exemplo\">“Entreguei-\u003cstrong>lhe\u003c/strong> o bilhete.” (entreguei a quem? lhe → OI; entreguei o quê? o bilhete → OD)\u003c/p>"}]},{"id":"1.3.1-s8","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"O contexto muda a transitividade","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Um mesmo verbo pode ter transitividades diferentes, conforme a frase:\u003c/p>\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Frase\u003c/th>\u003cth>Classificação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>“Ela \u003cstrong>canta\u003c/strong> muito bem.”\u003c/td>\u003ctd>VI (sentido completo; “muito bem” é circunstância de modo)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>“Ela \u003cstrong>canta\u003c/strong> samba.”\u003c/td>\u003ctd>VTD (canta o quê? samba)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>“O jogador \u003cstrong>chutou\u003c/strong>.”\u003c/td>\u003ctd>VI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>“O jogador \u003cstrong>chutou\u003c/strong> a bola.”\u003c/td>\u003ctd>VTD\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.3.1-s9","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Cuidado com as circunstâncias (adjuntos adverbiais)","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Expressões de tempo, lugar e modo \u003cstrong>não são objetos\u003c/strong>: “Os alunos chegaram \u003cstrong>cedo\u003c/strong> \u003cstrong>à escola\u003c/strong>.” Na gramática escolar, \u003cem>chegar\u003c/em> é intransitivo e “à escola” é adjunto adverbial de lugar. O mesmo vale para \u003cem>ir\u003c/em>, \u003cem>voltar\u003c/em>, \u003cem>morar\u003c/em>.\u003c/p>"}]},{"id":"1.3.1-s10","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Regência de verbos muito cobrados","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Verbo\u003c/th>\u003cth>Norma-padrão\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>assistir (ver)\u003c/td>\u003ctd>VTI, com a preposição \u003cstrong>a\u003c/strong>\u003c/td>\u003ctd>Assistimos \u003cstrong>ao\u003c/strong> jogo. (e não “assistimos o jogo”)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>obedecer / desobedecer\u003c/td>\u003ctd>VTI, preposição \u003cstrong>a\u003c/strong>\u003c/td>\u003ctd>Os alunos obedecem \u003cstrong>ao\u003c/strong> regulamento.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>gostar\u003c/td>\u003ctd>VTI, preposição \u003cstrong>de\u003c/strong>\u003c/td>\u003ctd>Gosto \u003cstrong>de\u003c/strong> música.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>precisar\u003c/td>\u003ctd>VTI, preposição \u003cstrong>de\u003c/strong>\u003c/td>\u003ctd>Precisamos \u003cstrong>de\u003c/strong> tempo.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>preferir\u003c/td>\u003ctd>VTDI: preferir algo \u003cstrong>a\u003c/strong> algo\u003c/td>\u003ctd>Prefiro suco \u003cstrong>a\u003c/strong> refrigerante. (e não “do que”)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>avisar / informar\u003c/td>\u003ctd>VTDI\u003c/td>\u003ctd>Avisei os pais \u003cstrong>da\u003c/strong> reunião. / Avisei \u003cstrong>aos\u003c/strong> pais a reunião.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.3.1-s11","video":{"url":"","sugestao":"Professora Pamba: Pamba verbo transitivo direto e indireto","link":"https://www.youtube.com/results?search_query=Pamba%20verbo%20transitivo%20direto%20e%20indireto"},"tipo":"leitura","titulo":"Fique atento e resumo","check":"Revisei o resumo","itens":[{"tipo":"quadro","estilo":"atencao","titulo":"Fique atento: erros mais comuns","html":"\u003cul>\u003cli>Confundir \u003cstrong>objeto indireto\u003c/strong> com \u003cstrong>adjunto adverbial\u003c/strong>: “Ele mora \u003cstrong>em Curitiba\u003c/strong>” indica lugar (adjunto), não objeto.\u003c/li>\u003cli>Achar que todo verbo tem sempre a mesma transitividade: olhe a frase.\u003c/li>\u003cli>Esquecer a preposição de \u003cstrong>assistir\u003c/strong> (ao filme), \u003cstrong>obedecer\u003c/strong> (ao professor) e \u003cstrong>preferir\u003c/strong> (uma coisa \u003cem>a\u003c/em> outra).\u003c/li>\u003cli>Classificar o \u003cstrong>sujeito\u003c/strong> como objeto: o sujeito pratica a ação; o objeto completa o verbo.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"resumo","titulo":"Resumo para revisar","html":"\u003cul>\u003cli>VI: não precisa de complemento.\u003c/li>\u003cli>VTD + objeto direto (sem preposição). VTI + objeto indireto (com preposição).\u003c/li>\u003cli>VTDI: dois complementos, um sem e outro com preposição.\u003c/li>\u003cli>o, a, os, as = OD; lhe, lhes = OI.\u003c/li>\u003cli>A transitividade depende do contexto.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"saiba","titulo":"Para saber mais","html":"\u003cul>\u003cli>\u003ca href=\"https://www.todamateria.com.br/transitividade-verbal/\" target=\"_blank\" rel=\"noopener\">Toda Matéria — Transitividade verbal\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professor Noslen\u003c/strong> — \u003ca href=\"https://www.youtube.com/watch?v=y2haxLgR4BM\" target=\"_blank\" rel=\"noopener\">assistir\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professora Pamba\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=Pamba%20verbo%20transitivo%20direto%20e%20indireto\" target=\"_blank\" rel=\"noopener\">buscar “Pamba verbo transitivo direto e indireto”\u003c/a>\u003c/li>\u003c/ul>"}]},{"id":"1.3.1-s12","video":{"url":"","sugestao":""},"tipo":"exemplos","titulo":"Exemplos resolvidos","check":"Vi os exemplos","itens":[{"tipo":"exemplo","nivel":"facil","enun":"\u003cp>Classifique o verbo: “O sol nasceu às 5h30.”\u003c/p>","res":"\u003cp>“Nasceu” tem sentido completo. “Às 5h30” é circunstância de tempo, não complemento. Verbo \u003cstrong>intransitivo\u003c/strong>.\u003c/p>"},{"tipo":"exemplo","nivel":"medio","enun":"\u003cp>Classifique o verbo e identifique o complemento: “Os torcedores confiam no técnico.”\u003c/p>","res":"\u003cp>Confiam \u003cstrong>em quem\u003c/strong>? \u003cem>no técnico\u003c/em> (em + o). A preposição é exigida pelo verbo.\u003c/p>\u003cp>Complemento com preposição = \u003cstrong>objeto indireto\u003c/strong>. Verbo \u003cstrong>transitivo indireto (VTI)\u003c/strong>.\u003c/p>"},{"tipo":"exemplo","nivel":"dificil","enun":"\u003cp>Analise: “Na festa, o avô contou histórias antigas aos netos.”\u003c/p>","res":"\u003cp>Verbo: \u003cstrong>contou\u003c/strong>. Contou o quê? \u003cem>histórias antigas\u003c/em> → \u003cstrong>objeto direto\u003c/strong>. Contou a quem? \u003cem>aos netos\u003c/em> → \u003cstrong>objeto indireto\u003c/strong>.\u003c/p>\u003cp>Verbo \u003cstrong>transitivo direto e indireto (VTDI)\u003c/strong>. “Na festa” é adjunto adverbial de lugar (não é complemento).\u003c/p>"},{"tipo":"quadro","estilo":"caso","titulo":"Estudo de caso: Da pergunta ao objeto","html":"\u003cp>“Os alunos resolveram o problema.” Núcleo verbal “resolveram”. Pergunta “resolveram o quê?” → “o problema”, sem preposição obrigatória. É VERBO TRANSITIVO DIRETO com OBJETO DIRETO.\u003c/p>"}]},{"id":"1.3.1-s13","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Exercícios de fixação","check":"Fiz as questões","intro":"Resolva sem consultar a explicação. Nas questões de múltipla escolha, assinale apenas uma opção; nas atividades discursivas, registre uma justificativa curta. Confira o gabarito ao final.","itens":[{"tipo":"questao","id":"LP-04-q1","nivel":"facil","enun":"\u003cp>Na oração “O bebê dormiu”, o verbo é:\u003c/p>","opts":["intransitivo.","transitivo direto.","transitivo indireto.","de ligação."],"ans":"A","exp":"“Dormiu” tem sentido completo; não precisa de complemento."},{"tipo":"questao","id":"LP-04-q2","nivel":"facil","enun":"\u003cp>Em “Lucas comprou um tênis novo”, o termo “um tênis novo” é:\u003c/p>","opts":["sujeito.","objeto indireto.","adjunto adverbial.","objeto direto."],"ans":"D","exp":"Comprou o quê? Um tênis novo — complemento sem preposição: objeto direto."},{"tipo":"questao","id":"LP-04-q3","nivel":"medio","enun":"\u003cp>Em “Precisamos de mais tempo para estudar”, o verbo e seu complemento são:\u003c/p>","opts":["VTD — mais tempo","VTI — de mais tempo","VI — para estudar","VTDI — de mais tempo e para estudar"],"ans":"B","exp":"Quem precisa, precisa \u003cstrong>de\u003c/strong> algo. A preposição é exigida: objeto indireto “de mais tempo”. “Para estudar” indica finalidade."},{"tipo":"questao","id":"LP-04-q4","nivel":"facil","discursiva":true,"linhas":3,"enun":"\u003cp>Na oração “A professora entregou as provas aos alunos”, classifique o verbo e identifique os complementos.\u003c/p>","resposta":"Verbo transitivo direto e indireto (VTDI). Objeto direto: as provas. Objeto indireto: aos alunos.","exp":"Meio ponto se acertar a classificação e só um complemento."},{"tipo":"questao","id":"LP-04-q5","nivel":"medio","enun":"\u003cp>Em qual oração o verbo é transitivo indireto?\u003c/p>","opts":["Ana leu o livro inteiro.","Ana chegou cedo.","Ana gosta de música brasileira.","Ana está feliz."],"ans":"C","exp":"Gosta \u003cstrong>de\u003c/strong> quê? de música: OI. (A) VTD. (B) VI com adjunto de tempo. (D) “está” é verbo de ligação."},{"tipo":"questao","id":"LP-04-q6","nivel":"dificil","enun":"\u003cp>Em “Entreguei-lhe o bilhete na saída”, os termos “lhe” e “o bilhete” são, respectivamente:\u003c/p>","opts":["objeto indireto e objeto direto.","objeto direto e objeto indireto.","sujeito e objeto direto.","objeto indireto e adjunto adverbial."],"ans":"A","exp":"Entreguei a quem? lhe (= a ele/a ela) → OI. Entreguei o quê? o bilhete → OD. “Na saída” é adjunto adverbial."},{"tipo":"questao","id":"LP-04-q7","nivel":"medio","discursiva":true,"linhas":4,"enun":"\u003cp>Classifique o verbo “cantar” em: (I) “Minha irmã canta todas as manhãs.” (II) “Minha irmã canta músicas antigas.” Explique a diferença.\u003c/p>","resposta":"(I) Intransitivo: o sentido está completo; “todas as manhãs” indica tempo. (II) Transitivo direto: canta o quê? músicas antigas (objeto direto).","exp":"Mostra que a transitividade depende do contexto."},{"tipo":"questao","id":"LP-04-q8","nivel":"facil","enun":"\u003cp>Em “Os pássaros voaram para longe”, o verbo “voaram” é:\u003c/p>","opts":["transitivo direto.","transitivo indireto.","intransitivo.","transitivo direto e indireto."],"ans":"C","exp":"“Voaram” tem sentido completo; “para longe” é circunstância de lugar."},{"tipo":"questao","id":"LP-04-q9","nivel":"medio","enun":"\u003cp>Segundo a norma-padrão, está correta a frase:\u003c/p>","opts":["Assistimos o jogo pela televisão.","Prefiro mais futebol do que vôlei.","Os alunos obedeceram o regulamento.","Assistimos ao jogo pela televisão."],"ans":"D","exp":"No sentido de ver, assistir exige a preposição \u003cstrong>a\u003c/strong>: “assistimos ao jogo”. Corrigindo as outras: “Prefiro futebol a vôlei”; “obedeceram ao regulamento”."},{"tipo":"questao","id":"LP-04-q10","nivel":"dificil","enun":"\u003cp>Em “Ontem, na escola, os alunos ofereceram flores à diretora”, os complementos do verbo são:\u003c/p>","opts":["ontem e na escola.","flores e à diretora.","os alunos e flores.","na escola e à diretora."],"ans":"B","exp":"Ofereceram o quê? flores (OD). A quem? à diretora (OI). “Ontem” e “na escola” são adjuntos adverbiais; “os alunos” é sujeito."},{"tipo":"questao","id":"LP-04-q11","nivel":"medio","enun":"\u003cp>Em “Os meninos encontraram o cachorro perdido na praça”, o objeto direto é:\u003c/p>","opts":["o cachorro perdido.","os meninos.","na praça.","perdido na praça."],"ans":"A","exp":"Encontraram o quê? o cachorro perdido. “Na praça” é adjunto adverbial de lugar."},{"tipo":"questao","id":"LP-04-q12","nivel":"dificil","discursiva":true,"linhas":5,"enun":"\u003cp>Escreva quatro orações: uma com verbo intransitivo, uma com transitivo direto, uma com transitivo indireto e uma com transitivo direto e indireto. Sublinhe os complementos.\u003c/p>","resposta":"Exemplos: VI: “A chuva parou.” VTD: “Comprei um caderno.” (OD: um caderno) VTI: “Confio em você.” (OI: em você) VTDI: “Mandei uma mensagem ao meu primo.” (OD: uma mensagem; OI: ao meu primo).","exp":"Um quarto de ponto para cada oração correta."}]},{"id":"1.3.1-s14","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Desafio extra: mais 6 questões objetivas","check":"Fiz o desafio","itens":[{"tipo":"questao","id":"LP-04-d13","nivel":"objetiva","enun":"\u003cp>Em “Resolveram o desafio”, o termo “o desafio” é:\u003c/p>","opts":["objeto indireto.","predicativo.","objeto direto.","adjunto adverbial."],"ans":"C","exp":"Resolveram o quê? o desafio, sem preposição obrigatória."},{"tipo":"questao","id":"LP-04-d14","nivel":"objetiva","enun":"\u003cp>Em “A equipe precisou de ajuda”, “de ajuda” é:\u003c/p>","opts":["sujeito.","predicativo do sujeito.","objeto direto.","objeto indireto."],"ans":"D","exp":"Precisar de exige preposição de; de ajuda completa o verbo."},{"tipo":"questao","id":"LP-04-d15","nivel":"objetiva","enun":"\u003cp>Em “Dei uma resposta à professora”, a oração apresenta:\u003c/p>","opts":["objeto direto e indireto.","dois objetos diretos.","apenas adjuntos adverbiais.","apenas predicativo."],"ans":"A","exp":"Uma resposta é OD; à professora é OI."},{"tipo":"questao","id":"LP-04-d16","nivel":"objetiva","enun":"\u003cp>Em “O bebê dormiu tranquilamente”, o verbo “dormiu” é:\u003c/p>","opts":["transitivo direto.","intransitivo.","transitivo indireto.","de ligação."],"ans":"B","exp":"Dormir não requer complemento nesse contexto; tranquilamente indica modo."},{"tipo":"questao","id":"LP-04-d17","nivel":"objetiva","enun":"\u003cp>Em “O aluno gosta de leitura”, o verbo “gosta” exige:\u003c/p>","opts":["objeto direto.","predicativo.","objeto indireto.","agente da passiva."],"ans":"C","exp":"Gostar de: preposição é exigida pelo verbo."},{"tipo":"questao","id":"LP-04-d18","nivel":"objetiva","enun":"\u003cp>Qual oração contém um verbo transitivo direto?\u003c/p>","opts":["O menino nasceu ontem.","Ela ficou satisfeita.","A turma precisa de silêncio.","A turma construiu uma ponte."],"ans":"D","exp":"Construiu o quê? uma ponte: OD."}]}]},{"id":"1.3.2","cod":"LP-05","titulo":"Predicativo do sujeito","bncc":"EF09LP05, EF09LP06","tempo":"1h30","dia":"Dia 5 (25/10)","objetivo":"Reconhecer verbos de ligação e predicativos do sujeito, diferenciar predicado nominal, verbal e verbo-nominal e perceber os efeitos de sentido de ser, estar, ficar, parecer e permanecer.","secoes":[{"id":"1.3.2-s1","video":{"url":"","sugestao":""},"tipo":"aquecimento","titulo":"Aquecimento","check":"Fiz o aquecimento","itens":[{"tipo":"flips","cartas":[{"frente":"Em “As meninas estavam alegres”, quem é o sujeito?","verso":"as meninas."},{"frente":"Qual a classe de “alegres” nessa frase?","verso":"adjetivo."},{"frente":"Qual a diferença entre verbo intransitivo e transitivo?","verso":"o intransitivo não precisa de complemento; o transitivo precisa."}]}]},{"id":"1.3.2-s2","video":{"url":"","sugestao":"Professor Noslen: predicativo do sujeito","link":"https://www.youtube.com/results?search_query=predicativo%20do%20sujeito"},"tipo":"leitura","titulo":"Aprenda com o esquema","check":"Vi o esquema","itens":[{"tipo":"infografico","html":"\n\u003cdiv class=\"ig\">\n  \u003cp class=\"ig-titulo\">Predicativo: a qualidade atribuída ao sujeito\u003c/p>\n  \u003cdiv class=\"cadeia\">\n    \u003cspan class=\"elo e-menta\">\u003cb>As alunas\u003c/b>\u003csmall>sujeito\u003c/small>\u003c/span>\u003cspan class=\"seta-ig\" aria-hidden=\"true\">→\u003c/span>\n    \u003cspan class=\"elo e-lavanda\">\u003cb>pareciam\u003c/b>\u003csmall>verbo de ligação\u003c/small>\u003c/span>\u003cspan class=\"seta-ig\" aria-hidden=\"true\">→\u003c/span>\n    \u003cspan class=\"elo e-coral\">\u003cb>confiantes\u003c/b>\u003csmall>predicativo do sujeito\u003c/small>\u003c/span>\n  \u003c/div>\n  \u003cp class=\"ig-regra\">Pergunta decisiva: como o sujeito estava, ficou ou parecia?\u003c/p>\n\u003c/div>"},{"tipo":"quadro","estilo":"esquema","titulo":"Não confunda qualidade com objeto","html":"\u003cp>“O estudante ficou atento.” — atento informa estado do sujeito: predicativo do sujeito. “O estudante encontrou o livro.” — livro recebe a ação de encontrar: objeto direto. Primeiro localize o verbo; depois pergunte se o termo atribui característica ao sujeito.\u003c/p>"}]},{"id":"1.3.2-s3","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Verbo de ligação","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Alguns verbos não indicam ação. Eles servem de \u003cstrong>ponte\u003c/strong> entre o sujeito e uma característica (qualidade, estado ou condição) desse sujeito. São os \u003cstrong>verbos de ligação\u003c/strong> (VL).\u003c/p>\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Verbo de ligação\u003c/th>\u003cth>Ideia que transmite\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>ser\u003c/td>\u003ctd>estado permanente, essência\u003c/td>\u003ctd>Ana \u003cstrong>é\u003c/strong> inteligente.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>estar\u003c/td>\u003ctd>estado passageiro\u003c/td>\u003ctd>Ana \u003cstrong>está\u003c/strong> cansada.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ficar\u003c/td>\u003ctd>mudança de estado\u003c/td>\u003ctd>Ana \u003cstrong>ficou\u003c/strong> nervosa.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>parecer\u003c/td>\u003ctd>aparência de estado\u003c/td>\u003ctd>Ana \u003cstrong>parece\u003c/strong> tranquila.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>permanecer / continuar\u003c/td>\u003ctd>continuidade do estado\u003c/td>\u003ctd>Ana \u003cstrong>permaneceu\u003c/strong> calma. / Ana \u003cstrong>continua\u003c/strong> doente.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>andar\u003c/td>\u003ctd>estado frequente\u003c/td>\u003ctd>Ana \u003cstrong>anda\u003c/strong> preocupada.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tornar-se / virar\u003c/td>\u003ctd>mudança de estado\u003c/td>\u003ctd>Ana \u003cstrong>tornou-se\u003c/strong> médica. / O dia \u003cstrong>virou\u003c/strong> noite.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.3.2-s4","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"O predicativo do sujeito","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>\u003cstrong>Predicativo do sujeito\u003c/strong> é o termo que atribui uma característica ou estado ao sujeito, ligado a ele por um verbo de ligação.\u003c/p>"},{"tipo":"img","src":"img:p_predicativo","legenda":"Sujeito + verbo de ligação + predicativo do sujeito."},{"tipo":"html","html":"\u003cp>O predicativo pode ser:\u003c/p>\u003cul>\u003cli>\u003cstrong>adjetivo:\u003c/strong> “O bolo está \u003cem>gostoso\u003c/em>.”\u003c/li>\u003cli>\u003cstrong>substantivo:\u003c/strong> “Meu tio é \u003cem>professor\u003c/em>.”\u003c/li>\u003cli>\u003cstrong>pronome:\u003c/strong> “A dúvida é \u003cem>esta\u003c/em>.”\u003c/li>\u003cli>\u003cstrong>numeral:\u003c/strong> “Os convidados eram \u003cem>cinco\u003c/em>.”\u003c/li>\u003cli>\u003cstrong>locução:\u003c/strong> “A torta é \u003cem>de morango\u003c/em>.”\u003c/li>\u003c/ul>\u003cp>O predicativo \u003cstrong>concorda com o sujeito\u003c/strong>: “O menino está \u003cem>cansado\u003c/em>.” / “As meninas estão \u003cem>cansadas\u003c/em>.”\u003c/p>"}]},{"id":"1.3.2-s5","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"O mesmo verbo pode ser de ligação ou não","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>O que define o verbo de ligação é a \u003cstrong>função na frase\u003c/strong>: ligar o sujeito a uma característica. Compare:\u003c/p>\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Verbo de ligação (característica)\u003c/th>\u003cth>Verbo significativo (ação ou lugar)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ela \u003cstrong>está\u003c/strong> feliz. (estado)\u003c/td>\u003ctd>Ela \u003cstrong>está\u003c/strong> na escola. (lugar → verbo intransitivo + adjunto adverbial)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ele \u003cstrong>ficou\u003c/strong> nervoso. (mudança de estado)\u003c/td>\u003ctd>Ele \u003cstrong>ficou\u003c/strong> em casa. (permaneceu num lugar)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ela \u003cstrong>anda\u003c/strong> triste. (estado frequente)\u003c/td>\u003ctd>Ela \u003cstrong>anda\u003c/strong> na praia todas as manhãs. (caminha)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>O menino \u003cstrong>virou\u003c/strong> atleta. (tornou-se)\u003c/td>\u003ctd>O menino \u003cstrong>virou\u003c/strong> a página. (ação → VTD)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Os alunos \u003cstrong>continuam\u003c/strong> atentos.\u003c/td>\u003ctd>Os alunos \u003cstrong>continuam\u003c/strong> a lição. (VTD)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"tipo":"quadro","estilo":"dica","titulo":"Teste rápido","html":"\u003cp>Troque o verbo por \u003cstrong>é\u003c/strong> ou \u003cstrong>está\u003c/strong>. Se a frase continuar atribuindo uma característica ao sujeito, o verbo é de ligação e o termo depois dele é predicativo.\u003c/p>\u003cp>“Ele ficou nervoso” → “Ele está nervoso” (funciona: VL).  “Ele ficou em casa” → “Ele está em casa” indica lugar, não característica (não é VL).\u003c/p>"}]},{"id":"1.3.2-s6","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Tipos de predicado","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Predicado\u003c/th>\u003cth>Núcleo\u003c/th>\u003cth>Estrutura\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Nominal\u003c/td>\u003ctd>o predicativo (um nome)\u003c/td>\u003ctd>verbo de ligação + predicativo do sujeito\u003c/td>\u003ctd>A prova \u003cstrong>estava difícil\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Verbal\u003c/td>\u003ctd>o verbo significativo\u003c/td>\u003ctd>verbo de ação (com ou sem complemento)\u003c/td>\u003ctd>Os alunos \u003cstrong>fizeram a prova\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Verbo-nominal\u003c/td>\u003ctd>o verbo e o predicativo\u003c/td>\u003ctd>verbo de ação + predicativo do sujeito\u003c/td>\u003ctd>Os alunos \u003cstrong>saíram felizes\u003c/strong> da prova.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>No predicado verbo-nominal, o verbo indica uma ação (\u003cem>saíram\u003c/em>) e, ao mesmo tempo, há uma característica do sujeito (\u003cem>felizes\u003c/em>): eles saíram \u003cstrong>e\u003c/strong> estavam felizes.\u003c/p>"}]},{"id":"1.3.2-s7","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Efeitos de sentido dos verbos de ligação","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Trocar o verbo de ligação muda o sentido. “Ele \u003cstrong>é\u003c/strong> nervoso” (característica permanente) é diferente de “Ele \u003cstrong>está\u003c/strong> nervoso” (estado passageiro) e de “Ele \u003cstrong>ficou\u003c/strong> nervoso” (mudou de estado em certo momento). Em textos, essa escolha mostra como o autor vê o personagem.\u003c/p>"}]},{"id":"1.3.2-s8","video":{"url":"","sugestao":"Professora Pamba: Pamba predicado nominal verbal verbo-nominal","link":"https://www.youtube.com/results?search_query=Pamba%20predicado%20nominal%20verbal%20verbo-nominal"},"tipo":"leitura","titulo":"Fique atento e resumo","check":"Revisei o resumo","itens":[{"tipo":"quadro","estilo":"atencao","titulo":"Fique atento: erros mais comuns","html":"\u003cul>\u003cli>Considerar “estar” sempre de ligação: “Ela está \u003cstrong>na escola\u003c/strong>” indica lugar, não característica.\u003c/li>\u003cli>Esquecer a concordância do predicativo: “As salas ficaram \u003cstrong>limpas\u003c/strong>” (e não “limpo”).\u003c/li>\u003cli>Confundir predicativo com objeto direto: o objeto completa um verbo de ação; o predicativo caracteriza o sujeito.\u003c/li>\u003cli>Achar que só adjetivo pode ser predicativo: substantivo, pronome e numeral também podem.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"resumo","titulo":"Resumo para revisar","html":"\u003cul>\u003cli>Verbos de ligação: ser, estar, ficar, parecer, permanecer, continuar, andar, tornar-se, virar.\u003c/li>\u003cli>Predicativo do sujeito: característica do sujeito ligada por verbo de ligação.\u003c/li>\u003cli>Predicado nominal: VL + predicativo. Verbal: verbo de ação. Verbo-nominal: verbo de ação + predicativo.\u003c/li>\u003cli>O predicativo concorda com o sujeito.\u003c/li>\u003cli>Teste: troque o verbo por “é/está”.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"saiba","titulo":"Para saber mais","html":"\u003cul>\u003cli>\u003ca href=\"https://www.todamateria.com.br/predicativo-do-sujeito/\" target=\"_blank\" rel=\"noopener\">Toda Matéria — Predicativo do sujeito\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.todamateria.com.br/verbos-de-ligacao/\" target=\"_blank\" rel=\"noopener\">Toda Matéria — Verbos de ligação\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.todamateria.com.br/predicado-nominal/\" target=\"_blank\" rel=\"noopener\">Toda Matéria — Predicado nominal\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professor Noslen\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=predicativo%20do%20sujeito\" target=\"_blank\" rel=\"noopener\">buscar “predicativo do sujeito”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professora Pamba\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=Pamba%20predicado%20nominal%20verbal%20verbo-nominal\" target=\"_blank\" rel=\"noopener\">buscar “Pamba predicado nominal verbal verbo-nominal”\u003c/a>\u003c/li>\u003c/ul>"}]},{"id":"1.3.2-s9","video":{"url":"","sugestao":""},"tipo":"exemplos","titulo":"Exemplos resolvidos","check":"Vi os exemplos","itens":[{"tipo":"exemplo","nivel":"facil","enun":"\u003cp>Identifique o sujeito, o verbo de ligação e o predicativo: “O céu está nublado.”\u003c/p>","res":"\u003cp>Sujeito: \u003cstrong>o céu\u003c/strong>. Verbo de ligação: \u003cstrong>está\u003c/strong> (estado passageiro). Predicativo do sujeito: \u003cstrong>nublado\u003c/strong> (adjetivo).\u003c/p>"},{"tipo":"exemplo","nivel":"medio","enun":"\u003cp>Em qual frase “ficar” é verbo de ligação? (I) “Ficamos no hotel.” (II) “Ficamos preocupados.”\u003c/p>","res":"\u003cp>(I) indica lugar onde permaneceram: verbo significativo (intransitivo) + adjunto adverbial.\u003c/p>\u003cp>(II) indica mudança de estado: \u003cstrong>verbo de ligação\u003c/strong>; “preocupados” é predicativo do sujeito (nós).\u003c/p>"},{"tipo":"exemplo","nivel":"dificil","enun":"\u003cp>Classifique o predicado: “As crianças voltaram cansadas do passeio.”\u003c/p>","res":"\u003cp>“Voltaram” é verbo de ação (intransitivo). “Cansadas” atribui um estado ao sujeito \u003cem>as crianças\u003c/em>: predicativo do sujeito.\u003c/p>\u003cp>Há verbo significativo + predicativo: \u003cstrong>predicado verbo-nominal\u003c/strong>.\u003c/p>"},{"tipo":"quadro","estilo":"caso","titulo":"Estudo de caso: Comparando predicativos","html":"\u003cp>“A equipe permaneceu calma.” “calma” descreve a equipe após verbo de ligação. “A equipe considerou a proposta boa.” “boa” descreve a proposta (objeto direto), portanto é predicativo do objeto — não do sujeito.\u003c/p>"}]},{"id":"1.3.2-s10","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Exercícios de fixação","check":"Fiz as questões","intro":"Resolva sem consultar a explicação. Nas questões de múltipla escolha, assinale apenas uma opção; nas atividades discursivas, registre uma justificativa curta. Confira o gabarito ao final.","itens":[{"tipo":"questao","id":"LP-05-q1","nivel":"facil","enun":"\u003cp>Em “O mar estava agitado”, o predicativo do sujeito é:\u003c/p>","opts":["o mar","agitado","estava","não há predicativo"],"ans":"B","exp":"“Agitado” atribui um estado ao sujeito \u003cem>o mar\u003c/em>, ligado pelo verbo de ligação \u003cem>estava\u003c/em>."},{"tipo":"questao","id":"LP-05-q2","nivel":"facil","enun":"\u003cp>Em qual frase há verbo de ligação?\u003c/p>","opts":["Pedro correu na praça.","Pedro comeu pão.","Pedro parece cansado.","Pedro saiu cedo."],"ans":"C","exp":"“Parece” liga o sujeito à característica \u003cem>cansado\u003c/em>. Nas outras, os verbos indicam ação."},{"tipo":"questao","id":"LP-05-q3","nivel":"medio","enun":"\u003cp>Em “Minha irmã tornou-se uma ótima médica”, o predicativo do sujeito é:\u003c/p>","opts":["minha irmã","tornou-se","ótima","uma ótima médica"],"ans":"D","exp":"O predicativo é toda a expressão “uma ótima médica” (núcleo: o substantivo \u003cem>médica\u003c/em>), que caracteriza o sujeito."},{"tipo":"questao","id":"LP-05-q4","nivel":"facil","discursiva":true,"linhas":4,"enun":"\u003cp>Separe sujeito, verbo de ligação e predicativo: (a) “Os exercícios eram fáceis.” (b) “A sala ficou silenciosa.” (c) “Você continua o mesmo.”\u003c/p>","resposta":"(a) Os exercícios | eram | fáceis. (b) A sala | ficou | silenciosa. (c) Você | continua | o mesmo.","exp":"Um terço de ponto por item."},{"tipo":"questao","id":"LP-05-q5","nivel":"medio","enun":"\u003cp>Em qual frase o verbo NÃO é de ligação?\u003c/p>","opts":["Ela está na escola.","Ela está feliz.","Ela anda preocupada.","Ela permaneceu calma."],"ans":"A","exp":"“Na escola” indica lugar, não característica do sujeito. Nas demais, há predicativo (feliz, preocupada, calma)."},{"tipo":"questao","id":"LP-05-q6","nivel":"dificil","enun":"\u003cp>Em “Os torcedores voltaram do estádio animados”, o termo “animados” e o tipo de predicado são:\u003c/p>","opts":["predicativo do sujeito; predicado verbo-nominal.","objeto direto; predicado verbal.","predicativo do sujeito; predicado nominal.","adjunto adverbial; predicado verbal."],"ans":"A","exp":"“Voltaram” é verbo de ação e “animados” caracteriza o sujeito: verbo + predicativo = predicado verbo-nominal."},{"tipo":"questao","id":"LP-05-q7","nivel":"medio","discursiva":true,"linhas":4,"enun":"\u003cp>Explique a diferença de sentido e de classificação do verbo “ficar” em: (I) “Ele ficou nervoso.” (II) “Ele ficou em casa.”\u003c/p>","resposta":"(I) Verbo de ligação: indica mudança de estado; “nervoso” é predicativo do sujeito. (II) Verbo significativo (intransitivo): indica permanência num lugar; “em casa” é adjunto adverbial de lugar.","exp":"Meio ponto para cada frase bem explicada."},{"tipo":"questao","id":"LP-05-q8","nivel":"facil","enun":"\u003cp>Complete com a forma correta: “As meninas estavam ______ depois da corrida.”\u003c/p>","opts":["cansado","cansada","cansados","cansadas"],"ans":"D","exp":"O predicativo concorda com o sujeito \u003cem>as meninas\u003c/em> (feminino plural)."},{"tipo":"questao","id":"LP-05-q9","nivel":"medio","enun":"\u003cp>Em qual frase o predicativo do sujeito é um pronome?\u003c/p>","opts":["O bolo está gostoso.","Os convidados eram cinco.","A dúvida é esta.","Ana é estudante."],"ans":"C","exp":"“Esta” é pronome demonstrativo. Em (A) é adjetivo; em (B), numeral; em (D), substantivo."},{"tipo":"questao","id":"LP-05-q10","nivel":"dificil","enun":"\u003cp>O predicado de “O dia amanheceu chuvoso” é:\u003c/p>","opts":["nominal, pois “amanheceu” é de ligação.","verbo-nominal, pois há verbo de ação e predicativo do sujeito.","verbal, pois “chuvoso” é objeto direto.","verbal, pois não há predicativo."],"ans":"B","exp":"“Amanheceu” indica um acontecimento (verbo significativo) e “chuvoso” atribui característica ao sujeito \u003cem>o dia\u003c/em>: predicado verbo-nominal."},{"tipo":"questao","id":"LP-05-q11","nivel":"medio","enun":"\u003cp>Quantos predicativos do sujeito há em “A prova parecia difícil, mas os alunos estavam confiantes”?\u003c/p>","opts":["dois","nenhum","um","três"],"ans":"A","exp":"“Difícil” (sujeito: a prova; VL: parecia) e “confiantes” (sujeito: os alunos; VL: estavam)."},{"tipo":"questao","id":"LP-05-q12","nivel":"dificil","discursiva":true,"linhas":5,"enun":"\u003cp>Escreva três frases com o mesmo sujeito (“Meu irmão”) usando os verbos de ligação \u003cstrong>é\u003c/strong>, \u003cstrong>está\u003c/strong> e \u003cstrong>ficou\u003c/strong>, e explique como muda o sentido em cada uma.\u003c/p>","resposta":"Exemplo: “Meu irmão é calmo.” (característica permanente) / “Meu irmão está calmo.” (estado passageiro, agora) / “Meu irmão ficou calmo.” (mudou de estado, antes não estava).","exp":"Ponto inteiro com as três frases e as explicações; meio ponto sem explicação."}]},{"id":"1.3.2-s11","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Desafio extra: mais 6 questões objetivas","check":"Fiz o desafio","itens":[{"tipo":"questao","id":"LP-05-d13","nivel":"objetiva","enun":"\u003cp>Em “A tarde ficou silenciosa”, “silenciosa” é:\u003c/p>","opts":["predicativo do sujeito.","objeto direto.","adjunto adverbial.","pronome."],"ans":"A","exp":"A característica é atribuída ao sujeito “a tarde”."},{"tipo":"questao","id":"LP-05-d14","nivel":"objetiva","enun":"\u003cp>Em “Os atletas chegaram cansados”, “cansados” é:\u003c/p>","opts":["objeto indireto.","predicativo do sujeito.","vocativo.","sujeito."],"ans":"B","exp":"Cansados descreve o estado dos atletas no momento de chegar."},{"tipo":"questao","id":"LP-05-d15","nivel":"objetiva","enun":"\u003cp>Em “A professora considerou o texto excelente”, “excelente” é:\u003c/p>","opts":["predicativo do sujeito.","adjunto adverbial.","predicativo do objeto.","objeto indireto."],"ans":"C","exp":"A qualidade excelente é atribuída a “o texto”, objeto direto."},{"tipo":"questao","id":"LP-05-d16","nivel":"objetiva","enun":"\u003cp>Assinale a frase com verbo de ligação e predicativo do sujeito:\u003c/p>","opts":["O aluno comprou o livro.","O aluno leu ontem.","O aluno encontrou o amigo.","O aluno parecia tranquilo."],"ans":"D","exp":"Parecia liga o sujeito à propriedade tranquilo."},{"tipo":"questao","id":"LP-05-d17","nivel":"objetiva","enun":"\u003cp>Na frase “As janelas permaneceram abertas”, o núcleo do predicativo é:\u003c/p>","opts":["abertas.","janelas.","permaneceram.","as."],"ans":"A","exp":"Abertas atribui estado ao sujeito."},{"tipo":"questao","id":"LP-05-d18","nivel":"objetiva","enun":"\u003cp>Em “O dia amanheceu chuvoso”, “chuvoso” qualifica:\u003c/p>","opts":["a ação amanheceu.","o sujeito “o dia”.","um objeto direto oculto.","um objeto indireto."],"ans":"B","exp":"Chuvoso é predicativo do sujeito dia."}]}]},{"id":"1.3.3","cod":"LP-06","titulo":"Adjunto adnominal e complemento nominal","bncc":"EF08LP09, EF09LP07","tempo":"1h30","dia":"Dia 5 (25/10)","objetivo":"Identificar adjuntos adnominais e complementos nominais e diferenciá-los com segurança, inclusive quando ambos aparecem com preposição.","secoes":[{"id":"1.3.3-s1","video":{"url":"","sugestao":""},"tipo":"aquecimento","titulo":"Aquecimento","check":"Fiz o aquecimento","itens":[{"tipo":"flips","cartas":[{"frente":"Quais são os artigos definidos?","verso":"o, a, os, as."},{"frente":"Qual a diferença entre substantivo concreto e abstrato?","verso":"o concreto existe por si (mesa, fada); o abstrato depende de alguém ou de algo (amor, medo, crítica)."},{"frente":"O que é objeto indireto?","verso":"complemento com preposição de um verbo transitivo indireto (gosto \u003cstrong>de música\u003c/strong>)."}]}]},{"id":"1.3.3-s2","video":{"url":"","sugestao":"Professor Noslen: adjunto adnominal e complemento nominal","link":"https://www.youtube.com/results?search_query=adjunto%20adnominal%20e%20complemento%20nominal"},"tipo":"leitura","titulo":"Aprenda com o esquema","check":"Vi o esquema","itens":[{"tipo":"infografico","html":"\n\u003cdiv class=\"ig\">\n  \u003cp class=\"ig-titulo\">Do professor ≠ ao professor\u003c/p>\n  \u003cp class=\"ig-sub\">Vire os cartões e descubra quem age e quem recebe a ação.\u003c/p>\n  \u003cdiv class=\"cartas\">\n    \u003cbutton class=\"carta c-menta\" data-acao=\"virar\">\u003cspan class=\"frente\">\u003cb>A crítica do professor\u003c/b>\u003csmall>O professor critica ou é criticado?\u003c/small>\u003c/span>\u003cspan class=\"verso\">\u003cb>Adjunto adnominal\u003c/b>“Do professor” indica quem fez a crítica: é o agente.\u003c/span>\u003c/button>\n    \u003cbutton class=\"carta c-coral\" data-acao=\"virar\">\u003cspan class=\"frente\">\u003cb>A crítica ao professor\u003c/b>\u003csmall>O professor critica ou é criticado?\u003c/small>\u003c/span>\u003cspan class=\"verso\">\u003cb>Complemento nominal\u003c/b>“Ao professor” indica quem recebeu a crítica: é o alvo.\u003c/span>\u003c/button>\n  \u003c/div>\n  \u003cp class=\"ig-regra\">Pista: pergunte se o termo age (autor) ou recebe a ação (alvo).\u003c/p>\n\u003c/div>"},{"tipo":"quadro","estilo":"esquema","titulo":"A diferença entre agir e receber","html":"\u003cp>“A admiração dos estudantes” pode indicar que os estudantes ADMIRAM (adjunto adnominal). “A admiração aos estudantes” indica que eles SÃO ADMIRADOS (complemento nominal). Confira o sentido no contexto; o teste não substitui a interpretação da expressão.\u003c/p>"}]},{"id":"1.3.3-s3","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Os termos que se ligam a um nome","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Até aqui estudamos termos ligados ao \u003cstrong>verbo\u003c/strong> (objetos). Agora veremos termos ligados a um \u003cstrong>nome\u003c/strong>: substantivo, adjetivo ou advérbio. São dois: o \u003cstrong>adjunto adnominal\u003c/strong> e o \u003cstrong>complemento nominal\u003c/strong>.\u003c/p>"}]},{"id":"1.3.3-s4","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Adjunto adnominal (AA)","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>É o termo que \u003cstrong>acompanha um substantivo\u003c/strong> para caracterizá-lo, determiná-lo ou especificá-lo. É um \u003cstrong>termo acessório\u003c/strong>: se for retirado, a frase continua com sentido.\u003c/p>\u003cp>Podem ser adjuntos adnominais:\u003c/p>\u003cul>\u003cli>\u003cstrong>artigos:\u003c/strong> \u003cem>o\u003c/em> livro, \u003cem>uma\u003c/em> casa;\u003c/li>\u003cli>\u003cstrong>adjetivos:\u003c/strong> livro \u003cem>novo\u003c/em>, casa \u003cem>antiga\u003c/em>;\u003c/li>\u003cli>\u003cstrong>pronomes adjetivos:\u003c/strong> \u003cem>meu\u003c/em> livro, \u003cem>aquela\u003c/em> casa, \u003cem>alguns\u003c/em> amigos;\u003c/li>\u003cli>\u003cstrong>numerais:\u003c/strong> \u003cem>dois\u003c/em> livros, \u003cem>terceira\u003c/em> casa;\u003c/li>\u003cli>\u003cstrong>locuções adjetivas:\u003c/strong> casa \u003cem>de madeira\u003c/em>, anel \u003cem>de ouro\u003c/em>, livro \u003cem>de Ana\u003c/em>.\u003c/li>\u003c/ul>\u003cp class=\"frase-exemplo\">“\u003cstrong>Os\u003c/strong> \u003cstrong>meus\u003c/strong> \u003cstrong>dois\u003c/strong> gatos \u003cstrong>pretos\u003c/strong> fugiram.” → os, meus, dois e pretos são adjuntos adnominais do núcleo \u003cem>gatos\u003c/em>.\u003c/p>"}]},{"id":"1.3.3-s5","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Complemento nominal (CN)","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>É o termo que \u003cstrong>completa o sentido\u003c/strong> de um nome que, sozinho, fica incompleto, como acontece com muitos verbos. É um \u003cstrong>termo integrante\u003c/strong> e vem \u003cstrong>sempre com preposição\u003c/strong>.\u003c/p>\u003cp>O complemento nominal se liga a:\u003c/p>\u003cul>\u003cli>\u003cstrong>substantivos abstratos:\u003c/strong> medo \u003cem>de altura\u003c/em>, amor \u003cem>à pátria\u003c/em>, necessidade \u003cem>de ajuda\u003c/em>, respeito \u003cem>aos mais velhos\u003c/em>;\u003c/li>\u003cli>\u003cstrong>adjetivos:\u003c/strong> útil \u003cem>à população\u003c/em>, fiel \u003cem>aos amigos\u003c/em>, cheio \u003cem>de água\u003c/em>, favorável \u003cem>ao projeto\u003c/em>;\u003c/li>\u003cli>\u003cstrong>advérbios:\u003c/strong> favoravelmente \u003cem>à proposta\u003c/em>, longe \u003cem>de casa\u003c/em>, perto \u003cem>da escola\u003c/em>.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"regra","titulo":"Por que o complemento é “necessário”?","html":"\u003cp>Quem tem medo, tem medo \u003cstrong>de\u003c/strong> algo. Quem é útil, é útil \u003cstrong>a\u003c/strong> alguém. Sem o complemento, a ideia fica incompleta: “Tenho medo.” (De quê?). Compare com o verbo: “Temo \u003cstrong>o escuro\u003c/strong>” (objeto) → “Tenho medo \u003cstrong>do escuro\u003c/strong>” (complemento nominal).\u003c/p>"}]},{"id":"1.3.3-s6","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Como diferenciar quando os dois têm preposição","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>O difícil é quando aparece \u003cstrong>nome + preposição + termo\u003c/strong>, como “a crítica \u003cem>do professor\u003c/em>” e “a crítica \u003cem>ao professor\u003c/em>”. Use o fluxograma:\u003c/p>"},{"tipo":"img","src":"img:p_adj_comp","legenda":"Fluxograma para diferenciar adjunto adnominal e complemento nominal."},{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Situação\u003c/th>\u003cth>Classificação\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Termo ligado a \u003cstrong>adjetivo\u003c/strong> ou \u003cstrong>advérbio\u003c/strong>\u003c/td>\u003ctd>Complemento nominal\u003c/td>\u003ctd>útil \u003cstrong>ao povo\u003c/strong>; perto \u003cstrong>da praia\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Termo ligado a \u003cstrong>substantivo concreto\u003c/strong>\u003c/td>\u003ctd>Adjunto adnominal\u003c/td>\u003ctd>casa \u003cstrong>de madeira\u003c/strong>; copo \u003cstrong>de vidro\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Termo indica \u003cstrong>posse\u003c/strong>\u003c/td>\u003ctd>Adjunto adnominal\u003c/td>\u003ctd>o livro \u003cstrong>de Ana\u003c/strong>; a mochila \u003cstrong>do aluno\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Substantivo abstrato + termo que \u003cstrong>pratica\u003c/strong> a ação (agente)\u003c/td>\u003ctd>Adjunto adnominal\u003c/td>\u003ctd>a resposta \u003cstrong>do aluno\u003c/strong> (o aluno respondeu)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Substantivo abstrato + termo que \u003cstrong>recebe\u003c/strong> a ação (paciente)\u003c/td>\u003ctd>Complemento nominal\u003c/td>\u003ctd>a resposta \u003cstrong>à pergunta\u003c/strong> (a pergunta foi respondida)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>Mais pares para comparar:\u003c/p>\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Adjunto adnominal (agente)\u003c/th>\u003cth>Complemento nominal (paciente)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>a invenção \u003cstrong>de Santos Dumont\u003c/strong> (ele inventou)\u003c/td>\u003ctd>a invenção \u003cstrong>do avião\u003c/strong> (o avião foi inventado)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a crítica \u003cstrong>do jornalista\u003c/strong> (ele criticou)\u003c/td>\u003ctd>a crítica \u003cstrong>ao governo\u003c/strong> (o governo foi criticado)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>o amor \u003cstrong>de mãe\u003c/strong> (a mãe ama)\u003c/td>\u003ctd>o amor \u003cstrong>aos filhos\u003c/strong> (os filhos são amados)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>a descoberta \u003cstrong>do cientista\u003c/strong>\u003c/td>\u003ctd>a descoberta \u003cstrong>da vacina\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.3.3-s7","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Complemento nominal × objeto indireto","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Os dois têm preposição. A diferença é \u003cstrong>a quem eles completam\u003c/strong>: o objeto indireto completa um \u003cstrong>verbo\u003c/strong>; o complemento nominal completa um \u003cstrong>nome\u003c/strong>.\u003c/p>\u003cp class=\"frase-exemplo\">“Necessitamos \u003cstrong>de ajuda\u003c/strong>.” → completa o verbo \u003cem>necessitamos\u003c/em>: \u003cstrong>objeto indireto\u003c/strong>.\u003c/p>\u003cp class=\"frase-exemplo\">“Temos necessidade \u003cstrong>de ajuda\u003c/strong>.” → completa o substantivo \u003cem>necessidade\u003c/em>: \u003cstrong>complemento nominal\u003c/strong>.\u003c/p>"}]},{"id":"1.3.3-s8","video":{"url":"","sugestao":"Professora Pamba: Pamba diferença adjunto adnominal complemento nominal","link":"https://www.youtube.com/results?search_query=Pamba%20diferen%C3%A7a%20adjunto%20adnominal%20complemento%20nominal"},"tipo":"leitura","titulo":"Fique atento e resumo","check":"Revisei o resumo","itens":[{"tipo":"quadro","estilo":"atencao","titulo":"Fique atento: erros mais comuns","html":"\u003cul>\u003cli>Achar que todo termo com preposição é complemento nominal: “casa \u003cstrong>de madeira\u003c/strong>” é adjunto adnominal.\u003c/li>\u003cli>Esquecer que complemento nominal \u003cstrong>sempre\u003c/strong> tem preposição; adjunto adnominal pode ter ou não.\u003c/li>\u003cli>Confundir complemento nominal com objeto indireto: veja se o termo completa um nome ou um verbo.\u003c/li>\u003cli>Em substantivo abstrato, não fazer a pergunta-chave: o termo pratica (AA) ou recebe (CN) a ação?\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"resumo","titulo":"Resumo para revisar","html":"\u003cul>\u003cli>Adjunto adnominal: acompanha substantivo e o caracteriza (artigo, adjetivo, pronome, numeral, locução adjetiva). Acessório.\u003c/li>\u003cli>Complemento nominal: completa substantivo abstrato, adjetivo ou advérbio. Sempre com preposição. Integrante.\u003c/li>\u003cli>Ligado a adjetivo/advérbio → CN. Substantivo concreto ou posse → AA.\u003c/li>\u003cli>Substantivo abstrato: agente → AA; paciente → CN.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"saiba","titulo":"Para saber mais","html":"\u003cul>\u003cli>\u003ca href=\"https://www.todamateria.com.br/adjunto-adnominal-e-complemento-nominal-diferenca/\" target=\"_blank\" rel=\"noopener\">Toda Matéria — Adjunto adnominal e complemento nominal: qual a diferença?\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professor Noslen\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=adjunto%20adnominal%20e%20complemento%20nominal\" target=\"_blank\" rel=\"noopener\">buscar “adjunto adnominal e complemento nominal”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professora Pamba\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=Pamba%20diferen%C3%A7a%20adjunto%20adnominal%20complemento%20nominal\" target=\"_blank\" rel=\"noopener\">buscar “Pamba diferença adjunto adnominal complemento nominal”\u003c/a>\u003c/li>\u003c/ul>"}]},{"id":"1.3.3-s9","video":{"url":"","sugestao":""},"tipo":"exemplos","titulo":"Exemplos resolvidos","check":"Vi os exemplos","itens":[{"tipo":"exemplo","nivel":"facil","enun":"\u003cp>Identifique os adjuntos adnominais: “Aqueles dois alunos novos chegaram.”\u003c/p>","res":"\u003cp>Núcleo do sujeito: \u003cem>alunos\u003c/em>. Adjuntos adnominais: \u003cstrong>aqueles\u003c/strong> (pronome demonstrativo), \u003cstrong>dois\u003c/strong> (numeral), \u003cstrong>novos\u003c/strong> (adjetivo).\u003c/p>"},{"tipo":"exemplo","nivel":"medio","enun":"\u003cp>Classifique o termo destacado: “Este livro é útil \u003cstrong>aos estudantes\u003c/strong>.”\u003c/p>","res":"\u003cp>O termo se liga ao adjetivo \u003cem>útil\u003c/em> (útil a quem?). Termo ligado a adjetivo, com preposição: \u003cstrong>complemento nominal\u003c/strong>.\u003c/p>"},{"tipo":"exemplo","nivel":"dificil","enun":"\u003cp>Classifique: “A crítica \u003cstrong>do jornalista\u003c/strong> \u003cstrong>ao governo\u003c/strong> foi dura.”\u003c/p>","res":"\u003cp>\u003cem>Crítica\u003c/em> é substantivo abstrato. Quem critica? o jornalista → agente → \u003cstrong>adjunto adnominal\u003c/strong>.\u003c/p>\u003cp>Quem é criticado? o governo → paciente → \u003cstrong>complemento nominal\u003c/strong>.\u003c/p>"},{"tipo":"quadro","estilo":"caso","titulo":"Estudo de caso: Entender a ação escondida num nome","html":"\u003cp>“A defesa do advogado” frequentemente significa “o advogado defende”: “do advogado” é agente, logo adjunto adnominal. “A defesa ao advogado” aponta para alguém que é defendido: complemento nominal. O contexto pode alterar a leitura; não confie só na preposição.\u003c/p>"}]},{"id":"1.3.3-s10","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Exercícios de fixação","check":"Fiz as questões","intro":"Resolva sem consultar a explicação. Nas questões de múltipla escolha, assinale apenas uma opção; nas atividades discursivas, registre uma justificativa curta. Confira o gabarito ao final.","itens":[{"tipo":"questao","id":"LP-06-q1","nivel":"facil","enun":"\u003cp>Na frase “O meu cachorro preto fugiu”, os adjuntos adnominais são:\u003c/p>","opts":["cachorro, preto","meu, fugiu","o, meu, preto","o, cachorro"],"ans":"C","exp":"Artigo (o), pronome possessivo (meu) e adjetivo (preto) acompanham o núcleo \u003cem>cachorro\u003c/em>."},{"tipo":"questao","id":"LP-06-q2","nivel":"faci
