io da frase\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.5.1-s10","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Texto-modelo comentado","check":"Li esta parte","itens":[{"tipo":"texto","titulo":"O último ônibus","html":"\u003cp>Faltavam dez minutos para as dez da noite quando Lara percebeu que tinha esquecido a mochila no banco da praça. Dentro dela estavam o caderno de Matemática, a carteira e a chave de casa. O último ônibus para o seu bairro passava às dez em ponto.\u003c/p>\u003cp>Ela correu de volta pelas ruas molhadas pela chuva. O coração batia tão forte que parecia querer chegar antes dela. Quando avistou o banco, ele estava vazio.\u003c/p>\u003cp>— Procurando isto? — perguntou uma voz atrás dela.\u003c/p>\u003cp>Era seu Antônio, o pipoqueiro da esquina, segurando a mochila azul com as duas mãos. Ele contou que tinha visto a bolsa sozinha e decidido esperar, porque “quem perde uma mochila sempre volta”. Lara agradeceu, mas olhou o relógio: 21h58.\u003c/p>\u003cp>Os dois correram até o ponto. O ônibus já fechava as portas quando seu Antônio levantou o braço e gritou o nome do motorista, que era seu cliente de todas as noites. As portas se abriram de novo.\u003c/p>\u003cp>Sentada perto da janela, Lara abraçou a mochila e sorriu. Naquela noite, descobriu que a cidade, que parecia tão grande, também cabia no gesto de um vizinho atento.\u003c/p>","fonte":"Texto escrito para esta apostila."},{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Parágrafo\u003c/th>\u003cth>Função\u003c/th>\u003cth>O que observar\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Situação inicial + conflito\u003c/td>\u003ctd>Já começa com o problema e um prazo (cria tensão). Apresenta personagem, tempo e espaço.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Desenvolvimento\u003c/td>\u003ctd>Detalhes sensoriais (ruas molhadas) e personificação (o coração “parecia querer chegar antes”).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3 e 4\u003c/td>\u003ctd>Virada\u003c/td>\u003ctd>Diálogo com travessão; novo personagem; retomada (“a mochila azul”); conectivo de oposição (mas).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Clímax\u003c/td>\u003ctd>Momento de maior tensão: o ônibus fechando as portas.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Desfecho\u003c/td>\u003ctd>Resolve o conflito e traz uma reflexão coerente com a história.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.5.1-s11","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Checklist de revisão (use antes de passar a limpo)","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cul>\u003cli>☐ O título é criativo e está centralizado?\u003c/li>\u003cli>☐ A história tem situação inicial, conflito, clímax e desfecho?\u003c/li>\u003cli>☐ Cada parágrafo começa com recuo e trata de um momento?\u003c/li>\u003cli>☐ Usei conectivos e evitei repetir palavras?\u003c/li>\u003cli>☐ Há alguma contradição na história?\u003c/li>\u003cli>☐ Usei maiúscula no início das frases e nos nomes próprios?\u003c/li>\u003cli>☐ Revisei pontuação, travessões e vírgulas?\u003c/li>\u003cli>☐ Conferi acentos e palavras de grafia difícil?\u003c/li>\u003c/ul>"}]},{"id":"1.5.1-s12","video":{"url":"","sugestao":"Professora Pamba: Pamba como fazer uma narração","link":"https://www.youtube.com/results?search_query=Pamba%20como%20fazer%20uma%20narra%C3%A7%C3%A3o"},"tipo":"leitura","titulo":"Fique atento e resumo","check":"Revisei o resumo","itens":[{"tipo":"quadro","estilo":"atencao","titulo":"Fique atento: erros mais comuns","html":"\u003cul>\u003cli>Começar a escrever sem planejar: a história perde o rumo e o final fica apressado.\u003c/li>\u003cli>Escrever tudo em um só parágrafo, ou mudar de parágrafo a cada frase.\u003c/li>\u003cli>Terminar com “e então ela acordou, era tudo um sonho”: costuma ser visto como pouco criativo, a menos que seja muito bem preparado.\u003c/li>\u003cli>Repetir o mesmo nome ou o mesmo conectivo (“e aí… e aí…”) em todas as frases.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"resumo","titulo":"Resumo para revisar","html":"\u003cul>\u003cli>Planeje: quem, onde/quando, problema, ações, final.\u003c/li>\u003cli>Estrutura: situação inicial → conflito → desenvolvimento → clímax → desfecho.\u003c/li>\u003cli>4 a 6 parágrafos, cada um com uma função; conectivos e retomadas.\u003c/li>\u003cli>Título centralizado, recuo, margens, letra legível, sem rasuras.\u003c/li>\u003cli>Revise com o checklist antes de passar a limpo.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"saiba","titulo":"Para saber mais","html":"\u003cul>\u003cli>\u003ca href=\"https://brasilescola.uol.com.br\" target=\"_blank\" rel=\"noopener\">Brasil Escola — seção de Redação (busque “texto narrativo”)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.todamateria.com.br\" target=\"_blank\" rel=\"noopener\">Toda Matéria — busque “elementos da narrativa” e “coesão e coerência”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professor Noslen\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=texto%20narrativo%20elementos%20da%20narrativa\" target=\"_blank\" rel=\"noopener\">buscar “texto narrativo elementos da narrativa”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professora Pamba\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=Pamba%20como%20fazer%20uma%20narra%C3%A7%C3%A3o\" target=\"_blank\" rel=\"noopener\">buscar “Pamba como fazer uma narração”\u003c/a>\u003c/li>\u003c/ul>"}]},{"id":"1.5.1-s13","video":{"url":"","sugestao":""},"tipo":"exemplos","titulo":"Exemplos resolvidos","check":"Vi os exemplos","itens":[{"tipo":"exemplo","nivel":"facil","enun":"\u003cp>Reescreva com um início mais criativo: “Era uma vez um menino chamado Davi que gostava de futebol.”\u003c/p>","res":"\u003cp>Possível reescrita: “A bola bateu na trave pela terceira vez, e Davi jurou que, no próximo chute, ninguém ia rir dele.”\u003c/p>\u003cp>O novo início já coloca o leitor dentro de uma ação e sugere um conflito.\u003c/p>"},{"tipo":"exemplo","nivel":"medio","enun":"\u003cp>Evite as repetições: “O cachorro latiu. O cachorro correu para o portão. O cachorro pulou no menino.”\u003c/p>","res":"\u003cp>“O cachorro latiu e \u003cstrong>correu\u003c/strong> para o portão. Em seguida, \u003cstrong>o animal\u003c/strong> pulou no menino, abanando o rabo.”\u003c/p>\u003cp>Juntamos frases com conectivo (\u003cem>e\u003c/em>, \u003cem>em seguida\u003c/em>) e usamos um sinônimo (\u003cem>o animal\u003c/em>).\u003c/p>"},{"tipo":"exemplo","nivel":"dificil","enun":"\u003cp>Aponte a incoerência: “Naquela manhã ensolarada, Marina saiu sem guarda-chuva. Ao meio-dia, a lua iluminava a rua, e ela voltou para casa sem pressa.”\u003c/p>","res":"\u003cp>Ao meio-dia não há lua iluminando a rua: há uma \u003cstrong>contradição de tempo\u003c/strong>. Correção possível: “Ao meio-dia, o sol forte iluminava a rua…”.\u003c/p>"},{"tipo":"quadro","estilo":"caso","titulo":"Estudo de caso: Da ideia ao parágrafo coerente","html":"\u003cp>Ideia vaga: “A menina foi à escola e aconteceu uma coisa”. Versão concreta: “Na sexta-feira, Júlia encontrou um envelope azul no corredor da escola. Ao ler o nome escrito nele, percebeu que a mensagem não era destinada a ela”. Tempo, espaço, personagem e início de conflito aparecem de forma clara.\u003c/p>"}]},{"id":"1.5.1-s14","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Exercícios de fixação","check":"Fiz as questões","intro":"Resolva sem consultar a explicação. Nas questões de múltipla escolha, assinale apenas uma opção; nas atividades discursivas, registre uma justificativa curta. Confira o gabarito ao final.","itens":[{"tipo":"questao","id":"LP-10-q1","nivel":"facil","enun":"\u003cp>Qual é a ordem correta das partes de uma narrativa?\u003c/p>","opts":["clímax, situação inicial, desfecho, conflito","conflito, desfecho, situação inicial, clímax","situação inicial, conflito, clímax, desfecho","desfecho, clímax, conflito, situação inicial"],"ans":"C","exp":"A narrativa parte do equilíbrio, passa pelo problema, chega ao momento de maior tensão e se resolve."},{"tipo":"questao","id":"LP-10-q2","nivel":"facil","enun":"\u003cp>Em qual frase o uso de maiúsculas e minúsculas está correto?\u003c/p>","opts":["No sábado, Ana e Pedro viajaram para a Bahia.","No Sábado, Ana e Pedro viajaram para a Bahia.","no sábado, ana e pedro viajaram para a bahia.","No sábado, Ana e Pedro Viajaram para a Bahia."],"ans":"A","exp":"Dia da semana em minúscula; início de frase e nomes próprios (Ana, Pedro, Bahia) em maiúscula; o verbo no meio da frase fica em minúscula."},{"tipo":"questao","id":"LP-10-q3","nivel":"medio","enun":"\u003cp>Qual reescrita evita a repetição em “Júlia abriu a caixa. Júlia viu um filhote. Júlia gritou de alegria.”?\u003c/p>","opts":["Júlia abriu a caixa, Júlia viu um filhote e Júlia gritou de alegria.","Júlia abriu a caixa, viu um filhote e gritou de alegria.","Abriu a caixa. Viu um filhote. Gritou.","Júlia, abriu a caixa, viu, um filhote e gritou."],"ans":"B","exp":"O sujeito aparece uma vez e as ações são ligadas por vírgulas e pelo “e”. (D) erra a pontuação; (C) perde o personagem."},{"tipo":"questao","id":"LP-10-q4","nivel":"facil","discursiva":true,"linhas":4,"enun":"\u003cp>O texto a seguir foi escrito em um parágrafo só. Indique com uma barra ( / ) onde deveriam começar os novos parágrafos: “Era o primeiro dia de aula de Tiago na escola nova. Ele não conhecia ninguém. Na hora do recreio, percebeu que tinha esquecido o lanche em casa. Ficou sentado sozinho, com fome. De repente, uma menina se aproximou e ofereceu metade do seu sanduíche. No fim do dia, Tiago já tinha uma amiga.”\u003c/p>","resposta":"Novos parágrafos antes de “Na hora do recreio” (conflito), antes de “De repente” (virada) e antes de “No fim do dia” (desfecho).","exp":"Aceite pequenas variações, desde que cada parágrafo corresponda a um momento da história."},{"tipo":"questao","id":"LP-10-q5","nivel":"medio","enun":"\u003cp>Complete com o conectivo adequado: “Choveu a manhã inteira; ______, o jogo foi adiado.”\u003c/p>","opts":["mas","embora","enquanto","por isso"],"ans":"D","exp":"O adiamento é consequência da chuva: “por isso”."},{"tipo":"questao","id":"LP-10-q6","nivel":"dificil","enun":"\u003cp>Qual trecho apresenta um problema de coerência?\u003c/p>","opts":["Estava com frio, então vestiu o casaco.","Perdeu o ônibus, por isso chegou atrasada.","Era meia-noite e o sol queimava a pele de quem passava na rua.","Embora cansado, terminou a corrida."],"ans":"C","exp":"À meia-noite não há sol: contradição de tempo."},{"tipo":"questao","id":"LP-10-q7","nivel":"medio","discursiva":true,"linhas":5,"enun":"\u003cp>Transforme em diálogo, com travessões e parágrafos: Lucas perguntou à mãe se podia ir à casa do amigo. A mãe respondeu que sim, desde que ele voltasse antes do jantar.\u003c/p>","resposta":"Lucas perguntou à mãe:\u003cbr>— Posso ir à casa do meu amigo?\u003cbr>— Pode, desde que volte antes do jantar — respondeu a mãe.","exp":"Ponto inteiro com parágrafos e travessões corretos; meio ponto se faltar um deles."},{"tipo":"questao","id":"LP-10-q8","nivel":"facil","enun":"\u003cp>Em “Acordei assustada com o barulho na cozinha”, o narrador é:\u003c/p>","opts":["observador, em 3ª pessoa.","personagem, em 1ª pessoa.","onisciente, em 3ª pessoa.","não há narrador."],"ans":"B","exp":"O verbo “acordei” (eu) mostra que quem narra participa da história."},{"tipo":"questao","id":"LP-10-q9","nivel":"medio","enun":"\u003cp>Qual início de narrativa é mais criativo e prende mais o leitor?\u003c/p>","opts":["Era uma vez uma menina que gostava de ler.","Esta é a história de uma menina.","Um dia aconteceu uma coisa.","O livro caiu da estante sozinho, e Bia teve certeza de que alguém mais estava no quarto."],"ans":"D","exp":"Começa com ação e mistério, cria curiosidade e já sugere o conflito."},{"tipo":"questao","id":"LP-10-q10","nivel":"dificil","discursiva":true,"linhas":10,"enun":"\u003cp>Leia a situação inicial e escreva o clímax e o desfecho (8 a 10 linhas): “Na véspera da final do campeonato, Rafa descobriu que sua chuteira tinha sumido do armário do vestiário.”\u003c/p>","resposta":"Resposta pessoal. Deve haver: um momento de maior tensão (busca, suspeita, jogo começando) e um desfecho que resolva o sumiço da chuteira de forma coerente.","exp":"Avalie: clímax claro (1/3), desfecho coerente (1/3), pontuação e parágrafos (1/3)."},{"tipo":"questao","id":"LP-10-q11","nivel":"medio","enun":"\u003cp>Para uma história sobre uma menina que encontra um mapa antigo no sótão da avó, o título mais adequado e criativo é:\u003c/p>","opts":["O segredo embaixo da poeira","A menina e o mapa","Minha redação","O dia em que ela achou o mapa e encontrou o tesouro"],"ans":"A","exp":"Desperta curiosidade sem entregar o final. (D) revela o desfecho; (C) não é título; (B) é pouco criativo."},{"tipo":"questao","id":"LP-10-q12","nivel":"dificil","discursiva":true,"linhas":30,"enun":"\u003cp>PROPOSTA DE REDAÇÃO. Escolha \u003cstrong>uma\u003c/strong> das situações e escreva uma narrativa de 20 a 30 linhas, com título. (a) Durante uma tempestade, a luz da cidade inteira acaba e você precisa resolver um problema importante sem nenhum aparelho eletrônico. (b) Um aluno novo chega à turma trazendo um objeto misterioso que ninguém consegue identificar. (c) Você encontra, dentro de um livro da biblioteca, um bilhete escrito há muitos anos.\u003c/p>","resposta":"Resposta pessoal.","exp":"Corrija com a grade: cada um dos 8 critérios do edital vale de 0 a 5 (0 = não atende; 3 = atende com falhas; 5 = atende plenamente). Some e divida por 4 para obter a nota de 0 a 10. Anote os dois pontos fortes e as duas mudanças que mais aumentariam a nota."}]},{"id":"1.5.1-s15","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Oficina extra de produção textual","check":"Fiz a oficina","itens":[{"tipo":"quadro","estilo":"caso","titulo":"Da versão vaga à versão concreta","html":"\u003cp>Versão vaga: “Foi um dia diferente, e algo aconteceu na escola”. Versão rica: “Às 7h15, quando o corredor ainda estava vazio, Lara viu um envelope amarelo preso à porta da biblioteca. O nome no papel era o dela, mas a letra parecia ter sido escrita há muitos anos”. Observe tempo, espaço, protagonista, objeto-chave e suspense.\u003c/p>"},{"tipo":"rubrica","titulo":"Rubrica de autocorreção (0 a 2 pontos por critério)","criterios":["Enredo — começo, conflito, clímax e desfecho claros.","Coerência — personagens e acontecimentos não se contradizem.","Coesão — uso de conectivos, pronomes e transições adequados.","Organização — título e parágrafos bem definidos.","Norma escrita — grafia, maiúsculas, pontuação e acentuação."],"nota":"Total de referência: 10 pontos. Essa rubrica é uma proposta de estudo, não um critério oficial divulgado pelo INVEST."}]}]}]}],"revisaoFinal":{"titulo":"Revisão final de alto rendimento","intro":"Resolva sem consultar a teoria. Estas questões foram preparadas com foco nas dificuldades mais comuns: sentido de conectivos, classes de palavras, complementos verbais e concordância. O gabarito aparece logo depois.","questoes":[{"tipo":"questao","id":"RF-q1","nivel":"objetiva","enun":"\u003cp>“Embora o texto fosse longo, a turma terminou”. A relação é:\u003c/p>","opts":["conclusão","concessão","causa","comparação"],"ans":"B","exp":"Embora indica obstáculo superado."},{"tipo":"questao","id":"RF-q2","nivel":"objetiva","enun":"\u003cp>Em “Ela explicou claramente”, “claramente” é:\u003c/p>","opts":["adjetivo","pronome","advérbio","artigo"],"ans":"C","exp":"Modifica o verbo explicou."},{"tipo":"questao","id":"RF-q3","nivel":"objetiva","enun":"\u003cp>“Faz muitos dias que não chove”. O verbo está:\u003c/p>","opts":["correto","errado: deveria ser fazem","errado: deveria ser fizeram","errado: deveria ser fazem-se"],"ans":"A","exp":"Fazer impessoal indica tempo."},{"tipo":"questao","id":"RF-q4","nivel":"objetiva","enun":"\u003cp>Em “Os alunos resolveram a questão”, “a questão” é:\u003c/p>","opts":["objeto indireto","predicativo","adjunto adnominal","objeto direto"],"ans":"D","exp":"Resolveram o quê? a questão."},{"tipo":"questao","id":"RF-q5","nivel":"objetiva","enun":"\u003cp>Em “Havia candidatos na sala”, a forma verbal é:\u003c/p>","opts":["inadequada no singular","adequada no singular","adequada apenas com um candidato","inadequada sem pronome"],"ans":"B","exp":"Haver = existir é impessoal."},{"tipo":"questao","id":"RF-q6","nivel":"objetiva","enun":"\u003cp>“Portanto” expressa:\u003c/p>","opts":["concessão","condição","conclusão","oposição"],"ans":"C","exp":"Portanto introduz conclusão."},{"tipo":"questao","id":"RF-q7","nivel":"objetiva","enun":"\u003cp>“Elas ficaram meio nervosas”. “meio” é:\u003c/p>","opts":["advérbio invariável","adjetivo feminino","artigo definido","numeral fracionário"],"ans":"A","exp":"Meio = um pouco modifica adjetivo nervosas."},{"tipo":"questao","id":"RF-q8","nivel":"objetiva","enun":"\u003cp>Em “A confiança nos colegas cresceu”, “nos colegas” é:\u003c/p>","opts":["sujeito","objeto direto","adjunto adverbial","complemento nominal"],"ans":"D","exp":"Completa o substantivo abstrato confiança."},{"tipo":"questao","id":"RF-q9","nivel":"objetiva","enun":"\u003cp>Qual frase tem vírgula indevida?\u003c/p>","opts":["Ontem, estudamos.","A turma, realizou a prova.","Pedro, venha aqui.","Comprei cadernos, lápis e canetas."],"ans":"B","exp":"Separa sujeito turma do verbo realizou."},{"tipo":"questao","id":"RF-q10","nivel":"objetiva","enun":"\u003cp>Qual palavra é acentuada por ser proparoxítona?\u003c/p>","opts":["café","também","música","herói"],"ans":"C","exp":"MÚ-si-ca é proparoxítona."}]},"referencias":["BRASIL. MEC. Base Nacional Comum Curricular (BNCC), Língua Portuguesa, anos finais. https://basenacionalcomum.mec.gov.br/","INEP. Matriz de Referência de Língua Portuguesa do Saeb aplicarTema();

// ---------- armazenamento ----------
const idb = {
  abrir() { return new Promise((ok, erro) => { try { const r = indexedDB.open(CHAVE, 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error); } catch (e) { erro(e); } }); },
  async ler(k) { try { const db = await this.abrir(); return await new Promise((ok) => { const t = db.transaction("kv").objectStore("kv").get(k); t.onsuccess = () => ok(t.result); t.onerror = () => ok(undefined); }); } catch (e) { return undefined; } },
  async gravar(k, v) { try { const db = await this.abrir(); await new Promise((ok, erro) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = ok; tx.onerror = () => erro(tx.error); }); return true; } catch (e) { return false; } },
  async apagar(k) { try { const db = await this.abrir(); await new Promise((ok) => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = ok; tx.onerror = ok; }); } catch (e) { /* sem armazenamento */ } },
};
const clone = (o) => JSON.parse(JSON.stringify(o));
function progressoVazio() { return { checks: {}, resp: {}, notas: {}, rubricas: {}, simulados: [], celebrados: {}, redacao: { titulo: "", texto: "", notas: {}, historico: [] } }; }
function lerProgresso() { try { const s = localStorage.getItem(CHAVE + "-progresso"); return s ? Object.assign(progressoVazio(), JSON.parse(s)) : progressoVazio(); } catch (e) { return progressoVazio(); } }
function salvarProgresso() { try { localStorage.setItem(CHAVE + "-progresso", JSON.stringify(P)); } catch (e) { /* indisponível */ } }
let tSalvar = null;
function salvarConteudo(imediato) {
  clearTimeout(tSalvar);
  const f = async () => { const ok = await idb.gravar("conteudo", C); const el = document.getElementById("status-salvo"); if (el) el.textContent = ok ? "Salvo neste navegador" : "Não foi possível salvar: armazenamento indisponível"; };
  if (imediato) f(); else tSalvar = setTimeout(f, 700);
}

// ---------- utilidades ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function obter(o, c) { return c.split(".").reduce((a, k) => (a == null ? a : a[k]), o); }
function definir(o, c, v) { const ks = c.split("."); const u = ks.pop(); ks.reduce((a, k) => a[k], o)[u] = v; }
function imagem(src) { if (!src) return ""; if (src.startsWith("img:")) { const k = src.slice(4); return (C.imagens && C.imagens[k]) || ORIGINAL.imagens[k] || ""; } return src; }
function toast(msg) { $$(".toast").forEach((x) => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status"); document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
function ed(c, html, tag = "div", cls = "", plano = false) { return `<${tag} class="${cls}" data-edit="${c}"${plano ? ' data-plano="1"' : ""}>${html}</${tag}>`; }
function temas() { const out = []; C.submodulos.forEach((s, i) => s.temas.forEach((t, j) => out.push({ t, s, caminho: `submodulos.${i}.temas.${j}` }))); return out; }
function acharTema(id) { return temas().find((x) => x.t.id === id); }
function idYoutube(url) {
  if (!url) return null; const u = String(url).trim();
  const m = u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);
  return m ? m[1] : (/^[\w-]{11}$/.test(u) ? u : null);
}
function inicioVideo(url) { const m = String(url || "").match(/[?&](?:t|start)=(\d+)/); return m ? +m[1] : 0; }
// Vídeo do YouTube. Aberto direto do arquivo (file://), o YouTube recusa o player embutido (erro 153),
// então mostramos a capa com link. Pelo atalho (localhost) ou na internet, o player toca no portal.
function videoHTML(url, titulo) {
  const id = idYoutube(url); if (!id) return "";
  const yt = `https://www.youtube.com/watch?v=${id}${inicioVideo(url) ? "&t=" + inicioVideo(url) + "s" : ""}`;
  if (LOCAL) return `<a class="video-capa" href="${yt}" target="_blank" rel="noopener" style="background-image:url('https://i.ytimg.com/vi/${id}/hqdefault.jpg')" aria-label="Assistir no YouTube: ${esc(titulo)}"><span class="play" aria-hidden="true"></span><span class="rot-capa">Toque para assistir no YouTube</span></a>
    <p class="aviso-local">Para o vídeo tocar aqui dentro, abra o portal pelo atalho <b>Abrir_portal</b>.</p>`;
  const src = `https://www.youtube.com/embed/${id}?rel=0&modestbranding=1&playsinline=1&start=${inicioVideo(url)}&origin=${encodeURIComponent(location.origin)}`;
  return `<div class="video-box"><iframe src="${src}" title="${esc(titulo)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <p class="aviso-local"><a href="${yt}" target="_blank" rel="noopener">Abrir no YouTube</a></p>`;
}

// ---------- progresso ----------
function temVideo(s) { return !!(s.video && (idYoutube(s.video.url) || s.video.sugestao)); }
function checksDaSecao(s) { const ks = ["ler"]; if (temVideo(s)) ks.push("video"); return ks; }
function progressoTema(t) { let tot = 0, f = 0; for (const s of t.secoes) for (const k of checksDaSecao(s)) { tot++; if (P.checks[s.id]?.[k]) f++; } return tot ? Math.round((f / tot) * 100) : 0; }
function progressoGeral() { const ts = temas(); return Math.round(ts.reduce((a, x) => a + progressoTema(x.t), 0) / ts.length); }
function questoesDaSecao(s) { return s.itens.filter((i) => i.tipo === "questao"); }
function placarSecao(s) { const qs = questoesDaSecao(s); let resp = 0, ok = 0; for (const q of qs) { const r = P.resp[q.id]; if (r && ("ok" in r)) { resp++; if (r.ok) ok++; } } return { total: qs.length, resp, ok }; }
function marcar(secId, k, v) {
  P.checks[secId] = P.checks[secId] || {}; P.checks[secId][k] = v; salvarProgresso(); atualizarProgressoUI();
  const x = temas().find((y) => y.t.secoes.some((s) => s.id === secId));
  if (x && progressoTema(x.t) === 100 && !P.celebrados[x.t.id]) { P.celebrados[x.t.id] = true; salvarProgresso(); celebrar(`Tema ${x.t.id} concluído. Parabéns!`); }
}
function celebrar(msg) {
  const box = document.createElement("div"); box.className = "celebra"; const cores = ["#FFE66D", "#E0684B", "#1F9D74", "#6C5CE7", "#2F4BBF"];
  for (let i = 0; i < 60; i++) { const c = document.createElement("i"); c.className = "confete"; c.style.left = Math.random() * 100 + "vw"; c.style.background = cores[i % cores.length]; c.style.animationDelay = Math.random() * 0.6 + "s"; box.appendChild(c); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2800); toast(msg);
}
function classePonto(p) { return p === 100 ? "cheio" : p > 0 ? "meio" : ""; }
function atualizarProgressoUI() {
  const g = progressoGeral(); const a = $("#anel-geral"); if (a) { a.style.setProperty("--p", g); a.querySelector("span").textContent = g + "%"; }
  for (const x of temas()) { const el = $(`.ponto[data-tema="${x.t.id}"]`); if (el) el.className = "ponto " + classePonto(progressoTema(x.t)); }
}

  document.body.classList.remove("nav-aberta"); ativarEdicao();

function navLateral(r) {
  return C.submodulos.map((s) => `<h3>${esc(s.num)} ${esc(s.titulo)}</h3>${s.temas.map((t) => `<a class="item-nav ${r.nome === "tema" && r.arg === t.id ? "ativo" : ""}" href="#/tema/${t.id}/${blocoParaContinuar(t)}"><span class="ponto ${classePonto(progressoTema(t))}" data-tema="${t.id}" aria-hidden="true"></span><span>${esc(t.id)} ${esc(t.titulo)}</span></a>`).join("")}`).join("")
    + `<h3>Prática</h3><a class="item-nav" href="#/simulados">Simulados</a><a class="item-nav" href="#/redacao">Oficina de redação</a><a class="item-nav" href="#/creditos">Créditos e referências</a>`;

function blocoParaContinuar(t) { const i = t.secoes.findIndex((s) => !P.checks[s.id]?.ler); return i < 0 ? 1 : i + 1; }
function pagina(r) {
  if (r.nome === "tema") { const x = acharTema(r.arg); return x ? paginaTema(x, r.n) : paginaInicio(); }
  if (r.nome === "simulados") return paginaSimulados();

// ---------- início ----------
function hojeISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function trilhaSVG() {
  const ts = temas(); const W = 620, H = 300;
  const pts = ts.map((tm, i) => ({ x: 40 + (i * (W - 80)) / (ts.length - 1), y: 150 + Math.sin(i * 1.05) * 92, tm }));
  let d = `M ${pts[0].x} ${pts[0].y}`; for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i]; const mx = (a.x + b.x) / 2; d += ` C ${mx} ${a.y}, ${mx} ${b.y}, ${b.x} ${b.y}`; }
  const css = getComputedStyle(document.documentElement); const cor = (v) => css.getPropertyValue(v).trim();
  const paradas = pts.map((p, i) => { const pr = progressoTema(p.tm.t); const fill = pr === 100 ? cor("--ok") : pr > 0 ? cor("--mark") : cor("--bg"); const txt = pr === 100 ? "#fff" : cor("--text");
    return `<g class="parada" tabindex="0" role="link" aria-label="Tema ${p.tm.t.id}: ${esc(p.tm.t.titulo)}, ${pr}% concluído" onclick="location.hash='#/tema/${p.tm.t.id}/${blocoParaContinuar(p.tm.t)}'" onkeydown="if(event.key==='Enter')this.onclick()">
      <title>${esc(p.tm.t.id)} ${esc(p.tm.t.titulo)} (${pr}%)</title><circle cx="${p.x}" cy="${p.y}" r="21" fill="${fill}" stroke="${cor("--text")}" stroke-width="2"/>
      <text x="${p.x}" y="${p.y + 5}" text-anchor="middle" fill="${txt}">${pr === 100 ? "✓" : i + 1}</text>
      <text class="rot" x="${p.x}" y="${p.y + (i % 2 ? -32 : 40)}" text-anchor="middle">${esc(p.tm.t.id)}</text></g>`; }).join("");
  return `<svg class="trilha-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trilha com os 10 temas"><path d="${d}" fill="none" stroke="${cor("--surface-2")}" stroke-width="14" stroke-linecap="round"/>${paradas}</svg>`;
}
function paginaInicio() {
  const hoje = hojeISO(); const cr = C.cronograma; let dia = cr.find((d) => d.data === hoje); if (!dia && hoje < cr[0].data) dia = cr[0];
  let h;
  if (!dia) h = `<h2>A prova já passou</h2><p>Continue revisando os temas em que errou mais questões.</p>`;
  else if (dia.area === "LP") h = `<h2>Hoje · Dia ${dia.dia} · ${esc(dia.rotulo)}</h2><div class="temas-hoje">${dia.temas.map((id) => { const x = acharTema(id); return `<a href="#/tema/${id}/${blocoParaContinuar(x.t)}">${id} ${esc(x.t.titulo)}<span>${progressoTema(x.t)}%</span></a>`; }).join("")}</div><button class="botao sec pequeno" onclick="App.novoSimulado('dia-${dia.dia}')">Fazer o simulado do dia</button>`;
  else if (dia.area === "MAT") h = `<h2>Hoje · Dia ${dia.dia} · ${esc(dia.rotulo)}</h2><p>Dia de Matemática (${esc(dia.texto)}). Se sobrar tempo, refaça um simulado curto de Português.</p><a class="botao sec pequeno" href="#/simulados">Ver simulados</a>`;
  else h = `<h2>Hoje é o dia da prova</h2><p>Leia cada enunciado até o fim e confie no que você estudou.</p>`;
  const resp = Object.values(P.resp).filter((r) => "ok" in r); const ok = resp.filter((r) => r.ok).length;
  const cont = temas().find((x) => progressoTema(x.t) < 100) || temas()[0];
  return `
  <section class="hero">
    <div><h1>Trilha de Língua Portuguesa</h1><div class="lead">${ed("apresentacao", C.apresentacao)}</div>
      <a class="botao" href="#/tema/${cont.t.id}/${blocoParaContinuar(cont.t)}">${progressoGeral() ? "Continuar no tema " + cont.t.id : "Começar a trilha"}</a></div>
    <div>${trilhaSVG()}<div class="legenda-trilha"><span><i style="background:var(--bg)"></i>não iniciado</span><span><i style="background:var(--mark)"></i>em andamento</span><span><i style="background:var(--ok);border-color:var(--ok)"></i>concluído</span></div></div>
  </section>
  <div class="grade-inicio">
    <div class="cartao destaque">${h}</div>
    <div class="cartao"><h2>Seus números</h2><div class="numeros"><div><b>${progressoGeral()}%</b><span>da trilha</span></div><div><b>${resp.length}</b><span>questões feitas</span></div><div><b>${resp.length ? Math.round((ok / resp.length) * 100) : 0}%</b><span>de acerto</span></div><div><b>${P.simulados.length}</b><span>simulados</span></div></div></div>
    <div class="cartao"><h2>Prioridades para a prova</h2>${ed("prioridade", esc(C.prioridade), "p", "", true)}</div>
  </div>
  <div class="grade-inicio" style="margin-top:20px">
    <div class="cartao"><h2>Roteiro até a prova</h2><ul class="dia-lista">${cr.map((d) => `<li class="${d.data === hoje ? "hoje-item" : ""}"><span>${esc(d.rotulo)}</span><span class="${d.area === "LP" ? "" : "mat"}">${d.area === "LP" ? d.temas.map((id) => `<a href="#/tema/${id}/1">${id} ${esc(acharTema(id).t.titulo)}</a>`).join("<br>") : esc(d.texto)}</span></li>`).join("")}</ul></div>
    <div class="cartao"><h2>Como estudar cada tema</h2><ol>${C.rotina.map((x, i) => `<li>${ed("rotina." + i, esc(x), "span", "", true)}</li>`).join("")}</ol></div>
  </div>`;
}

// ---------- tema ----------
const GRUPOS = ["Aquecer", "Aprender", "Praticar", "Testar"];
function grupoDe(s) { if (s.grupo) return s.grupo; return { aquecimento: "Aquecer", exemplos: "Praticar", questoes: "Testar" }[s.tipo] || "Aprender"; }
function paginaTema(x, n) {
  const t = x.t, cam = x.caminho, total = t.secoes.length; if (!total) return `<div class="cartao"><h2>${esc(t.titulo)}</h2><p>Este tema ainda não tem blocos.</p>${ADMIN ? `<button class="botao" onclick="App.novaSecao('${cam}','leitura',-1)">Criar primeiro bloco</button>` : ""}</div>`;
  n = Math.min(n, total); const i = n - 1; const s = t.secoes[i];
  let nq = 0; for (let k = 0; k < i; k++) nq += questoesDaSecao(t.secoes[k]).length;
  const gAtual = grupoDe(s);
  const grupos = GRUPOS.map((g) => { const idx = t.secoes.map((se, k) => (grupoDe(se) === g ? k : -1)).filter((k) => k >= 0); if (!idx.length) return "";
    const feito = idx.every((k) => P.checks[t.secoes[k].id]?.ler);
    return `<button class="grupo ${g === gAtual ? "atual" : ""} ${feito ? "feito" : ""}" onclick="location.hash='#/tema/${t.id}/${idx[0] + 1}'">${g} <span class="cont">${idx.length}</span></button>`; }).join("");
  const segs = t.secoes.map((se, k) => `<button class="seg ${P.checks[se.id]?.ler ? "feito" : ""} ${k === i ? "atual" : ""}" title="${k + 1}. ${esc(se.titulo)}" aria-label="Bloco ${k + 1}: ${esc(se.titulo)}" onclick="location.hash='#/tema/${t.id}/${k + 1}'"></button>`).join("");
  const sel = `<select aria-label="Ir para o bloco" onchange="location.hash='#/tema/${t.id}/'+this.value">${t.secoes.map((se, k) => `<option value="${k + 1}" ${k === i ? "selected" : ""}>${k + 1}. ${P.checks[se.id]?.ler ? "✓ " : ""}${esc(se.titulo)}</option>`).join("")}</select>`;
  return `
  <header class="cab-tema">
    <p class="sobre">${esc(x.s.num)} ${esc(x.s.titulo)}</p>
    <h1>${esc(t.id)} ${ed(cam + ".titulo", esc(t.titulo), "span", "", true)}</h1>
    ${ed(cam + ".objetivo", esc(t.objetivo), "p", "objetivo", true)}
    <div class="meta-tema"><span>${ed(cam + ".dia", esc(t.dia), "span", "", true)}</span><span>Tempo: ${ed(cam + ".tempo", esc(t.tempo), "span", "", true)}</span><span>BNCC: ${ed(cam + ".bncc", esc(t.bncc), "span", "", true)}</span><span>${progressoTema(t)}% concluído</span></div>
  </header>
  <nav class="etapas" aria-label="Etapas do tema"><div class="grupos">${grupos}</div><div class="segmentos">${segs}</div>
    <div class="pos-bloco"><span>Bloco ${n} de ${total}</span>${sel}</div></nav>
  ${blocoSecao(s, `${cam}.secoes.${i}`, i, t, nq, x)}`;
}
function blocoSecao(s, cam, i, t, nqAntes, x) {
  const ch = P.checks[s.id] || {}; const pl = s.tipo === "questoes" || questoesDaSecao(s).length ? placarSecao(s) : null;
  const camTema = cam.replace(/\.secoes\.\d+$/, ""); const total = t.secoes.length;
  let nq = nqAntes;
  const ins = (pos) => `<div class="so-admin inserir"><button onclick="App.paleta('${cam}',${pos})">+ Inserir aqui</button></div>`;
  const itens = s.itens.map((it, j) => `<div class="item">${ctrlItem(cam, j, it)}${renderItem(it, `${cam}.itens.${j}`, s, it.tipo === "questao" ? ++nq : 0)}</div>${ins(j + 1)}`).join("");
  const vid = s.video || {}; const extras = vid.extras || [];
  const temAlgumVideo = idYoutube(vid.url) || vid.sugestao || extras.length;
  const painelVideo = (temAlgumVideo || ADMIN) ? `<div class="painel"><h3>Vídeo</h3>
      ${idYoutube(vid.url) ? videoHTML(vid.url, s.titulo) : vid.sugestao ? `<div class="video-vazio"><div>Sugestão: <b>${esc(vid.sugestao)}</b><br>${vid.link ? `<a href="${esc(vid.link)}" target="_blank" rel="noopener">Procurar no YouTube</a>` : ""}</div></div>` : `<div class="video-vazio">Nenhum vídeo neste bloco.</div>`}

function nomeNivel(n) { return { facil: "Fácil", medio: "Médio", dificil: "Difícil", objetiva: "Objetiva" }[n] || n; }
const ELOGIOS = ["Isso aí!", "Mandou bem!", "Acertou!", "Perfeito!", "Muito bem!"];

function embaralhar(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  duplicarSecao(c) { const ps = c.split("."); const i = +ps.pop(); const lista = obter(C, ps.join(".")); const novo = clone(lista[i]); novo.id = novo.id + "-c" + Date.now(); novo.titulo += " (cópia)"; novo.itens.forEach((it) => { if (it.id) it.id = "N" + Date.now() + Math.random().toString(36).slice(2, 6); });
    lista.splice(i + 1, 0, novo); salvarConteudo(true); const t = obter(C, ps.slice(0, -1).join(".")); location.hash = `#/tema/${t.id}/${i + 2}`; },
  moverSecao(c, d) { const ps = c.split("."); const i = +ps.pop(); const lista = obter(C, ps.join(".")); const k = i + d; if (k < 0 || k >= lista.length) return; [lista[i], lista[k]] = [lista[k], lista[i]]; salvarConteudo(true); const t = obter(C, ps.slice(0, -1).join(".")); location.hash = `#/tema/${t.id}/${k + 1}`; },
  apagarSecao(c) { if (!confirm("Apagar este bloco inteiro?")) return; const ps = c.split("."); const i = +ps.pop(); obter(C, ps.join(".")).splice(i, 1); salvarConteudo(true); const t = obter(C, ps.slice(0, -1).join(".")); location.hash = `#/tema/${t.id}/${Math.max(1, i)}`; renderizar(); },
  addOpcao(c) { const q = obter(C, c); if (q.opts.length >= 5) return; q.opts.push("Nova alternativa"); salvarConteudo(true); rerenderBloco(); },
  remOpcao(c) { const q = obter(C, c); if (q.opts.length <= 2) return; q.opts.pop(); if (LETRAS.indexOf(q.ans) >= q.opts.length) q.ans = "A"; salvarConteudo(true); rerenderBloco(); },
  trocarImagem(c, input) {
    const f = input.files && input.files[0]; if (!f) return; const leitor = new FileReader();
    leitor.onload = () => { const im = new Image(); im.onload = () => { const max = 1400; const k2 = Math.min(1, max / Math.max(im.width, im.height)); const cv = document.createElement("canvas"); cv.width = Math.round(im.width * k2); cv.height = Math.round(im.height * k2);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); let url = cv.toDataURL("image/webp", 0.85); if (!url.startsWith("data:image/webp")) url = cv.toDataURL("image/jpeg", 0.85);
      const k = "up" + Date.now(); C.imagens = C.imagens || {}; C.imagens[k] = url; definir(C, c + ".src", "img:" + k); salvarConteudo(true); rerenderBloco(); toast("Imagem adicionada."); }; im.src = leitor.result; };
    leitor.readAsDataURL(f);
  },
  baixar(nome, conteudo, tipo) { const b = new Blob([conteudo], { type: tipo }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); },
  dadosCompletos() { const d = clone(C); d.imagens = Object.assign({}, ORIGINAL.imagens, C.imagens || {}); return d; },
  baixarPortal() { const json = JSON.stringify(this.dadosCompletos()).replace(/</g, "\\u003c");
    const html = PAGINA_ORIGINAL.replace(/(<script id="dados" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
    this.baixar("portal_lingua_portuguesa.html", html, "text/html"); toast("Portal baixado. Substitua o arquivo antigo por este."); },
  exportarJSON() { this.baixar("conteudo_lingua_portuguesa.json", JSON.stringify(this.dadosCompletos(), null, 1), "application/json"); },
  importarJSON(input) { const f = input.files[0]; if (!f) return; f.text().then((t) => { try { const d = JSON.parse(t); if (!d.submodulos) throw 0; const imgs = {}; for (const k of Object.keys(d.imagens || {})) if (ORIGINAL.imagens[k] !== d.imagens[k]) imgs[k] = d.imagens[k]; d.imagens = imgs; C = d; salvarConteudo(true); renderizar(); toast("Conteúdo importado."); } catch (e) { toast("Arquivo inválido: escolha um .json exportado por este portal."); } }); },
  restaurarOriginal() { if (!confirm("Restaurar o conteúdo original? As edições feitas neste navegador serão perdidas (o progresso da aluna é mantido).")) return; idb.apagar("conteudo"); C = Object.assign(clone(ORIGINAL), { imagens: {} }); renderizar(); toast("Conteúdo original restaurado."); },
  exportarProgresso() { this.baixar("progresso_aluna_lp.json", JSON.stringify(P, null, 1), "application/json"); },
  zerarProgresso() { if (!confirm("Zerar todo o progresso, respostas, anotações e simulados da aluna?")) return; P = progressoVazio(); salvarProgresso(); renderizar(); toast("Progresso zerado."); },
};

// ---------- início ----------
window.addEventListener("hashchange", () => { renderizar(); window.scrollTo(0, 0); });
(async function iniciar() {
  P = lerProgresso();
  const salvo = await idb.ler("conteudo");
  C = salvo && salvo.submodulos ? salvo : Object.assign(clone(ORIGINAL), { imagens: {} });
  renderizar();
})();
</script>
