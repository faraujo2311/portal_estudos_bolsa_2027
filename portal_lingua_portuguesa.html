l","enun":"\u003cp>Em “Tenho medo de trovão”, o complemento nominal é:\u003c/p>","opts":["tenho","de trovão","medo","não há"],"ans":"B","exp":"“Medo” é substantivo abstrato de sentido incompleto: medo de quê? de trovão."},{"tipo":"questao","id":"LP-06-q3","nivel":"medio","enun":"\u003cp>Em “Moramos numa casa de madeira”, o termo “de madeira” é:\u003c/p>","opts":["adjunto adnominal, porque caracteriza um substantivo concreto.","complemento nominal, porque tem preposição.","objeto indireto.","adjunto adverbial."],"ans":"A","exp":"“Casa” é substantivo concreto; “de madeira” = locução adjetiva que caracteriza: adjunto adnominal."},{"tipo":"questao","id":"LP-06-q4","nivel":"facil","discursiva":true,"linhas":3,"enun":"\u003cp>Retire os adjuntos adnominais de: “Aquelas três meninas simpáticas trouxeram um bolo delicioso.”\u003c/p>","resposta":"Aquelas, três, simpáticas (de \u003cem>meninas\u003c/em>); um, delicioso (de \u003cem>bolo\u003c/em>).","exp":"Ponto inteiro com os 5; meio ponto com 3 ou 4."},{"tipo":"questao","id":"LP-06-q5","nivel":"medio","enun":"\u003cp>Em “O cuidado com as plantas exige paciência”, o termo “com as plantas” é:\u003c/p>","opts":["adjunto adnominal (agente).","objeto direto.","objeto indireto.","complemento nominal (paciente)."],"ans":"D","exp":"As plantas \u003cstrong>recebem\u003c/strong> o cuidado (são cuidadas): paciente → complemento nominal do substantivo abstrato \u003cem>cuidado\u003c/em>."},{"tipo":"questao","id":"LP-06-q6","nivel":"dificil","enun":"\u003cp>Nas expressões “a descoberta do cientista” e “a descoberta da vacina”, os termos destacados são, respectivamente:\u003c/p>","opts":["complemento nominal e adjunto adnominal.","adjunto adnominal nas duas.","adjunto adnominal e complemento nominal.","complemento nominal nas duas."],"ans":"C","exp":"O cientista \u003cstrong>descobre\u003c/strong> (agente → AA). A vacina \u003cstrong>é descoberta\u003c/strong> (paciente → CN)."},{"tipo":"questao","id":"LP-06-q7","nivel":"medio","discursiva":true,"linhas":3,"enun":"\u003cp>Explique por que o termo “aos amigos” é complemento nominal em “Ela é fiel aos amigos”.\u003c/p>","resposta":"Porque completa o sentido do adjetivo \u003cem>fiel\u003c/em> (quem é fiel, é fiel a alguém) e vem com preposição. Termo ligado a adjetivo é complemento nominal.","exp":""},{"tipo":"questao","id":"LP-06-q8","nivel":"facil","enun":"\u003cp>Em qual frase há uma locução adjetiva funcionando como adjunto adnominal?\u003c/p>","opts":["Tenho medo de altura.","Comprei uma blusa de lã.","Preciso de ajuda.","Moro perto da escola."],"ans":"B","exp":"“De lã” caracteriza o substantivo concreto \u003cem>blusa\u003c/em>. (A) é CN; (C) é OI; (D) é CN do advérbio \u003cem>perto\u003c/em>."},{"tipo":"questao","id":"LP-06-q9","nivel":"medio","enun":"\u003cp>Em “Este remédio é prejudicial à saúde”, “à saúde” é:\u003c/p>","opts":["complemento nominal.","adjunto adnominal.","objeto indireto.","predicativo do sujeito."],"ans":"A","exp":"Completa o adjetivo \u003cem>prejudicial\u003c/em> (prejudicial a quê?): complemento nominal."},{"tipo":"questao","id":"LP-06-q10","nivel":"dificil","enun":"\u003cp>Em “A admiração dos alunos pela professora era evidente”, os termos “dos alunos” e “pela professora” são:\u003c/p>","opts":["CN e CN.","AA e AA.","CN e AA.","AA e CN."],"ans":"D","exp":"Os alunos admiram (agente → AA); a professora é admirada (paciente → CN do substantivo abstrato \u003cem>admiração\u003c/em>)."},{"tipo":"questao","id":"LP-06-q11","nivel":"medio","enun":"\u003cp>Observe: (I) “Necessitamos de ajuda.” (II) “Temos necessidade de ajuda.” O termo “de ajuda” é:\u003c/p>","opts":["complemento nominal em I e objeto indireto em II.","objeto indireto nas duas.","objeto indireto em I e complemento nominal em II.","complemento nominal nas duas."],"ans":"C","exp":"Em (I), completa o verbo \u003cem>necessitamos\u003c/em>: objeto indireto. Em (II), completa o substantivo \u003cem>necessidade\u003c/em>: complemento nominal."},{"tipo":"questao","id":"LP-06-q12","nivel":"dificil","discursiva":true,"linhas":4,"enun":"\u003cp>Classifique e explique os termos destacados: “O amor \u003cstrong>de mãe\u003c/strong> é diferente do amor \u003cstrong>à leitura\u003c/strong>.”\u003c/p>","resposta":"“De mãe”: adjunto adnominal, pois a mãe é quem ama (agente) e a expressão caracteriza o amor (= amor materno). “À leitura”: complemento nominal, pois a leitura é o que é amado (paciente).","exp":"Meio ponto para cada termo bem justificado."}]},{"id":"1.3.3-s11","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Desafio extra: mais 6 questões objetivas","check":"Fiz o desafio","itens":[{"tipo":"questao","id":"LP-06-d13","nivel":"objetiva","enun":"\u003cp>Em “A resposta ao professor foi breve”, “ao professor” é:\u003c/p>","opts":["adjunto adverbial.","objeto indireto.","complemento nominal.","sujeito."],"ans":"C","exp":"Completa o nome resposta, indicando destinatário da resposta."},{"tipo":"questao","id":"LP-06-d14","nivel":"objetiva","enun":"\u003cp>Em “A casa de madeira é antiga”, “de madeira” é:\u003c/p>","opts":["complemento nominal.","objeto direto.","predicativo do objeto.","adjunto adnominal."],"ans":"D","exp":"Indica material/característica do substantivo casa."},{"tipo":"questao","id":"LP-06-d15","nivel":"objetiva","enun":"\u003cp>Em “Tenho necessidade de silêncio”, “de silêncio” é:\u003c/p>","opts":["complemento nominal.","objeto indireto.","objeto direto.","vocativo."],"ans":"A","exp":"Completa o substantivo abstrato necessidade."},{"tipo":"questao","id":"LP-06-d16","nivel":"objetiva","enun":"\u003cp>Em “Comprei dois livros novos”, “dois” e “novos” são:\u003c/p>","opts":["complementos nominais.","adjuntos adnominais.","objetos indiretos.","adjuntos adverbiais."],"ans":"B","exp":"Numeral e adjetivo determinam/caracterizam livros."},{"tipo":"questao","id":"LP-06-d17","nivel":"objetiva","enun":"\u003cp>Em “A obediência às regras é necessária”, “às regras” é:\u003c/p>","opts":["objeto direto.","adjunto adnominal do núcleo obediência.","complemento nominal.","aposto."],"ans":"C","exp":"Completa o sentido do substantivo abstrato obediência."},{"tipo":"questao","id":"LP-06-d18","nivel":"objetiva","enun":"\u003cp>Em “O caderno de Ana sumiu”, “de Ana” funciona como:\u003c/p>","opts":["objeto indireto.","predicativo do sujeito.","complemento nominal de sumiu.","adjunto adnominal de caderno."],"ans":"D","exp":"Expressa posse/especificação do substantivo concreto caderno."}]}]},{"id":"1.3.4","cod":"LP-07","titulo":"Concordância verbal","bncc":"EF06LP06, EF07LP06, EF07LP10","tempo":"1h30","dia":"Dia 7 (27/10)","objetivo":"Fazer o verbo concordar com o sujeito em número e pessoa, inclusive nos casos especiais mais cobrados: sujeito composto, sujeito posposto, expressões partitivas, coletivos e os verbos haver e fazer.","secoes":[{"id":"1.3.4-s1","video":{"url":"","sugestao":""},"tipo":"aquecimento","titulo":"Aquecimento","check":"Fiz o aquecimento","itens":[{"tipo":"flips","cartas":[{"frente":"Quais são as pessoas do discurso no plural?","verso":"nós (1ª), vós (2ª), eles/elas (3ª)."},{"frente":"Em “As alunas chegaram cedo”, qual é o núcleo do sujeito?","verso":"alunas."},{"frente":"O que é um substantivo coletivo?","verso":"um substantivo no singular que indica um conjunto (turma, cardume, multidão)."}]}]},{"id":"1.3.4-s2","video":{"url":"","sugestao":"Professor Noslen: concordância verbal","link":"https://www.youtube.com/results?search_query=concord%C3%A2ncia%20verbal"},"tipo":"leitura","titulo":"Aprenda com o esquema","check":"Vi o esquema","itens":[{"tipo":"infografico","html":"\n\u003cdiv class=\"ig\">\n  \u003cp class=\"ig-titulo\">Faz ou fazem? Havia ou haviam?\u003c/p>\n  \u003cp class=\"ig-sub\">Toque na forma que você acha correta.\u003c/p>\n  \u003cdiv class=\"escolhas\">\n    \u003cdiv class=\"escolha\">\u003cbutton data-acao=\"escolher\" data-certo=\"1\">Faz dois anos\u003c/button>\u003cbutton data-acao=\"escolher\">Fazem dois anos\u003c/button>\u003csmall>Tempo decorrido → verbo fazer impessoal, no singular.\u003c/small>\u003c/div>\n    \u003cdiv class=\"escolha\">\u003cbutton data-acao=\"escolher\">Haviam vagas\u003c/button>\u003cbutton data-acao=\"escolher\" data-certo=\"1\">Havia vagas\u003c/button>\u003csmall>Haver = existir → impessoal, no singular.\u003c/small>\u003c/div>\n    \u003cdiv class=\"escolha\">\u003cbutton data-acao=\"escolher\" data-certo=\"1\">Faltam dois dias\u003c/button>\u003cbutton data-acao=\"escolher\">Falta dois dias\u003c/button>\u003csmall>“Dois dias” é o sujeito, no plural → faltam.\u003c/small>\u003c/div>\n  \u003c/div>\n\u003c/div>"},{"tipo":"quadro","estilo":"esquema","titulo":"Verbos impessoais: uma exceção que vale pontos","html":"\u003cp>“Faz três dias”, não “fazem três dias” (tempo transcorrido). “Havia muitas vagas”, não “haviam muitas vagas” (haver = existir). Compare: “Existiam muitas vagas” — existir tem sujeito e concorda normalmente.\u003c/p>"}]},{"id":"1.3.4-s3","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"A regra geral","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>O verbo concorda com o \u003cstrong>núcleo do sujeito\u003c/strong> em \u003cstrong>número\u003c/strong> (singular/plural) e \u003cstrong>pessoa\u003c/strong> (1ª, 2ª, 3ª).\u003c/p>"},{"tipo":"img","src":"img:p_concordancia","legenda":"O verbo “acompanha” o sujeito."},{"tipo":"html","html":"\u003cp class=\"frase-exemplo\">“\u003cstrong>O aluno\u003c/strong> chegou.” / “\u003cstrong>Os alunos\u003c/strong> chegaram.” / “\u003cstrong>Nós\u003c/strong> chegamos.”\u003c/p>\u003cp>Para acertar, ache primeiro o sujeito: pergunte ao verbo “\u003cstrong>quem\u003c/strong> ___?” ou “\u003cstrong>o que\u003c/strong> ___?”.\u003c/p>"}]},{"id":"1.3.4-s4","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Sujeito posposto (depois do verbo)","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>A regra é a mesma, mas o erro é comum porque o sujeito aparece depois. Inverta a frase para conferir:\u003c/p>\u003cp class=\"frase-exemplo\">“\u003cstrong>Chegaram\u003c/strong> os convidados.” → Os convidados chegaram. (e não “Chegou os convidados”)\u003c/p>\u003cp class=\"frase-exemplo\">“\u003cstrong>Faltam\u003c/strong> dois dias para a prova.” → Dois dias faltam. (e não “Falta dois dias”)\u003c/p>\u003cp class=\"frase-exemplo\">“\u003cstrong>Sobraram\u003c/strong> muitas dúvidas.” → Muitas dúvidas sobraram.\u003c/p>"}]},{"id":"1.3.4-s5","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Sujeito composto","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Caso\u003c/th>\u003cth>Regra\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Antes do verbo\u003c/td>\u003ctd>Verbo no plural\u003c/td>\u003ctd>\u003cstrong>Pedro e Ana\u003c/strong> viajaram.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Depois do verbo\u003c/td>\u003ctd>Plural ou concordância com o núcleo mais próximo\u003c/td>\u003ctd>Viajaram (ou Viajou) \u003cstrong>Pedro e Ana\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pessoas diferentes com “eu”\u003c/td>\u003ctd>1ª pessoa do plural (nós)\u003c/td>\u003ctd>\u003cstrong>Eu e você\u003c/strong> vamos à feira.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pessoas diferentes sem “eu”\u003c/td>\u003ctd>3ª pessoa do plural (ou 2ª, se houver “tu”)\u003c/td>\u003ctd>\u003cstrong>Você e ele\u003c/strong> foram ótimos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Núcleos ligados por “ou” (exclusão)\u003c/td>\u003ctd>Verbo no singular\u003c/td>\u003ctd>\u003cstrong>Pedro ou Ana\u003c/strong> será o representante.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.3.4-s6","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Casos especiais mais cobrados","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Caso\u003c/th>\u003cth>Regra\u003c/th>\u003cth>Exemplos corretos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Coletivo\u003c/td>\u003ctd>Verbo no singular, concordando com o coletivo\u003c/td>\u003ctd>\u003cstrong>A turma\u003c/strong> saiu. \u003cstrong>A multidão\u003c/strong> gritava.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Expressão partitiva: “a maioria de, a maior parte de, metade de”\u003c/td>\u003ctd>Singular ou plural (as duas formas são aceitas)\u003c/td>\u003ctd>A maioria dos alunos \u003cstrong>aprovou\u003c/strong> / \u003cstrong>aprovaram\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Porcentagem\u003c/td>\u003ctd>Concorda com o número ou com o termo que vem depois\u003c/td>\u003ctd>20% da turma \u003cstrong>faltou\u003c/strong>. / 20% dos alunos \u003cstrong>faltaram\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>“Um dos que”\u003c/td>\u003ctd>Preferência pelo plural\u003c/td>\u003ctd>Ele é um dos que mais \u003cstrong>estudam\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>“Mais de um”\u003c/td>\u003ctd>Verbo no singular\u003c/td>\u003ctd>Mais de um aluno \u003cstrong>faltou\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>“Cada um”, “nenhum”, “qualquer um”\u003c/td>\u003ctd>Verbo no singular\u003c/td>\u003ctd>Cada um dos jogadores \u003cstrong>recebeu\u003c/strong> uma medalha.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pronome relativo “que”\u003c/td>\u003ctd>Concorda com o termo anterior ao “que”\u003c/td>\u003ctd>Fui \u003cstrong>eu que fiz\u003c/strong>. Fomos \u003cstrong>nós que fizemos\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pronome relativo “quem”\u003c/td>\u003ctd>3ª pessoa do singular (ou concordância com o antecedente)\u003c/td>\u003ctd>Fui eu \u003cstrong>quem fez\u003c/strong>.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.3.4-s7","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Verbos impessoais: sempre no singular","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Alguns verbos \u003cstrong>não têm sujeito\u003c/strong> e por isso ficam sempre na \u003cstrong>3ª pessoa do singular\u003c/strong>:\u003c/p>\u003cul>\u003cli>\u003cstrong>Haver\u003c/strong> no sentido de \u003cem>existir\u003c/em> ou \u003cem>acontecer\u003c/em>: “\u003cstrong>Havia\u003c/strong> muitas pessoas.” “\u003cstrong>Houve\u003c/strong> dois acidentes.” “Deve \u003cstrong>haver\u003c/strong> soluções.” (O verbo auxiliar também fica no singular.)\u003c/li>\u003cli>\u003cstrong>Haver\u003c/strong> e \u003cstrong>fazer\u003c/strong> indicando \u003cstrong>tempo decorrido\u003c/strong>: “\u003cstrong>Há\u003c/strong> dois anos moro aqui.” “\u003cstrong>Faz\u003c/strong> três meses que não chove.”\u003c/li>\u003cli>Verbos de \u003cstrong>fenômenos da natureza\u003c/strong>: “\u003cstrong>Choveu\u003c/strong> muito ontem.” “\u003cstrong>Ventou\u003c/strong> a noite toda.”\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"atencao","titulo":"Compare: haver × existir","html":"\u003cp>“\u003cstrong>Havia\u003c/strong> muitos alunos.” (haver: impessoal, singular)\u003c/p>\u003cp>“\u003cstrong>Existiam\u003c/strong> muitos alunos.” (existir: tem sujeito \u003cem>muitos alunos\u003c/em>, plural)\u003c/p>"}]},{"id":"1.3.4-s8","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"O verbo ser","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Nas indicações de \u003cstrong>horas, datas e distâncias\u003c/strong>, o verbo \u003cem>ser\u003c/em> concorda com o número: “\u003cstrong>É\u003c/strong> uma hora.” “\u003cstrong>São\u003c/strong> duas horas.” “\u003cstrong>É\u003c/strong> meio-dia.” “Daqui até a praia \u003cstrong>são\u003c/strong> cinco quilômetros.”\u003c/p>"}]},{"id":"1.3.4-s9","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Voz passiva sintética (desafio)","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Com o pronome \u003cstrong>se\u003c/strong> apassivador, o verbo concorda com o termo que sofre a ação: “\u003cstrong>Vende-se\u003c/strong> uma casa.” / “\u003cstrong>Vendem-se\u003c/strong> casas.” (= casas são vendidas). Já com verbo transitivo indireto, fica no singular: “\u003cstrong>Precisa-se\u003c/strong> de funcionários.”\u003c/p>"}]},{"id":"1.3.4-s10","video":{"url":"","sugestao":"Professora Pamba: Pamba concordância verbal casos especiais","link":"https://www.youtube.com/results?search_query=Pamba%20concord%C3%A2ncia%20verbal%20casos%20especiais"},"tipo":"leitura","titulo":"Fique atento e resumo","check":"Revisei o resumo","itens":[{"tipo":"quadro","estilo":"atencao","titulo":"Fique atento: erros mais comuns","html":"\u003cul>\u003cli>Deixar o verbo no singular com sujeito posposto: “Chegou os resultados” → \u003cstrong>Chegaram\u003c/strong> os resultados.\u003c/li>\u003cli>Colocar \u003cstrong>haver\u003c/strong> (existir) no plural: “Houveram problemas” → \u003cstrong>Houve\u003c/strong> problemas.\u003c/li>\u003cli>Colocar \u003cstrong>fazer\u003c/strong> (tempo) no plural: “Fazem dois anos” → \u003cstrong>Faz\u003c/strong> dois anos.\u003c/li>\u003cli>Concordar com o termo mais próximo em vez do núcleo: “A caixa de lápis \u003cstrong>estava\u003c/strong> na mesa” (núcleo: caixa).\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"resumo","titulo":"Resumo para revisar","html":"\u003cul>\u003cli>Verbo concorda com o núcleo do sujeito em número e pessoa.\u003c/li>\u003cli>Sujeito composto antes do verbo → plural; com “eu” → nós.\u003c/li>\u003cli>Coletivo → singular. “A maioria de…” → singular ou plural.\u003c/li>\u003cli>Haver (existir) e fazer/haver (tempo) → sempre singular.\u003c/li>\u003cli>Horas: é uma hora, são duas horas.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"saiba","titulo":"Para saber mais","html":"\u003cul>\u003cli>\u003ca href=\"https://www.todamateria.com.br\" target=\"_blank\" rel=\"noopener\">Toda Matéria — busque “concordância verbal”\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://brasilescola.uol.com.br\" target=\"_blank\" rel=\"noopener\">Brasil Escola — busque “concordância verbal”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professor Noslen\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=concord%C3%A2ncia%20verbal\" target=\"_blank\" rel=\"noopener\">buscar “concordância verbal”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professora Pamba\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=Pamba%20concord%C3%A2ncia%20verbal%20casos%20especiais\" target=\"_blank\" rel=\"noopener\">buscar “Pamba concordância verbal casos especiais”\u003c/a>\u003c/li>\u003c/ul>"}]},{"id":"1.3.4-s11","video":{"url":"","sugestao":""},"tipo":"exemplos","titulo":"Exemplos resolvidos","check":"Vi os exemplos","itens":[{"tipo":"exemplo","nivel":"facil","enun":"\u003cp>Corrija: “As meninas dançou a noite toda.”\u003c/p>","res":"\u003cp>Núcleo do sujeito: \u003cem>meninas\u003c/em> (plural). O verbo deve ir para o plural: “As meninas \u003cstrong>dançaram\u003c/strong> a noite toda.”\u003c/p>"},{"tipo":"exemplo","nivel":"medio","enun":"\u003cp>Corrija, se necessário: “Falta só dois exercícios para terminar.”\u003c/p>","res":"\u003cp>O que falta? \u003cem>dois exercícios\u003c/em> → sujeito posposto, no plural.\u003c/p>\u003cp>Correção: “\u003cstrong>Faltam\u003c/strong> só dois exercícios para terminar.”\u003c/p>"},{"tipo":"exemplo","nivel":"dificil","enun":"\u003cp>Explique por que a frase “Haviam muitas pessoas na fila, e já fazia duas horas que esperavam” tem um erro e outro acerto.\u003c/p>","res":"\u003cp>“Haviam” está \u003cstrong>errado\u003c/strong>: \u003cem>haver\u003c/em> no sentido de existir é impessoal → “\u003cstrong>Havia\u003c/strong> muitas pessoas”.\u003c/p>\u003cp>“Fazia duas horas” está \u003cstrong>certo\u003c/strong>: \u003cem>fazer\u003c/em> indicando tempo também é impessoal e fica no singular.\u003c/p>\u003cp>“Esperavam” está certo: o sujeito (elas, as pessoas) está no plural.\u003c/p>"},{"tipo":"quadro","estilo":"caso","titulo":"Estudo de caso: Três verbos, três comportamentos","html":"\u003cp>“Havia filas”: haver = existir, sem sujeito, singular. “Existiam filas”: filas é sujeito plural, por isso existiam. “Faz dois anos”: fazer = tempo decorrido, singular. “Faltam dois anos”: dois anos é sujeito plural.\u003c/p>"}]},{"id":"1.3.4-s12","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Exercícios de fixação","check":"Fiz as questões","intro":"Resolva sem consultar a explicação. Nas questões de múltipla escolha, assinale apenas uma opção; nas atividades discursivas, registre uma justificativa curta. Confira o gabarito ao final.","itens":[{"tipo":"questao","id":"LP-07-q1","nivel":"facil","enun":"\u003cp>Complete: “Os alunos ______ cedo à escola.”\u003c/p>","opts":["chegou","chegaram","chegamos","chega"],"ans":"B","exp":"Sujeito \u003cem>os alunos\u003c/em> (3ª pessoa do plural) → chegaram."},{"tipo":"questao","id":"LP-07-q2","nivel":"facil","enun":"\u003cp>Complete: “A turma ______ da excursão.”\u003c/p>","opts":["adoraram","adoramos","adorou","adorariam"],"ans":"C","exp":"“Turma” é coletivo: verbo no singular."},{"tipo":"questao","id":"LP-07-q3","nivel":"medio","enun":"\u003cp>Complete de acordo com a norma-padrão: “______ muitos problemas na prova de ontem.”\u003c/p>","opts":["Houve","Houveram","Haviam","Existiu"],"ans":"A","exp":"Haver no sentido de existir é impessoal: singular. Com \u003cem>existir\u003c/em>, seria “Existiram muitos problemas” (plural), por isso (D) também está errada."},{"tipo":"questao","id":"LP-07-q4","nivel":"facil","discursiva":true,"linhas":4,"enun":"\u003cp>Corrija as frases: (a) “Os meninos jogou bola.” (b) “Chegou os convidados.” (c) “Fazem dois anos que me mudei.”\u003c/p>","resposta":"(a) Os meninos jogaram bola. (b) Chegaram os convidados. (c) Faz dois anos que me mudei.","exp":"Um terço de ponto por item."},{"tipo":"questao","id":"LP-07-q5","nivel":"medio","enun":"\u003cp>Complete: “Eu e minha irmã ______ ao cinema no sábado.”\u003c/p>","opts":["fui","foram","foi","fomos"],"ans":"D","exp":"Sujeito composto com “eu” → 1ª pessoa do plural (nós): fomos."},{"tipo":"questao","id":"LP-07-q6","nivel":"dificil","enun":"\u003cp>Assinale a frase que contraria a norma-padrão:\u003c/p>","opts":["Faz três meses que não chove.","A maioria dos alunos aprovou a ideia.","Houveram muitas reclamações.","Vendem-se bicicletas usadas."],"ans":"C","exp":"Haver (existir) não vai para o plural: “Houve muitas reclamações”. (B) é aceita no singular ou no plural; (D) está correta (bicicletas são vendidas)."},{"tipo":"questao","id":"LP-07-q7","nivel":"medio","discursiva":true,"linhas":3,"enun":"\u003cp>As duas frases estão corretas? Explique: “A maioria dos estudantes chegou atrasada.” / “A maioria dos estudantes chegaram atrasados.”\u003c/p>","resposta":"Sim. Com expressões partitivas (a maioria de, a maior parte de), o verbo pode concordar com o núcleo \u003cem>maioria\u003c/em> (singular) ou com o termo \u003cem>estudantes\u003c/em> (plural).","exp":""},{"tipo":"questao","id":"LP-07-q8","nivel":"facil","enun":"\u003cp>Complete: “Já ______ duas horas da tarde.”\u003c/p>","opts":["é","são","era","foi"],"ans":"B","exp":"Nas horas, o verbo ser concorda com o número: são duas horas."},{"tipo":"questao","id":"LP-07-q9","nivel":"medio","enun":"\u003cp>Complete: “Fui eu que ______ o bolo de aniversário.”\u003c/p>","opts":["fez","fizeram","fizemos","fiz"],"ans":"D","exp":"Com o relativo “que”, o verbo concorda com o antecedente \u003cem>eu\u003c/em>: eu fiz."},{"tipo":"questao","id":"LP-07-q10","nivel":"dificil","enun":"\u003cp>Complete: “Mais de um aluno ______ a resposta, mas nenhum ______ explicar.”\u003c/p>","opts":["sabia — soube","sabiam — souberam","sabia — souberam","sabiam — soube"],"ans":"A","exp":"“Mais de um” e “nenhum” levam o verbo ao singular."},{"tipo":"questao","id":"LP-07-q11","nivel":"medio","enun":"\u003cp>Complete: “Cada um dos jogadores ______ uma medalha.”\u003c/p>","opts":["receberam","recebemos","recebessem","recebeu"],"ans":"D","exp":"O núcleo é “cada um”: verbo no singular."},{"tipo":"questao","id":"LP-07-q12","nivel":"dificil","discursiva":true,"linhas":5,"enun":"\u003cp>Reescreva o parágrafo corrigindo os 4 erros de concordância: “Ontem houveram duas provas na escola. Os alunos chegou cedo, pois faziam meses que esperavam esse dia. No fim, sobrou muitas dúvidas sobre as questões de Matemática.”\u003c/p>","resposta":"“Ontem houve duas provas na escola. Os alunos chegaram cedo, pois fazia meses que esperavam esse dia. No fim, sobraram muitas dúvidas sobre as questões de Matemática.”","exp":"Um quarto de ponto por erro corrigido (houve, chegaram, fazia, sobraram)."}]},{"id":"1.3.4-s13","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Desafio extra: mais 6 questões objetivas","check":"Fiz o desafio","itens":[{"tipo":"questao","id":"LP-07-d13","nivel":"objetiva","enun":"\u003cp>Assinale a forma adequada para tempo decorrido:\u003c/p>","opts":["Faz três meses que começaram as aulas.","Fazem três meses que começaram as aulas.","Haviam três meses de aulas.","Devem haver três meses de aulas."],"ans":"A","exp":"Fazer impessoal na expressão de tempo permanece no singular."},{"tipo":"questao","id":"LP-07-d14","nivel":"objetiva","enun":"\u003cp>Complete: “_____ muitas dúvidas na reunião”.\u003c/p>","opts":["Haviam","Havia","Haveriam","Devem haver"],"ans":"B","exp":"Haver com sentido de existir é impessoal: havia."},{"tipo":"questao","id":"LP-07-d15","nivel":"objetiva","enun":"\u003cp>Qual é a construção correta?\u003c/p>","opts":["Falta três dias.","Fazem três dias.","Faltam três dias.","Haviam três dias."],"ans":"C","exp":"Em faltar, “três dias” é o sujeito plural."},{"tipo":"questao","id":"LP-07-d16","nivel":"objetiva","enun":"\u003cp>Assinale a frase correta:\u003c/p>","opts":["Existia problemas.","Houveram problemas.","Deverão haver problemas.","Existiam problemas."],"ans":"D","exp":"Existir concorda com problemas; haver existencial não flexiona."},{"tipo":"questao","id":"LP-07-d17","nivel":"objetiva","enun":"\u003cp>Assinale a frase com concordância correta:\u003c/p>","opts":["Vendem-se livros usados.","Vende-se livros usados.","Precisam-se de funcionários.","Fazem dez anos."],"ans":"A","exp":"Na voz passiva sintética, livros usados é sujeito paciente plural."},{"tipo":"questao","id":"LP-07-d18","nivel":"objetiva","enun":"\u003cp>Assinale o uso correto de fazer:\u003c/p>","opts":["Fizeram muito frio ontem.","Fez muito frio ontem.","Fazem dez dias da viagem.","Devem fazer dez anos."],"ans":"B","exp":"Fazer indicando fenômeno meteorológico é impessoal e singular."}]}]}]},{"num":"1.4","titulo":"Pontuação e Acentuação","intro":"Pontuação, acentuação e ortografia aparecem tanto nas questões objetivas quanto nos critérios de correção da redação. Por isso, vale estudar com muita atenção.","temas":[{"id":"1.4.1","cod":"LP-08","titulo":"Pontuação","bncc":"EF67LP33, EF69LP05","tempo":"1h30","dia":"Dia 7 (27/10)","objetivo":"Usar corretamente os sinais de pontuação, especialmente a vírgula, e reconhecer como a pontuação muda o sentido e organiza o diálogo nas narrativas.","secoes":[{"id":"1.4.1-s1","video":{"url":"","sugestao":""},"tipo":"aquecimento","titulo":"Aquecimento","check":"Fiz o aquecimento","itens":[{"tipo":"flips","cartas":[{"frente":"Que sinal termina uma pergunta?","verso":"o ponto de interrogação (?)."},{"frente":"O que é vocativo?","verso":"o termo usado para chamar alguém: “\u003cstrong>Pedro\u003c/strong>, venha cá.”"},{"frente":"Em “Ana estudou”, quem é o sujeito e qual é o verbo?","verso":"sujeito: Ana; verbo: estudou."}]}]},{"id":"1.4.1-s2","video":{"url":"","sugestao":"Professor Noslen: uso da vírgula","link":"https://www.youtube.com/results?search_query=uso%20da%20v%C3%ADrgula"},"tipo":"leitura","titulo":"Aprenda com o esquema","check":"Vi o esquema","itens":[{"tipo":"infografico","html":"\n\u003cdiv class=\"ig\">\n  \u003cp class=\"ig-titulo\">A pontuação muda a mensagem\u003c/p>\n  \u003cp class=\"ig-sub\">Ligue e desligue a vírgula e veja o sentido mudar.\u003c/p>\n  \u003cdiv class=\"virgula-jogo\" data-acao=\"virgula\">\n    \u003cp class=\"frase-grande\">\u003cspan>Não\u003c/span>\u003cspan class=\"virg\">,\u003c/span> \u003cspan>espere.\u003c/span>\u003c/p>\n    \u003cbutton class=\"botao-virgula\" data-acao=\"virgula-toggle\" aria-pressed=\"true\">Vírgula: ligada\u003c/button>\n    \u003cp class=\"sentido com\">Com a vírgula, alguém pede que a outra pessoa espere. O “não” responde a algo dito antes.\u003c/p>\n    \u003cp class=\"sentido sem\">Sem a vírgula, a ordem é para não esperar: o próprio ato de esperar é negado.\u003c/p>\n  \u003c/div>\n  \u003cp class=\"ig-regra\">A vírgula não é só uma pausa: ela organiza e altera o sentido.\u003c/p>\n\u003c/div>"},{"tipo":"quadro","estilo":"esquema","titulo":"Vírgula é sintaxe e sentido, não apenas respiração","html":"\u003cp>A vírgula pode isolar vocativo (“Ana, venha!”), adjunto adverbial deslocado (“Ontem, estudamos”), ou enumeração. Não a use entre o núcleo do sujeito e o verbo nem entre verbo e complemento, mesmo quando a frase for longa.\u003c/p>"}]},{"id":"1.4.1-s3","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Para que serve a pontuação","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Na fala, usamos pausas e entonação. Na escrita, a \u003cstrong>pontuação\u003c/strong> faz esse papel: organiza as ideias, mostra emoções, indica quem fala e evita mal-entendidos. Uma vírgula pode mudar todo o sentido:\u003c/p>\u003cp class=\"frase-exemplo\">“\u003cstrong>Não\u003c/strong>, espere.” (é para esperar)  ×  “\u003cstrong>Não espere\u003c/strong>.” (é para não esperar)\u003c/p>\u003cp class=\"frase-exemplo\">“Vamos comer, \u003cstrong>crianças\u003c/strong>!” (chama as crianças)  ×  “Vamos comer \u003cstrong>crianças\u003c/strong>!” (absurdo!)\u003c/p>"}]},{"id":"1.4.1-s4","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Os sinais de pontuação","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Sinal\u003c/th>\u003cth>Uso principal\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ponto final ( . )\u003c/td>\u003ctd>Encerra frase declarativa\u003c/td>\u003ctd>A prova será na sexta.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Interrogação ( ? )\u003c/td>\u003ctd>Pergunta direta\u003c/td>\u003ctd>Você estudou hoje?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Exclamação ( ! )\u003c/td>\u003ctd>Emoção, surpresa, ordem, chamamento\u003c/td>\u003ctd>Que dia lindo! / Cuidado!\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reticências ( … )\u003c/td>\u003ctd>Hesitação, suspense, ideia interrompida\u003c/td>\u003ctd>Eu… não sei o que dizer.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dois-pontos ( : )\u003c/td>\u003ctd>Anunciam enumeração, explicação, citação ou fala\u003c/td>\u003ctd>Comprei três coisas: pão, leite e café.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ponto e vírgula ( ; )\u003c/td>\u003ctd>Separa partes longas ou itens de lista que já têm vírgulas\u003c/td>\u003ctd>Uns estudavam; outros, conversavam.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Travessão ( — )\u003c/td>\u003ctd>Indica a fala do personagem no diálogo; destaca expressões\u003c/td>\u003ctd>— Vamos sair? — perguntou Ana.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Aspas ( “ ” )\u003c/td>\u003ctd>Citação, fala reproduzida, ironia, palavra estrangeira ou em sentido especial\u003c/td>\u003ctd>Ele disse que a prova estava “fácil”.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Parênteses ( )\u003c/td>\u003ctd>Explicação ou comentário extra\u003c/td>\u003ctd>O autor (nascido em 1823) escreveu o poema.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.4.1-s5","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"A vírgula: quando usar","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Regra\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Separar itens de uma enumeração\u003c/td>\u003ctd>Trouxe lápis, borracha, régua e caderno.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Isolar o vocativo (chamamento)\u003c/td>\u003ctd>\u003cstrong>Pedro,\u003c/strong> venha cá. / Venha cá\u003cstrong>, Pedro\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Isolar o aposto (explicação de um termo)\u003c/td>\u003ctd>Salvador\u003cstrong>, capital da Bahia,\u003c/strong> tem belas praias.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Separar adjunto adverbial deslocado (no início ou no meio)\u003c/td>\u003ctd>\u003cstrong>Ontem à noite,\u003c/strong> choveu muito. / Os alunos\u003cstrong>, durante o recreio,\u003c/strong> jogaram bola.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Separar orações ligadas por mas, porém, contudo, pois, logo\u003c/td>\u003ctd>Estudei muito\u003cstrong>, mas\u003c/strong> a prova foi difícil.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Isolar expressões explicativas: isto é, ou seja, por exemplo\u003c/td>\u003ctd>Ela é poliglota\u003cstrong>, ou seja,\u003c/strong> fala várias línguas.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Separar local e data\u003c/td>\u003ctd>Curitiba\u003cstrong>,\u003c/strong> 21 de outubro de 2026.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Indicar que um verbo foi omitido\u003c/td>\u003ctd>Eu prefiro praia; ela\u003cstrong>,\u003c/strong> campo. (ela prefere campo)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.4.1-s6","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"A vírgula: quando NÃO usar","check":"Li esta parte","itens":[{"tipo":"img","src":"img:p_virgula","legenda":"A regra mais importante: não separar sujeito, verbo e complemento."},{"tipo":"html","html":"\u003cp class=\"frase-exemplo\">Errado: “Os alunos do 8º ano\u003cstrong>,\u003c/strong> fizeram a prova.”  Certo: “Os alunos do 8º ano fizeram a prova.”\u003c/p>\u003cp class=\"frase-exemplo\">Errado: “A professora entregou\u003cstrong>,\u003c/strong> as notas.”  Certo: “A professora entregou as notas.”\u003c/p>"},{"tipo":"quadro","estilo":"dica","titulo":"Dica: a ordem direta","html":"\u003cp>Na ordem \u003cstrong>sujeito + verbo + complemento + circunstância\u003c/strong>, normalmente não há vírgula: “Os alunos fizeram a prova ontem.” Quando você \u003cstrong>tira algo do lugar\u003c/strong> (por exemplo, coloca “ontem” no começo), use a vírgula: “Ontem, os alunos fizeram a prova.”\u003c/p>"}]},{"id":"1.4.1-s7","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Pontuação do diálogo","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Nas narrativas, a fala dos personagens segue um padrão. Cada fala começa \u003cstrong>em um novo parágrafo, com travessão\u003c/strong>. O verbo que anuncia a fala (disse, perguntou, respondeu, gritou) pode vir antes, com dois-pontos, ou depois, entre travessões ou após vírgula.\u003c/p>"},{"tipo":"texto","titulo":"Modelo de diálogo","html":"\u003cp>Ana olhou para o céu escuro e perguntou:\u003c/p>\u003cp>— Será que vai chover?\u003c/p>\u003cp>— Acho que sim — respondeu João, fechando a janela. — Melhor levar o guarda-chuva.\u003c/p>","fonte":""},{"tipo":"html","html":"\u003cul>\u003cli>Fala depois de dois-pontos: novo parágrafo + travessão.\u003c/li>\u003cli>Verbo de fala no meio ou no fim: separado por travessão (— Acho que sim — respondeu João).\u003c/li>\u003cli>A fala começa com letra \u003cstrong>maiúscula\u003c/strong>.\u003c/li>\u003c/ul>"}]},{"id":"1.4.1-s8","video":{"url":"","sugestao":"Professora Pamba: Pamba pontuação vírgula","link":"https://www.youtube.com/results?search_query=Pamba%20pontua%C3%A7%C3%A3o%20v%C3%ADrgula"},"tipo":"leitura","titulo":"Fique atento e resumo","check":"Revisei o resumo","itens":[{"tipo":"quadro","estilo":"atencao","titulo":"Fique atento: erros mais comuns","html":"\u003cul>\u003cli>\u003cstrong>Vírgula entre sujeito e verbo:\u003c/strong> é o erro mais cobrado. Sujeito longo não pede vírgula.\u003c/li>\u003cli>Esquecer as \u003cstrong>duas vírgulas\u003c/strong> do aposto ou do adjunto no meio da frase: abriu, fechou.\u003c/li>\u003cli>Não isolar o \u003cstrong>vocativo\u003c/strong>: “Oi\u003cstrong>,\u003c/strong> Maria!” e não “Oi Maria!”.\u003c/li>\u003cli>Misturar fala do narrador e do personagem sem travessão ou sem mudar de parágrafo.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"resumo","titulo":"Resumo para revisar","html":"\u003cul>\u003cli>Vírgula: enumeração, vocativo, aposto, adjunto deslocado, antes de mas/porém/pois, expressões explicativas, local e data.\u003c/li>\u003cli>Nunca separe sujeito de verbo, nem verbo de complemento.\u003c/li>\u003cli>Dois-pontos anunciam; reticências suspendem; exclamação emociona.\u003c/li>\u003cli>Diálogo: novo parágrafo + travessão; verbo de fala separado por travessão.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"saiba","titulo":"Para saber mais","html":"\u003cul>\u003cli>\u003ca href=\"https://www.todamateria.com.br\" target=\"_blank\" rel=\"noopener\">Toda Matéria — busque “uso da vírgula” e “sinais de pontuação”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professor Noslen\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=uso%20da%20v%C3%ADrgula\" target=\"_blank\" rel=\"noopener\">buscar “uso da vírgula”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professora Pamba\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=Pamba%20pontua%C3%A7%C3%A3o%20v%C3%ADrgula\" target=\"_blank\" rel=\"noopener\">buscar “Pamba pontuação vírgula”\u003c/a>\u003c/li>\u003c/ul>"}]},{"id":"1.4.1-s9","video":{"url":"","sugestao":""},"tipo":"exemplos","titulo":"Exemplos resolvidos","check":"Vi os exemplos","itens":[{"tipo":"exemplo","nivel":"facil","enun":"\u003cp>Pontue: “Ana traga lápis borracha régua e caderno”\u003c/p>","res":"\u003cp>“Ana” é vocativo (alguém é chamado) → vírgula depois dele. Há enumeração → vírgulas entre os itens, menos antes do “e”.\u003c/p>\u003cp>\u003cstrong>“Ana, traga lápis, borracha, régua e caderno.”\u003c/strong>\u003c/p>"},{"tipo":"exemplo","nivel":"medio","enun":"\u003cp>Explique a diferença de sentido: (I) “Maria, a professora chegou.” (II) “Maria, a professora, chegou.”\u003c/p>","res":"\u003cp>(I) “Maria” é \u003cstrong>vocativo\u003c/strong>: alguém avisa Maria de que a professora chegou.\u003c/p>\u003cp>(II) “a professora” é \u003cstrong>aposto\u003c/strong>: explica quem é Maria. Quem chegou foi a própria Maria. As vírgulas mudaram o sentido.\u003c/p>"},{"tipo":"exemplo","nivel":"dificil","enun":"\u003cp>Pontue: “Ontem à noite depois do jantar os meninos saíram mas voltaram cedo”\u003c/p>","res":"\u003cp>Há dois adjuntos adverbiais deslocados no início (“Ontem à noite”, “depois do jantar”) e uma oração com \u003cstrong>mas\u003c/strong>.\u003c/p>\u003cp>\u003cstrong>“Ontem à noite, depois do jantar, os meninos saíram, mas voltaram cedo.”\u003c/strong>\u003c/p>"},{"tipo":"quadro","estilo":"caso","titulo":"Estudo de caso: A vírgula transforma o interlocutor","html":"\u003cp>“Não, espere.” é pedido para esperar; “Não espere.” é ordem para não esperar. Em “Pedro, a prova começou”, a vírgula isola o vocativo “Pedro”, não separa o sujeito do verbo.\u003c/p>"}]},{"id":"1.4.1-s10","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Exercícios de fixação","check":"Fiz as questões","intro":"Resolva sem consultar a explicação. Nas questões de múltipla escolha, assinale apenas uma opção; nas atividades discursivas, registre uma justificativa curta. Confira o gabarito ao final.","itens":[{"tipo":"questao","id":"LP-08-q1","nivel":"facil","enun":"\u003cp>Qual sinal completa adequadamente a frase “Que dia lindo__”?\u003c/p>","opts":["ponto de interrogação","dois-pontos","ponto e vírgula","ponto de exclamação"],"ans":"D","exp":"A frase expressa admiração, emoção: exclamação."},{"tipo":"questao","id":"LP-08-q2","nivel":"facil","enun":"\u003cp>Em qual frase o vocativo está corretamente pontuado?\u003c/p>","opts":["Pedro venha cá.","Pedro venha, cá.","Pedro, venha cá.","Pedro: venha cá."],"ans":"C","exp":"O vocativo (Pedro) é isolado por vírgula."},{"tipo":"questao","id":"LP-08-q3","nivel":"medio","enun":"\u003cp>Assinale a frase com vírgula INCORRETA:\u003c/p>","opts":["Ontem, choveu muito na cidade.","Os alunos do 8º ano, fizeram a prova.","Estudei muito, mas fiquei nervosa.","Comprei maçã, banana e uva."],"ans":"B","exp":"A vírgula separou o sujeito (os alunos do 8º ano) do verbo (fizeram). Isso é proibido."},{"tipo":"questao","id":"LP-08-q4","nivel":"facil","discursiva":true,"linhas":3,"enun":"\u003cp>Pontue corretamente: “Maria traga o mapa a lanterna e a corda”\u003c/p>","resposta":"“Maria, traga o mapa, a lanterna e a corda.”","exp":"Vírgula do vocativo e da enumeração (meio ponto cada)."},{"tipo":"questao","id":"LP-08-q5","nivel":"medio","enun":"\u003cp>Qual frase isola corretamente o aposto?\u003c/p>","opts":["Machado de Assis, o grande escritor brasileiro, nasceu no Rio de Janeiro.","Machado de Assis o grande escritor brasileiro nasceu no Rio de Janeiro.","Machado de Assis, o grande escritor brasileiro nasceu no Rio de Janeiro.","Machado de Assis o grande escritor brasileiro, nasceu no Rio de Janeiro."],"ans":"A","exp":"O aposto (o grande escritor brasileiro) explica \u003cem>Machado de Assis\u003c/em> e fica entre duas vírgulas."},{"tipo":"questao","id":"LP-08-q6","nivel":"dificil","enun":"\u003cp>Leia: (I) “Não quero sair.” (II) “Não, quero sair.” É correto afirmar que:\u003c/p>","opts":["as duas frases têm o mesmo sentido.","em (I) a pessoa não quer sair; em (II), quer.","em (I) a pessoa quer sair; em (II), não.","a vírgula em (II) está errada."],"ans":"B","exp":"Em (II), “Não” responde a algo anterior e, depois da vírgula, a pessoa afirma que quer sair."},{"tipo":"questao","id":"LP-08-q7","nivel":"medio","discursiva":true,"linhas":5,"enun":"\u003cp>Reescreva o trecho em forma de diálogo, com travessões e parágrafos: Ana perguntou se João ia à festa. João respondeu que claro que ia e que levaria o bolo.\u003c/p>","resposta":"Ana perguntou:\u003cbr>— Você vai à festa?\u003cbr>— Claro que vou — respondeu João. — Vou levar o bolo.","exp":"Ponto inteiro com parágrafos, travessões e verbo de fala bem pontuados; meio ponto se faltar um desses elementos."},{"tipo":"questao","id":"LP-08-q8","nivel":"facil","enun":"\u003cp>Em “Eu… eu não sei o que aconteceu”, as reticências indicam:\u003c/p>","opts":["uma enumeração.","uma pergunta.","hesitação do falante.","o fim do texto."],"ans":"C","exp":"As reticências mostram dúvida, hesitação, fala interrompida."},{"tipo":"questao","id":"LP-08-q9","nivel":"medio","enun":"\u003cp>Em “Na mochila havia três coisas: um livro, uma garrafa e um lanche”, os dois-pontos foram usados para:\u003c/p>","opts":["anunciar uma enumeração.","introduzir uma fala.","indicar ironia.","separar sujeito e verbo."],"ans":"A","exp":"Os dois-pontos anunciam a lista que vem a seguir."},{"tipo":"questao","id":"LP-08-q10","nivel":"dificil","enun":"\u003cp>Qual é a pontuação correta de “No sábado pela manhã antes do jogo os jogadores treinaram mas não se cansaram”?\u003c/p>","opts":["No sábado pela manhã antes do jogo, os jogadores, treinaram mas não se cansaram.","No sábado, pela manhã antes do jogo os jogadores treinaram mas, não se cansaram.","No sábado pela manhã, antes do jogo os jogadores, treinaram, mas não se cansaram.","No sábado pela manhã, antes do jogo, os jogadores treinaram, mas não se cansaram."],"ans":"D","exp":"Vírgulas separam os adjuntos deslocados e a oração iniciada por \u003cem>mas\u003c/em>. As outras separam sujeito e verbo ou colocam vírgula depois do \u003cem>mas\u003c/em>."},{"tipo":"questao","id":"LP-08-q11","nivel":"medio","enun":"\u003cp>Em “O professor disse que a prova estava ‘facílima’, e metade da turma tirou nota baixa”, as aspas indicam:\u003c/p>","opts":["uma citação de livro.","uma palavra estrangeira.","o título de uma obra.","ironia ou sentido especial da palavra."],"ans":"D","exp":"O contexto (metade da turma foi mal) mostra que “facílima” está entre aspas para sugerir ironia."},{"tipo":"questao","id":"LP-08-q12","nivel":"dificil","discursiva":true,"linhas":6,"enun":"\u003cp>Pontue o texto, usando parágrafos e travessões onde for preciso: “Quando chegou em casa Lucas encontrou um bilhete na mesa Ele leu em voz alta Filho fui ao mercado volto às seis Lucas sorriu abriu a geladeira e pensou Ótimo dá tempo de fazer um lanche”\u003c/p>","resposta":"Quando chegou em casa, Lucas encontrou um bilhete na mesa. Ele leu em voz alta:\u003cbr>— Filho, fui ao mercado. Volto às seis.\u003cbr>Lucas sorriu, abriu a geladeira e pensou:\u003cbr>— Ótimo! Dá tempo de fazer um lanche.","exp":"Aceite aspas no lugar dos travessões para o bilhete e o pensamento. Pontue: vírgula após adjunto deslocado, vocativo (Filho), enumeração de ações e pontos finais (um quarto de ponto por grupo)."}]},{"id":"1.4.1-s11","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Desafio extra: mais 6 questões objetivas","check":"Fiz o desafio","itens":[{"tipo":"questao","id":"LP-08-d13","nivel":"objetiva","enun":"\u003cp>Qual frase apresenta vocativo corretamente isolado?\u003c/p>","opts":["Ana terminou a leitura.","A leitura, foi longa.","Ana, leia o aviso.","A professora, leu."],"ans":"C","exp":"Ana é chamamento e deve ser separado por vírgula."},{"tipo":"questao","id":"LP-08-d14","nivel":"objetiva","enun":"\u003cp>Assinale a opção em que a vírgula separa indevidamente o sujeito do verbo:\u003c/p>","opts":["Ontem, fiz a tarefa.","Pedro, venha cá.","Estudei História, Arte e Ciências.","Os estudantes da turma, chegaram cedo."],"ans":"D","exp":"Não se separa o sujeito longo “Os estudantes da turma” do verbo “chegaram”."},{"tipo":"questao","id":"LP-08-d15","nivel":"objetiva","enun":"\u003cp>Em “Não, espere!”, a vírgula:\u003c/p>","opts":["altera o sentido da orientação.","é obrigatória por qualquer pausa na fala.","é usada entre sujeito e verbo.","não tem função."],"ans":"A","exp":"A vírgula separa a negativa inicial e muda o enunciado para pedido de espera."},{"tipo":"questao","id":"LP-08-d16","nivel":"objetiva","enun":"\u003cp>Em “Li poemas, notícias e crônicas”, as vírgulas separam:\u003c/p>","opts":["orações subordinadas.","elementos de uma enumeração.","o sujeito do verbo.","verbo e complemento."],"ans":"B","exp":"O trecho apresenta itens coordenados de uma lista."},{"tipo":"questao","id":"LP-08-d17","nivel":"objetiva","enun":"\u003cp>O sinal usado para introduzir fala de personagem em narrativa é:\u003c/p>","opts":["ponto e vírgula.","barra.","travessão.","apóstrofo."],"ans":"C","exp":"O travessão é recurso convencional de marcação de fala."},{"tipo":"questao","id":"LP-08-d18","nivel":"objetiva","enun":"\u003cp>Em “Que surpresa!”, o ponto de exclamação sugere:\u003c/p>","opts":["pergunta.","uma informação estatística.","citação literal.","emoção ou ênfase."],"ans":"D","exp":"Exclamação pode marcar emoção e intensidade expressiva."}]}]},{"id":"1.4.2","cod":"LP-09","titulo":"Acentuação gráfica e ortografia","bncc":"EF67LP32","tempo":"1h30","dia":"Dia 9 (29/10)","objetivo":"Aplicar as regras de acentuação gráfica (pelo Acordo Ortográfico vigente) e evitar os erros de ortografia mais comuns em redações.","secoes":[{"id":"1.4.2-s1","video":{"url":"","sugestao":""},"tipo":"aquecimento","titulo":"Aquecimento","check":"Fiz o aquecimento","itens":[{"tipo":"flips","cartas":[{"frente":"Separe em sílabas: “borboleta”.","verso":"bor-bo-le-ta (4 sílabas)."},{"frente":"Em “café”, qual sílaba é pronunciada com mais força?","verso":"fé (a última)."},{"frente":"Qual a diferença entre o acento agudo (´) e o circunflexo (^)?","verso":"o agudo indica som aberto (é, ó); o circunflexo indica som fechado (ê, ô)."}]}]},{"id":"1.4.2-s2","video":{"url":"","sugestao":"Professor Noslen: regras de acentuação","link":"https://www.youtube.com/results?search_query=regras%20de%20acentua%C3%A7%C3%A3o"},"tipo":"leitura","titulo":"Aprenda com o esquema","check":"Vi o esquema","itens":[{"tipo":"infografico","html":"\n\u003cdiv class=\"ig\">\n  \u003cp class=\"ig-titulo\">Sílaba tônica: conte de trás para frente\u003c/p>\n  \u003cdiv class=\"tonicas\">\n    \u003cdiv class=\"tonica t-menta\">\u003csmall>oxítona\u003c/small>\u003cb>ca-\u003cu>FÉ\u003c/u>\u003c/b>\u003cspan>última sílaba\u003c/span>\u003c/div>\n    \u003cdiv class=\"tonica t-coral\">\u003csmall>paroxítona\u003c/small>\u003cb>\u003cu>LÁ\u003c/u>-pis\u003c/b>\u003cspan>penúltima sílaba\u003c/span>\u003c/div>\n    \u003cdiv class=\"tonica t-lavanda\">\u003csmall>proparoxítona\u003c/small>\u003cb>\u003cu>MÚ\u003c/u>-si-ca\u003c/b>\u003cspan>antepenúltima sílaba\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"ig-sub\">Jogo rápido: toque na sílaba tônica de cada palavra.\u003c/p>\n  \u003cdiv class=\"jogo-silabas\">\n    \u003cdiv class=\"palavra-jogo\">\u003cbutton data-acao=\"silaba\">ár\u003c/button>\u003cbutton data-acao=\"silaba\" data-x=\"1\">vo\u003c/button>\u003cbutton data-acao=\"silaba\" data-x=\"1\">re\u003c/button>\u003c/div>\n    \u003cdiv class=\"palavra-jogo\">\u003cbutton data-acao=\"silaba\" data-x=\"1\">sa\u003c/button>\u003cbutton data-acao=\"silaba\">ú\u003c/button>\u003cbutton data-acao=\"silaba\" data-x=\"1\">de\u003c/button>\u003c/div>\n    \u003cdiv class=\"palavra-jogo\">\u003cbutton data-acao=\"silaba\" data-x=\"1\">pa\u003c/button>\u003cbutton data-acao=\"silaba\">péis\u003c/button>\u003c/div>\n    \u003cdiv class=\"palavra-jogo\">\u003cbutton data-acao=\"silaba\" data-x=\"1\">jo\u003c/button>\u003cbutton data-acao=\"silaba\" data-x=\"1\">vem\u003c/button>\u003csmall class=\"dica-jogo\">dica: a tônica é “jo”, mas não leva acento\u003c/small>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"ig-regra\">Dica: todas as proparoxítonas são acentuadas.\u003c/p>\n\u003c/div>"},{"tipo":"quadro","estilo":"esquema","titulo":"Por que “lápis” e “café” têm acento?","html":"\u003cp>CA-FÉ é oxítona terminada em E: acentuada. LÁ-PIS é paroxítona terminada em IS: acentuada. MÚ-SI-CA é proparoxítona: todas se acentuam. Antes de aplicar a regra, encontre a sílaba mais forte.\u003c/p>"}]},{"id":"1.4.2-s3","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Sílaba tônica: o primeiro passo","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Toda palavra com duas ou mais sílabas tem uma \u003cstrong>sílaba tônica\u003c/strong>, pronunciada com mais força. Para aplicar as regras de acento, você precisa saber onde ela está. Conte as sílabas \u003cstrong>de trás para frente\u003c/strong>.\u003c/p>"},{"tipo":"img","src":"img:p_silaba","legenda":"Classificação pela posição da sílaba tônica."}]},{"id":"1.4.2-s4","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"As regras de acentuação","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Tipo de palavra\u003c/th>\u003cth>Acentua-se quando…\u003c/th>\u003cth>Exemplos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Proparoxítonas\u003c/td>\u003ctd>\u003cstrong>Sempre\u003c/strong>\u003c/td>\u003ctd>lâmpada, médico, árvore, sábado, matemática\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Oxítonas\u003c/td>\u003ctd>terminam em \u003cstrong>a(s), e(s), o(s), em, ens\u003c/strong>\u003c/td>\u003ctd>sofá, café, avó, também, parabéns, você\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paroxítonas\u003c/td>\u003ctd>terminam em \u003cstrong>l, n, r, x, ps\u003c/strong>\u003c/td>\u003ctd>útil, hífen, açúcar, tórax, bíceps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>terminam em \u003cstrong>ã(s), ão(s), i(s), us, um, uns, on(s)\u003c/strong>\u003c/td>\u003ctd>órfã, órgão, táxi, lápis, vírus, álbum, próton\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>terminam em \u003cstrong>ditongo oral\u003c/strong> (ia, ie, io, ua, ue, uo…)\u003c/td>\u003ctd>história, série, sério, água, tênue\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Monossílabos tônicos\u003c/td>\u003ctd>terminam em \u003cstrong>a(s), e(s), o(s)\u003c/strong>\u003c/td>\u003ctd>pá, pé, pó, más, três, nós\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"tipo":"quadro","estilo":"dica","titulo":"Atalho para as paroxítonas","html":"\u003cp>É mais fácil decorar quando as paroxítonas \u003cstrong>NÃO\u003c/strong> levam acento: quando terminam em \u003cstrong>a, e, o, em, ens\u003c/strong> (casa, nome, livro, jovem, item, itens, imagem). Repare que é exatamente o contrário das oxítonas!\u003c/p>"}]},{"id":"1.4.2-s5","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Ditongos abertos e hiatos","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cul>\u003cli>\u003cstrong>Ditongos abertos éi, éu, ói\u003c/strong> levam acento nas \u003cstrong>oxítonas e monossílabos\u003c/strong>: papéis, herói, chapéu, céu, dói. Nas \u003cstrong>paroxítonas\u003c/strong> não levam mais acento: ideia, heroico, assembleia, jiboia.\u003c/li>\u003cli>\u003cstrong>Hiatos com i e u tônicos\u003c/strong>, sozinhos na sílaba (ou com s), levam acento: sa-\u003cstrong>í\u003c/strong>-da, sa-\u003cstrong>ú\u003c/strong>-de, ba-\u003cstrong>ú\u003c/strong>, pa-\u003cstrong>ís\u003c/strong>, ju-\u003cstrong>í\u003c/strong>-zes. Não se acentuam quando seguidos de \u003cstrong>nh\u003c/strong> (ra-i-nha) ou de outra consoante na mesma sílaba (ru-im, ju-iz).\u003c/li>\u003c/ul>"}]},{"id":"1.4.2-s6","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Acento diferencial e casos do Acordo Ortográfico","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Caso\u003c/th>\u003cth>Como fica\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>pôr (verbo) × por (preposição)\u003c/td>\u003ctd>o verbo leva acento\u003c/td>\u003ctd>Vou \u003cstrong>pôr\u003c/strong> o livro \u003cstrong>por\u003c/strong> cima da mesa.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>pôde (passado) × pode (presente)\u003c/td>\u003ctd>o passado leva acento\u003c/td>\u003ctd>Ontem ele não \u003cstrong>pôde\u003c/strong> vir; hoje ele \u003cstrong>pode\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tem / têm; vem / vêm\u003c/td>\u003ctd>o plural leva circunflexo\u003c/td>\u003ctd>Ele \u003cstrong>tem\u003c/strong> / Eles \u003cstrong>têm\u003c/strong>. Ela \u003cstrong>vem\u003c/strong> / Elas \u003cstrong>vêm\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>-eem (leem, creem, veem, deem)\u003c/td>\u003ctd>sem acento (Acordo)\u003c/td>\u003ctd>Eles \u003cstrong>leem\u003c/strong> muito.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>-oo (voo, enjoo, abençoo)\u003c/td>\u003ctd>sem acento (Acordo)\u003c/td>\u003ctd>O \u003cstrong>voo\u003c/strong> atrasou.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>para, pelo, polo, pera\u003c/td>\u003ctd>sem acento diferencial\u003c/td>\u003ctd>Ele \u003cstrong>para\u003c/strong> o carro.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.4.2-s7","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"A crase (acento grave)","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>A crase é a junção da preposição \u003cstrong>a\u003c/strong> com o artigo \u003cstrong>a\u003c/strong>: a + a = \u003cstrong>à\u003c/strong>. Ocorre antes de palavra feminina quando o verbo ou o nome exige a preposição \u003cem>a\u003c/em>.\u003c/p>\u003cp class=\"frase-exemplo\">“Vou \u003cstrong>à\u003c/strong> escola.” (quem vai, vai \u003cstrong>a\u003c/strong>; e \u003cem>a escola\u003c/em> tem artigo)  ×  “Vou \u003cstrong>a\u003c/strong> Curitiba.” (Curitiba não aceita artigo: “gosto de Curitiba”, não “da Curitiba”)\u003c/p>\u003cp class=\"frase-exemplo\">Truque: troque por uma palavra masculina. Se virar \u003cstrong>ao\u003c/strong>, há crase: “Vou \u003cstrong>ao\u003c/strong> clube” → “Vou \u003cstrong>à\u003c/strong> praia”.\u003c/p>\u003cp>Não há crase antes de palavras masculinas (a pé), de verbos (a partir), nem entre palavras repetidas (cara a cara).\u003c/p>"}]},{"id":"1.4.2-s8","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Ortografia: dúvidas mais comuns","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Dúvida\u003c/th>\u003cth>Uso correto\u003c/th>\u003cth>Exemplo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>mas × mais\u003c/td>\u003ctd>\u003cstrong>mas\u003c/strong> = porém; \u003cstrong>mais\u003c/strong> = quantidade\u003c/td>\u003ctd>Estudei, \u003cstrong>mas\u003c/strong> errei. Quero \u003cstrong>mais\u003c/strong> suco.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>mal × mau\u003c/td>\u003ctd>\u003cstrong>mal\u003c/strong> opõe-se a bem; \u003cstrong>mau\u003c/strong> opõe-se a bom\u003c/td>\u003ctd>Dormi \u003cstrong>mal\u003c/strong>. Ele não é \u003cstrong>mau\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>por que / porque / por quê / porquê\u003c/td>\u003ctd>pergunta: \u003cstrong>por que\u003c/strong>; resposta: \u003cstrong>porque\u003c/strong>; fim de frase: \u003cstrong>por quê\u003c/strong>; substantivo: \u003cstrong>o porquê\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Por que\u003c/strong> faltou? Faltei \u003cstrong>porque\u003c/strong> estava doente. Faltou \u003cstrong>por quê\u003c/strong>? Não sei \u003cstrong>o porquê\u003c/strong>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>há × a (tempo)\u003c/td>\u003ctd>\u003cstrong>há\u003c/strong> = tempo passado; \u003cstrong>a\u003c/strong> = tempo futuro ou distância\u003c/td>\u003ctd>Moro aqui \u003cstrong>há\u003c/strong> dois anos. A prova será daqui \u003cstrong>a\u003c/strong> dois dias.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>onde × aonde\u003c/td>\u003ctd>\u003cstrong>onde\u003c/strong> = lugar fixo; \u003cstrong>aonde\u003c/strong> = com verbos de movimento\u003c/td>\u003ctd>\u003cstrong>Onde\u003c/strong> você mora? \u003cstrong>Aonde\u003c/strong> você vai?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>x × ch\u003c/td>\u003ctd>depois de ditongo e de “en”, geralmente \u003cstrong>x\u003c/strong>\u003c/td>\u003ctd>caixa, peixe, enxada, enxergar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>-isar × -izar\u003c/td>\u003ctd>\u003cstrong>-isar\u003c/strong> se a palavra de origem tem s; senão, \u003cstrong>-izar\u003c/strong>\u003c/td>\u003ctd>pesquisa → pesquisar; análise → analisar; real → realizar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ç × ss\u003c/td>\u003ctd>\u003cstrong>ç\u003c/strong> nunca começa palavra nem vem antes de e/i\u003c/td>\u003ctd>caçada, açúcar, passeio, assistir\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.4.2-s9","video":{"url":"","sugestao":"Professora Pamba: Pamba acentuação gráfica novo acordo","link":"https://www.youtube.com/results?search_query=Pamba%20acentua%C3%A7%C3%A3o%20gr%C3%A1fica%20novo%20acordo"},"tipo":"leitura","titulo":"Fique atento e resumo","check":"Revisei o resumo","itens":[{"tipo":"quadro","estilo":"atencao","titulo":"Fique atento: erros mais comuns","html":"\u003cul>\u003cli>Acentuar paroxítonas terminadas em \u003cstrong>em/ens\u003c/strong>: jovem, item, itens não têm acento.\u003c/li>\u003cli>Colocar acento em \u003cstrong>ideia, heroico, voo, leem\u003c/strong> (o Acordo retirou esses acentos).\u003c/li>\u003cli>Esquecer o circunflexo do plural: eles \u003cstrong>têm\u003c/strong>, eles \u003cstrong>vêm\u003c/strong>.\u003c/li>\u003cli>Trocar \u003cstrong>mas/mais\u003c/strong>, \u003cstrong>mal/mau\u003c/strong> e os quatro \u003cstrong>porquês\u003c/strong> na redação.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"resumo","titulo":"Resumo para revisar","html":"\u003cul>\u003cli>Proparoxítonas: todas acentuadas.\u003c/li>\u003cli>Oxítonas: a(s), e(s), o(s), em, ens. Paroxítonas: o contrário (todas as outras terminações).\u003c/li>\u003cli>Monossílabos tônicos: a(s), e(s), o(s).\u003c/li>\u003cli>Ditongo aberto só leva acento em oxítonas e monossílabos (herói, céu; mas ideia).\u003c/li>\u003cli>Hiato i/u sozinho na sílaba: saída, saúde.\u003c/li>\u003cli>Diferencial: pôr, pôde, têm, vêm.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"saiba","titulo":"Para saber mais","html":"\u003cul>\u003cli>\u003ca href=\"https://www.todamateria.com.br\" target=\"_blank\" rel=\"noopener\">Toda Matéria — busque “regras de acentuação” e “uso dos porquês”\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.academia.org.br\" target=\"_blank\" rel=\"noopener\">VOLP — Vocabulário Ortográfico da Língua Portuguesa (Academia Brasileira de Letras)\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professor Noslen\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=regras%20de%20acentua%C3%A7%C3%A3o\" target=\"_blank\" rel=\"noopener\">buscar “regras de acentuação”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professora Pamba\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=Pamba%20acentua%C3%A7%C3%A3o%20gr%C3%A1fica%20novo%20acordo\" target=\"_blank\" rel=\"noopener\">buscar “Pamba acentuação gráfica novo acordo”\u003c/a>\u003c/li>\u003c/ul>"}]},{"id":"1.4.2-s10","video":{"url":"","sugestao":""},"tipo":"exemplos","titulo":"Exemplos resolvidos","check":"Vi os exemplos","itens":[{"tipo":"exemplo","nivel":"facil","enun":"\u003cp>Classifique e justifique o acento de “lâmpada”.\u003c/p>","res":"\u003cp>Sílabas: lâm-pa-da. A tônica é a antepenúltima: \u003cstrong>proparoxítona\u003c/strong>. Todas as proparoxítonas são acentuadas.\u003c/p>"},{"tipo":"exemplo","nivel":"medio","enun":"\u003cp>Por que “táxi” tem acento e “caqui” não?\u003c/p>","res":"\u003cp>\u003cstrong>Tá\u003c/strong>-xi é paroxítona terminada em \u003cstrong>i\u003c/strong> → leva acento.\u003c/p>\u003cp>Ca-\u003cstrong>qui\u003c/strong> é oxítona terminada em \u003cstrong>i\u003c/strong> → oxítonas em \u003cem>i\u003c/em> não são acentuadas.\u003c/p>"},{"tipo":"exemplo","nivel":"dificil","enun":"\u003cp>Justifique o acento ou a falta de acento em: herói, ideia, saúde, juiz.\u003c/p>","res":"\u003cp>\u003cstrong>herói\u003c/strong>: oxítona com ditongo aberto \u003cem>ói\u003c/em> → acento.\u003c/p>\u003cp>\u003cstrong>ideia\u003c/strong>: paroxítona com ditongo aberto \u003cem>ei\u003c/em> → sem acento (Acordo Ortográfico).\u003c/p>\u003cp>\u003cstrong>saúde\u003c/strong>: hiato com \u003cem>u\u003c/em> tônico sozinho na sílaba (sa-ú-de) → acento.\u003c/p>\u003cp>\u003cstrong>juiz\u003c/strong>: o \u003cem>i\u003c/em> tônico está com \u003cem>z\u003c/em> na mesma sílaba (ju-iz) → sem acento.\u003c/p>"},{"tipo":"quadro","estilo":"caso","titulo":"Estudo de caso: Aplicando a regra em três palavras","html":"\u003cp>“Herói” — oxítona com ditongo aberto ÓI, acentuada. “Ideia” — paroxítona com ditongo aberto EI, sem acento. “Saída” — hiato com I tônico isolado na sílaba, acentuada.\u003c/p>"}]},{"id":"1.4.2-s11","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Exercícios de fixação","check":"Fiz as questões","intro":"Resolva sem consultar a explicação. Nas questões de múltipla escolha, assinale apenas uma opção; nas atividades discursivas, registre uma justificativa curta. Confira o gabarito ao final.","itens":[{"tipo":"questao","id":"LP-09-q1","nivel":"facil","enun":"\u003cp>A palavra “café” é:\u003c/p>","opts":["proparoxítona.","paroxítona.","monossílabo.","oxítona."],"ans":"D","exp":"Ca-\u003cstrong>fé\u003c/strong>: a tônica é a última sílaba."},{"tipo":"questao","id":"LP-09-q2","nivel":"facil","enun":"\u003cp>Assinale a alternativa em que todas as palavras estão acentuadas corretamente:\u003c/p>","opts":["jóvem, sofá, médico","café, lápis, árvore","idéia, chapéu, pé","cajú, avô, túnel"],"ans":"B","exp":"Corrigindo as outras: jovem (sem acento), ideia (sem acento), caju (oxítona em u, sem acento)."},{"tipo":"questao","id":"LP-09-q3","nivel":"medio","enun":"\u003cp>Os acentos de “lápis”, “papéis” e “baú” se justificam, respectivamente, por:\u003c/p>","opts":["oxítona em is; hiato; ditongo aberto.","proparoxítona; oxítona; paroxítona.","paroxítona terminada em is; ditongo aberto em oxítona; hiato com u tônico.","monossílabo; ditongo; hiato."],"ans":"C","exp":"Lá-pis (paroxítona terminada em is), pa-péis (oxítona com ditongo aberto éi), ba-ú (hiato com u sozinho na sílaba)."},{"tipo":"questao","id":"LP-09-q4","nivel":"facil","discursiva":true,"linhas":3,"enun":"\u003cp>Acentue, quando necessário: arvore, cafe, lapis, util, voce, tambem, historia, sabado, jovem, caju.\u003c/p>","resposta":"árvore, café, lápis, útil, você, também, história, sábado; jovem e caju ficam sem acento.","exp":"Ponto inteiro com 9 ou 10 acertos; meio ponto com 6 a 8."},{"tipo":"questao","id":"LP-09-q5","nivel":"medio","enun":"\u003cp>Complete: “Vou ______ o livro ______ cima da mesa.”\u003c/p>","opts":["pôr — por","por — pôr","pôr — pôr","por — por"],"ans":"A","exp":"Pôr (verbo) leva acento diferencial; por (preposição) não."},{"tipo":"questao","id":"LP-09-q6","nivel":"dificil","enun":"\u003cp>De acordo com o Acordo Ortográfico vigente, está correta a sequência:\u003c/p>","opts":["idéia, vôo, lêem","idéia, voo, leem","ideia, voo, leem","ideia, vôo, lêem"],"ans":"C","exp":"O Acordo retirou o acento do ditongo aberto em paroxítonas (ideia), do “oo” (voo) e do “eem” (leem)."},{"tipo":"questao","id":"LP-09-q7","nivel":"medio","discursiva":true,"linhas":3,"enun":"\u003cp>Escreva uma frase com “tem” e outra com “têm”; depois, uma com “vem” e outra com “vêm”. Explique a regra.\u003c/p>","resposta":"Exemplos: “Ele tem um gato.” / “Eles têm dois gatos.” “Ela vem hoje.” / “Elas vêm amanhã.” Regra: no plural (eles/elas), esses verbos levam acento circunflexo.","exp":""},{"tipo":"questao","id":"LP-09-q8","nivel":"facil","enun":"\u003cp>Complete: “Estudei muito, ______ ainda tenho dúvidas.”\u003c/p>","opts":["mas","mais","más","maz"],"ans":"A","exp":"Ideia de oposição (porém): mas."},{"tipo":"questao","id":"LP-09-q9","nivel":"medio","enun":"\u003cp>Assinale a sequência correta: “______ você faltou?” / “Faltei ______ estava doente.”\u003c/p>","opts":["Porque — por que","Por que — porque","Por quê — porquê","Porquê — por que"],"ans":"B","exp":"Pergunta: por que (separado). Resposta/explicação: porque (junto)."},{"tipo":"questao","id":"LP-09-q10","nivel":"dificil","enun":"\u003cp>Em qual par as duas palavras são acentuadas pela regra do hiato?\u003c/p>","opts":["café, sofá","lâmpada, médico","papéis, céu","saída, baú"],"ans":"D","exp":"Sa-í-da e ba-ú têm i/u tônicos sozinhos na sílaba (hiato). (A) oxítonas; (B) proparoxítonas; (C) ditongos abertos."},{"tipo":"questao","id":"LP-09-q11","nivel":"medio","enun":"\u003cp>Complete: “Ele não é um ______ aluno; só se comportou ______ hoje.”\u003c/p>","opts":["mal — mau","mau — mau","mal — mal","mau — mal"],"ans":"D","exp":"Mau (oposto de bom) acompanha substantivo; mal (oposto de bem) modifica o verbo."},{"tipo":"questao","id":"LP-09-q12","nivel":"dificil","discursiva":true,"linhas":5,"enun":"\u003cp>Encontre e corrija os 6 erros de acentuação e ortografia: “Ontem fui a escola de manhã. A professora explicou a materia de historia, mas eu estava com sono porque dormi mau. Ha dois dias não durmo direito e ninguem percebeu.”\u003c/p>","resposta":"à escola (crase); matéria; história; mal (oposto de bem); Há (tempo passado); ninguém.","exp":"Um sexto de ponto por correção."}]},{"id":"1.4.2-s12","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Desafio extra: mais 6 questões objetivas","check":"Fiz o desafio","itens":[{"tipo":"questao","id":"LP-09-d13","nivel":"objetiva","enun":"\u003cp>Assinale a palavra acentuada por ser proparoxítona:\u003c/p>","opts":["médico.","café.","herói.","chapéu."],"ans":"A","exp":"MÉ-di-co é proparoxítona; todas recebem acento."},{"tipo":"questao","id":"LP-09-d14","nivel":"objetiva","enun":"\u003cp>Qual grafia está correta após o Acordo Ortográfico?\u003c/p>","opts":["idéia.","ideia.","heróico.","assembléia."],"ans":"B","exp":"Paroxítonas com ditongo aberto ei/oi não levam acento: ideia."},{"tipo":"questao","id":"LP-09-d15","nivel":"objetiva","enun":"\u003cp>Em qual opção a acentuação do hiato está correta?\u003c/p>","opts":["saida.","pais (nação).","saída.","juizés."],"ans":"C","exp":"Sa-í-da: i tônico forma hiato e está isolado na sílaba."},{"tipo":"questao","id":"LP-09-d16","nivel":"objetiva","enun":"\u003cp>Assinale a palavra corretamente escrita:\u003c/p>","opts":["excessão.","concerteza.","enchergar.","exceção."],"ans":"D","exp":"Exceção escreve-se com ç; demais alternativas têm grafia inadequada."},{"tipo":"questao","id":"LP-09-d17","nivel":"objetiva","enun":"\u003cp>Qual frase usa crase corretamente?\u003c/p>","opts":["Fui à escola cedo.","Fui à pé.","Comecei à estudar.","Cheguei à Recife."],"ans":"A","exp":"Ir a + a escola = à escola; a pé e a estudar não recebem crase."},{"tipo":"questao","id":"LP-09-d18","nivel":"objetiva","enun":"\u003cp>Qual palavra é oxítona acentuada?\u003c/p>","opts":["lapis.","também.","medico.","arvore."],"ans":"B","exp":"Tam-BÉM: oxítona terminada em -em recebe acento."}]}]}]},{"num":"1.5","titulo":"Produção de Texto","intro":"O último submódulo junta tudo o que foi estudado para escrever uma narrativa nota máxima, de acordo com os oito critérios do edital: criatividade, construção textual, paragrafação, organização espacial, maiúsculas e minúsculas, pontuação, acentuação e ortografia.","temas":[{"id":"1.5.1","cod":"LP-10","titulo":"Produção de texto: a narrativa do planejamento à revisão","bncc":"EF67LP30, EF67LP36, EF67LP32, EF67LP33","tempo":"2h","dia":"Dia 9 (29/10)","objetivo":"Planejar, escrever e revisar uma narrativa criativa, com início, desenvolvimento e conclusão, parágrafos coesos e coerentes, boa organização na folha e correção de maiúsculas, pontuação, acentuação e ortografia.","secoes":[{"id":"1.5.1-s1","video":{"url":"","sugestao":""},"tipo":"aquecimento","titulo":"Aquecimento","check":"Fiz o aquecimento","itens":[{"tipo":"flips","cartas":[{"frente":"Quais são os elementos de uma narrativa?","verso":"narrador, personagens, tempo, espaço e enredo."},{"frente":"Como se indica a fala de um personagem?","verso":"em novo parágrafo, com travessão."},{"frente":"Quando usamos letra maiúscula?","verso":"no início de frases, em nomes próprios e em títulos."}]}]},{"id":"1.5.1-s2","video":{"url":"","sugestao":"Professor Noslen: texto narrativo elementos da narrativa","link":"https://www.youtube.com/results?search_query=texto%20narrativo%20elementos%20da%20narrativa"},"tipo":"leitura","titulo":"Aprenda com o esquema","check":"Vi o esquema","itens":[{"tipo":"infografico","html":"\n\u003cdiv class=\"ig\">\n  \u003cp class=\"ig-titulo\">Uma história em quatro movimentos\u003c/p>\n  \u003col class=\"movimentos\">\n    \u003cli class=\"mov m1\">\u003cb>Situação\u003c/b>\u003cspan>Quem? Onde? Quando?\u003c/span>\u003c/li>\n    \u003cli class=\"mov m2\">\u003cb>Conflito\u003c/b>\u003cspan>O que rompe a rotina?\u003c/span>\u003c/li>\n    \u003cli class=\"mov m3\">\u003cb>Clímax\u003c/b>\u003cspan>Qual é o momento decisivo?\u003c/span>\u003c/li>\n    \u003cli class=\"mov m4\">\u003cb>Desfecho\u003c/b>\u003cspan>O que mudou no final?\u003c/span>\u003c/li>\n  \u003c/ol>\n  \u003cp class=\"ig-regra\">A coerência exige pistas antes do desfecho. Surpresa não é contradição.\u003c/p>\n\u003c/div>"},{"tipo":"quadro","estilo":"esquema","titulo":"Planejamento em cinco linhas antes da redação","html":"\u003cp>Defina personagem, ambiente, problema, ação decisiva e consequência. Na revisão, procure: começo/desenvolvimento/fim, progressão dos fatos, conectivos, parágrafos e ortografia. Escreva uma versão completa e só depois reescreva com mais clareza.\u003c/p>"}]},{"id":"1.5.1-s3","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"O que a banca avalia","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>O edital do INVEST lista oito critérios para a produção de texto. Conhecê-los é o primeiro passo para tirar uma boa nota:\u003c/p>\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Critério\u003c/th>\u003cth>O que significa na prática\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Criatividade\u003c/td>\u003ctd>História original, com título interessante, um conflito que prende e detalhes que fazem o leitor “ver” a cena.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Construção textual\u003c/td>\u003ctd>A história tem começo (situação inicial), meio (conflito e clímax) e fim (desfecho).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Paragrafação, coesão e coerência\u003c/td>\u003ctd>Cada parágrafo tem uma função; as ideias se ligam com conectivos; não há contradições.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Organização espacial\u003c/td>\u003ctd>Título, margens, recuo de parágrafo, letra legível, sem rasuras.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Maiúsculas e minúsculas\u003c/td>\u003ctd>Maiúscula no início de frases, em nomes próprios e no título; minúscula no resto.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pontuação\u003c/td>\u003ctd>Pontos, vírgulas e travessões nos lugares certos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Acentuação\u003c/td>\u003ctd>Regras de acento aplicadas corretamente.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ortografia\u003c/td>\u003ctd>Palavras escritas corretamente (mas/mais, mal/mau, porquês, x/ch…).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.5.1-s4","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"A estrutura da narrativa","check":"Li esta parte","itens":[{"tipo":"img","src":"img:p_narrativa","legenda":"A curva da narrativa: a tensão sobe até o clímax e se resolve no desfecho."},{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Parte\u003c/th>\u003cth>O que contar\u003c/th>\u003cth>Tamanho sugerido (texto de 20 a 30 linhas)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Situação inicial\u003c/td>\u003ctd>Apresente o personagem, o lugar e o tempo. Mostre a rotina antes do problema.\u003c/td>\u003ctd>1 parágrafo (4 a 6 linhas)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Conflito\u003c/td>\u003ctd>Algo acontece e quebra o equilíbrio: um problema, um mistério, um desafio.\u003c/td>\u003ctd>1 parágrafo (4 a 6 linhas)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Desenvolvimento e clímax\u003c/td>\u003ctd>O personagem tenta resolver o problema; a tensão aumenta até o momento decisivo.\u003c/td>\u003ctd>1 ou 2 parágrafos (8 a 12 linhas)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Desfecho\u003c/td>\u003ctd>Como o conflito termina. Pode trazer uma reflexão ou uma surpresa coerente.\u003c/td>\u003ctd>1 parágrafo (4 a 6 linhas)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.5.1-s5","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Planejar antes de escrever (5 minutos que valem pontos)","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Antes de escrever, responda no rascunho, em poucas palavras:\u003c/p>\u003col>\u003cli>\u003cstrong>Quem?\u003c/strong> O protagonista (nome, idade, uma característica marcante).\u003c/li>\u003cli>\u003cstrong>Onde e quando?\u003c/strong> O espaço e o tempo da história.\u003c/li>\u003cli>\u003cstrong>Qual o problema?\u003c/strong> O conflito que vai movimentar a história.\u003c/li>\u003cli>\u003cstrong>O que ele faz?\u003c/strong> As tentativas e o momento de maior tensão (clímax).\u003c/li>\u003cli>\u003cstrong>Como termina?\u003c/strong> O desfecho e, se quiser, o que o personagem aprendeu.\u003c/li>\u003c/ol>"}]},{"id":"1.5.1-s6","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Como ser criativa sem perder a coerência","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cul>\u003cli>\u003cstrong>Comece com algo que prenda:\u003c/strong> um diálogo, um som, uma pergunta, uma ação no meio. Em vez de “Era uma vez uma menina”, tente: “O celular vibrou três vezes antes de Júlia perceber que a mensagem não era para ela.”\u003c/li>\u003cli>\u003cstrong>Use os cinco sentidos:\u003c/strong> cheiros, sons, cores, texturas tornam a cena viva (“o cheiro de bolo queimado tomou a cozinha”).\u003c/li>\u003cli>\u003cstrong>Mostre, não apenas diga:\u003c/strong> em vez de “Pedro estava nervoso”, escreva “Pedro roía as unhas e olhava o relógio a cada minuto”.\u003c/li>\u003cli>\u003cstrong>Inclua um diálogo curto:\u003c/strong> dá ritmo e mostra a personalidade dos personagens.\u003c/li>\u003cli>\u003cstrong>Final surpreendente, mas possível:\u003c/strong> a surpresa precisa combinar com o que foi contado antes (coerência).\u003c/li>\u003cli>\u003cstrong>Título criativo:\u003c/strong> curto, que desperte curiosidade, sem entregar o final.\u003c/li>\u003c/ul>"}]},{"id":"1.5.1-s7","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Parágrafos, coesão e coerência","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>\u003cstrong>Paragrafação:\u003c/strong> cada parágrafo corresponde a um momento da história. Mudou de momento, de lugar, de tempo ou entrou um diálogo? Novo parágrafo, com recuo.\u003c/p>\u003cp>\u003cstrong>Coesão\u003c/strong> é a ligação entre as partes do texto. Use:\u003c/p>\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Recurso\u003c/th>\u003cth>Exemplos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Conectivos de tempo\u003c/td>\u003ctd>no dia seguinte, enquanto isso, de repente, logo depois, horas mais tarde, por fim, finalmente\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Conectivos de causa e consequência\u003c/td>\u003ctd>porque, como, por isso, então, de modo que\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Conectivos de oposição\u003c/td>\u003ctd>mas, porém, no entanto, mesmo assim\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Retomada para evitar repetição\u003c/td>\u003ctd>pronomes (ele, ela, o, a, isso), sinônimos (o cachorro → o animal → o bichinho), nomes (Pedro → o garoto)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Coerência\u003c/strong> é o texto fazer sentido: os fatos seguem uma lógica, não há contradições (se era noite, não pode haver sol forte na mesma cena) e o final combina com o começo.\u003c/p>"}]},{"id":"1.5.1-s8","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Organização espacial: a aparência do texto","check":"Li esta parte","itens":[{"tipo":"img","src":"img:p_folha","legenda":"Como organizar o texto na folha."},{"tipo":"html","html":"\u003cul>\u003cli>Título centralizado na primeira linha, com maiúscula inicial (sem ponto final).\u003c/li>\u003cli>Recuo de cerca de 2 cm no início de cada parágrafo.\u003c/li>\u003cli>Respeite as margens: não escreva fora delas.\u003c/li>\u003cli>Letra legível e de tamanho regular.\u003c/li>\u003cli>Errou? Passe \u003cstrong>um traço\u003c/strong> sobre a palavra e escreva a certa ao lado. Nada de borrões.\u003c/li>\u003c/ul>"}]},{"id":"1.5.1-s9","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Maiúsculas e minúsculas","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Use MAIÚSCULA\u003c/th>\u003cth>Use minúscula\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Início de frase e após ponto final, de interrogação ou de exclamação que encerra a frase\u003c/td>\u003ctd>Meses e dias da semana: janeiro, segunda-feira\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Nomes próprios de pessoas, cidades, estados, países e instituições: Ana, Brasil, Bahia, Escola Machado de Assis\u003c/td>\u003ctd>Depois de vírgula, ponto e vírgula e, em geral, depois de dois-pontos (exceto na fala de personagem)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Início da fala do personagem, após o travessão\u003c/td>\u003ctd>Nomes de estações do ano e pontos cardeais (verão, norte)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Títulos de obras e o título da redação (primeira palavra)\u003c/td>\u003ctd>Palavras comuns no me
