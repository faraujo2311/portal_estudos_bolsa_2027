<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilha de Língua Portuguesa · Bolsa INVEST 2027</title>
<meta name="description" content="Portal de estudos de Língua Portuguesa para a Avaliação Diagnóstica do 9º ano.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📒%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --surface: #F6F7F9;
  --surface-2: #EEF0F4;
  --text: #1D2330;
  --muted: #5E6675;
  --line: #E4E7ED;
  --accent: #2F4BBF;
  --accent-soft: #EEF1FC;
  --mark: #FFE66D;
  --mark-soft: #FFF8D9;
  --ok: #177F55;
  --ok-soft: #E6F4EC;
  --err: #C23B33;
  --err-soft: #FBEAE8;
  --h1: #E0684B; --h2: #1F9D74; --h3: #6C5CE7; --h4: #C99700;
  --raio: 16px;
  --fonte: "Lexend", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14161C; --surface: #1C1F27; --surface-2: #252935; --text: #E9EBF0; --muted: #A3A9B6; --line: #2E3240;
  --accent: #8EA2FF; --accent-soft: #232A45; --mark: #E6C84A; --mark-soft: #2E2A1A; --ok: #5BD19D; --ok-soft: #173327; --err: #FF8A80; --err-soft: #3A1F1D;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: calc(80px + env(safe-area-inset-top, 0px)); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--fonte); font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; height: auto; }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, h4 { font-family: var(--fonte); color: var(--text); line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
strong, b { font-weight: 600; }
.marca-texto { background: linear-gradient(transparent 62%, var(--mark) 62% 94%, transparent 94%); }

/* topo */
.topo { position: sticky; top: 0; z-index: 40; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
.marca-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 600; font-size: 17px; white-space: nowrap; }
.logo-selo { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.nav-topo { margin-left: auto; display: flex; gap: 2px; align-items: center; }
.nav-topo a, .nav-topo button { text-decoration: none; padding: 8px 12px; border-radius: 10px; font-size: 15px; color: var(--muted); background: none; border: 0; cursor: pointer; white-space: nowrap; }
.nav-topo a:hover, .nav-topo button:hover { color: var(--text); background: var(--surface); }
.nav-topo a.ativo { color: var(--text); font-weight: 500; background: var(--surface); }
.botao-admin.ligado { background: var(--text) !important; color: var(--bg) !important; }
.menu-movel { display: none; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; cursor: pointer; }
.anel-topo { --p: 0; width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; font-size: 10px; font-weight: 600; }
.anel-topo span { width: 28px; height: 28px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; }

/* estrutura */
.layout { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: calc(100vh - 64px); }
.lateral-nav { border-right: 1px solid var(--line); padding: 20px 12px 40px; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; background: var(--bg); }
.lateral-nav h3 { font-size: 12px; color: var(--muted); font-weight: 500; margin: 22px 10px 6px; }
.lateral-nav h3:first-child { margin-top: 4px; }
.item-nav { display: flex; align-items: flex-start; gap: 10px; padding: 7px 10px; border-radius: 10px; text-decoration: none; color: var(--text); font-size: 14.5px; line-height: 1.35; }
.item-nav:hover { background: var(--surface); }
.item-nav.ativo { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.ponto { width: 16px; height: 16px; flex: 0 0 16px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); position: relative; }
.ponto.meio { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, var(--bg) 50%); }
.ponto.cheio { border-color: var(--ok); background: var(--ok); }
.ponto.cheio::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; line-height: 1; }
.conteudo { padding: 36px clamp(16px, 4vw, 56px) 96px; min-width: 0; }
.largura { max-width: 1180px; margin: 0 auto; }

/* início */
.hero { padding: 16px 0 40px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: center; }
.hero h1 { font-size: clamp(34px, 4.6vw, 54px); margin: 0 0 16px; line-height: 1.1; letter-spacing: -0.025em; }
.hero .lead { font-size: 19px; color: var(--muted); max-width: 44ch; margin: 0 0 28px; }
.trilha-svg { width: 100%; height: auto; display: block; }
.parada { cursor: pointer; }
.parada text { font-size: 14px; font-weight: 600; pointer-events: none; font-family: var(--fonte); }
.parada .rot { font-size: 11px; font-weight: 400; fill: var(--muted); }
.legenda-trilha { font-size: 13px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.legenda-trilha i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; border: 2px solid var(--text); }
.grade-inicio { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.cartao { background: var(--bg); border: 1px solid var(--line); border-radius: var(--raio); padding: 24px; }
.cartao h2 { font-size: 18px; margin: 0 0 12px; }
.cartao.destaque { background: var(--mark-soft); border-color: transparent; }
.cartao p { margin: 0 0 12px; }
.dia-lista { list-style: none; margin: 0; padding: 0; }
.dia-lista li { display: grid; grid-template-columns: 82px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.dia-lista li:last-child { border-bottom: 0; }
.dia-lista .mat { color: var(--muted); }
.dia-lista .hoje-item { font-weight: 600; }
.dia-lista a { text-decoration: none; }
.numeros { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
.numeros b { display: block; font-size: 30px; font-weight: 600; line-height: 1.1; }
.numeros span { font-size: 13.5px; color: var(--muted); }
.botao { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 12px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--bg); font-weight: 500; text-decoration: none; cursor: pointer; font-size: 15.5px; }
.botao:hover { filter: brightness(1.08); }
.botao.sec { background: transparent; color: var(--accent); border-color: var(--line); }
.botao.sec:hover { border-color: var(--accent); filter: none; }
.botao.pequeno { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.botao[disabled] { opacity: .45; cursor: default; }
.temas-hoje { display: grid; gap: 8px; margin: 4px 0 14px; }
.temas-hoje a { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-decoration: none; color: var(--text); background: var(--bg); border-radius: 12px; padding: 12px 14px; font-weight: 500; }
.temas-hoje a span { font-size: 13px; color: var(--muted); font-weight: 400; }

/* tema */
.cab-tema { max-width: 780px; margin-bottom: 26px; }
.cab-tema .sobre { font-size: 14px; color: var(--muted); margin: 0 0 6px; }
.cab-tema h1 { font-size: clamp(28px, 3.4vw, 40px); margin: 0 0 10px; letter-spacing: -0.02em; }
.cab-tema .objetivo { color: var(--muted); margin: 0; font-size: 16.5px; }
.meta-tema { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13.5px; color: var(--muted); margin-top: 12px; }
.etapas { margin: 0 0 32px; padding: 18px 20px; background: var(--surface); border-radius: var(--raio); }
.grupos { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.grupo { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 14px; font-size: 14px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.grupo .cont { font-size: 12px; }
.grupo.atual { border-color: var(--text); color: var(--text); font-weight: 500; }
.grupo.feito { color: var(--ok); border-color: var(--ok); }
.grupo.feito::before { content: "✓"; font-weight: 700; }
.segmentos { display: flex; gap: 4px; }
.seg { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); border: 0; padding: 0; cursor: pointer; min-width: 6px; }
.seg:hover { background: var(--line); }
.seg.feito { background: var(--ok); }
.seg.atual { background: var(--mark); box-shadow: 0 0 0 2px var(--text); }
.pos-bloco { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.pos-bloco select { font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; max-width: 100%; }

.bloco { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
.material { min-width: 0; }
.material .grupo-rot { font-size: 13px; font-weight: 500; color: var(--accent); margin: 0 0 6px; }
.material > h2 { font-size: clamp(24px, 2.6vw, 30px); margin: 0 0 22px; letter-spacing: -0.015em; }
.leitura { font-size: 18px; line-height: 1.75; max-width: 70ch; }
.leitura h3 { font-size: 20px; margin: 28px 0 8px; }
.leitura h4 { font-size: 18px; margin: 24px 0 6px; }
.leitura ul, .leitura ol { padding-left: 1.3em; }
.leitura li { margin: 6px 0; }
.frase-exemplo { border-left: 3px solid var(--line); padding: 2px 0 2px 16px; margin: 12px 0; }
.rodape-bloco { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); max-width: 70ch; }
.lado { display: grid; gap: 16px; position: sticky; top: 92px; }
.painel { background: var(--surface); border-radius: var(--raio); padding: 16px; }
.painel h3 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
.painel p { font-size: 14px; margin: 6px 0; }
.painel + .painel { margin-top: 0; }
.video-box { aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #0d0f14; }
.video-box iframe { width: 100%; height: 100%; border: 0; display: block; }
.video-capa { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #0d0f14 center / cover no-repeat; text-decoration: none; }
.video-capa::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .05) 30%, rgba(0, 0, 0, .7)); }
.video-capa .play { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 60px; height: 42px; border-radius: 12px; background: #E62117; display: grid; place-items: center; z-index: 1; }
.video-capa .play::before { content: ""; border-left: 15px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 4px; }
.video-capa .rot-capa { position: absolute; left: 12px; right: 12px; bottom: 10px; color: #fff; font-size: 13px; z-index: 1; line-height: 1.35; }
.video-vazio { aspect-ratio: 16 / 9; border-radius: 12px; border: 1.5px dashed var(--line); display: grid; place-items: center; text-align: center; padding: 14px; font-size: 14px; color: var(--muted); background: var(--bg); }
.aviso-local { font-size: 12.5px; color: var(--muted); margin: 8px 0 0 !important; line-height: 1.45; }
.mais-videos { display: grid; gap: 12px; margin-top: 12px; }
details.notas summary { cursor: pointer; font-size: 14px; font-weight: 600; list-style: none; }
details.notas summary::-webkit-details-marker { display: none; }
details.notas summary::before { content: "+ "; color: var(--accent); }
details.notas[open] summary::before { content: "− "; }
details.notas textarea { width: 100%; min-height: 110px; margin-top: 10px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 15px; background: var(--bg); color: var(--text); }

/* check */
.check { display: inline-flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--text); border-radius: 12px; padding: 9px 14px 9px 10px; cursor: pointer; font-size: 14.5px; }
.check .caixa { width: 22px; height: 22px; flex: 0 0 22px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; font-size: 13px; color: transparent; }
.check:hover { border-color: var(--accent); }
.check.feito { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.check.feito .caixa { background: var(--ok); border-color: var(--ok); color: #fff; }
.check.anima .caixa { animation: pop .3s ease; }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.painel .check { width: 100%; margin-top: 12px; }

/* conteúdo */
.quadro { border-radius: 12px; padding: 16px 20px; margin: 22px 0; background: var(--surface); border-left: 3px solid var(--muted); font-size: 16.5px; line-height: 1.65; }
.quadro > .q-tit { font-weight: 600; font-size: 16px; margin: 0 0 6px; }
.quadro p:last-child, .quadro ul:last-child { margin-bottom: 0; }
.quadro p:first-child { margin-top: 0; }
.quadro.atencao { background: var(--mark-soft); border-color: var(--h4); }
.quadro.resumo { background: var(--accent-soft); border-color: var(--accent); }
.quadro.dica, .quadro.esquema { background: var(--ok-soft); border-color: var(--h2); }
.quadro.caso { border-color: var(--h1); }
.quadro.saiba, .quadro.regra { border-color: var(--line); }
.texto-apoio { border-radius: 14px; padding: 22px 26px; margin: 18px 0; background: var(--surface); font-family: Georgia, "Times New Roman", serif; font-size: 18.5px; line-height: 1.8; }
.texto-apoio .texto-titulo { font-family: var(--fonte); font-weight: 600; margin: 0 0 10px; font-size: 16px; }
.texto-apoio .fonte { text-align: right; font-size: 13px; color: var(--muted); font-style: italic; font-family: var(--fonte); }
.figura { margin: 24px 0; }
.figura img { border-radius: 12px; display: block; margin: 0 auto; background: #fff; }
.figura figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; text-align: center; }
.figura.w70 img { width: 70%; } .figura.w50 img { width: 50%; }
.video-item { margin: 24px 0; max-width: 70ch; }
.video-item .rot-video { font-size: 14px; color: var(--muted); margin-top: 8px; }
.separador { border: 0; border-top: 1px solid var(--line); margin: 34px 0; }
.tabela-wrap { overflow-x: auto; margin: 18px 0; }
.tabela { border-collapse: collapse; width: 100%; font-size: 15.5px; line-height: 1.5; min-width: 460px; }
.tabela th { text-align: left; padding: 10px 12px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid var(--text); }
.tabela td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }

/* cartões */
.flips { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.flip, .carta { border: 1px solid var(--line); cursor: pointer; text-align: left; border-radius: 14px; padding: 18px; min-height: 140px; background: var(--bg); position: relative; transition: border-color .15s; }
.flip:hover, .carta:hover { border-color: var(--accent); }
.flip .verso, .carta .verso { display: none; }
.flip.virado .frente, .carta.virado .frente { display: none; }
.flip.virado .verso, .carta.virado .verso { display: block; }
.flip.virado, .carta.virado { background: var(--surface); }
.flip .frente > b, .flip .verso > b { display: block; font-size: 13px; font-weight: 500; color: var(--accent); margin-bottom: 6px; }
.flip .dica-toque, .carta .frente small { display: block; font-size: 13px; color: var(--muted); margin-top: 10px; }
.carta .verso b { display: block; font-weight: 600; margin-bottom: 4px; }

/* infográficos */
.ig { background: var(--surface); border-radius: 18px; padding: 24px; margin: 4px 0 20px; }
.ig-titulo { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
.ig-sub { color: var(--muted); font-size: 14.5px; margin: 0 0 16px; }
.ig-regra { font-size: 15.5px; margin: 16px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }
.c-coral, .c-menta, .c-lavanda, .c-amarelo { background: var(--bg) !important; border-top: 4px solid !important; }
.c-coral { border-top-color: var(--h1) !important; } .c-menta { border-top-color: var(--h2) !important; } .c-lavanda { border-top-color: var(--h3) !important; } .c-amarelo { border-top-color: var(--h4) !important; }
.cartas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.carta .frente b { font-size: 17px; display: block; font-weight: 500; }
.carta .grande { font-size: 26px !important; font-weight: 600 !important; }
.degraus { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: end; }
.degrau { border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-align: left; cursor: pointer; display: grid; gap: 4px; align-content: start; background: var(--bg); border-top: 4px solid; }
.degrau .deg-n { font-size: 13px; color: var(--muted); }
.degrau b { font-size: 18px; font-weight: 600; }
.degrau span { font-size: 14.5px; color: var(--muted); }
.d1 { border-top-color: var(--h2); min-height: 140px; } .d2 { border-top-color: var(--h4); min-height: 170px; } .d3 { border-top-color: var(--h1); min-height: 200px; }
.oculto { display: none; }
.revelado .oculto { display: block; }
.degrau em { font-size: 14px; font-style: normal; background: var(--surface); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
.linhas-ig { display: grid; gap: 8px; }
.linha-ig { display: grid; grid-template-columns: 1fr 1fr 1.4fr 1.2fr; gap: 10px; align-items: center; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; cursor: pointer; }
.linha-ig b { font-weight: 600; color: var(--accent); }
.linha-ig .perg { color: var(--muted); }
.linha-ig .oculto { display: inline; visibility: hidden; }
.linha-ig.revelado .oculto { visibility: visible; }
.linha-ig .tag { color: var(--h1); font-weight: 500; font-size: 13px; }
.cadeia { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
.elo { flex: 1 1 150px; border-radius: 12px; padding: 14px 16px; background: var(--bg); border: 1px solid var(--line); border-top: 4px solid; }
.elo b { display: block; font-size: 19px; font-weight: 600; }
.elo small { color: var(--muted); font-size: 13.5px; }
.e-menta { border-top-color: var(--h2); } .e-lavanda { border-top-color: var(--h3); } .e-coral { border-top-color: var(--h1); }
.seta-ig { align-self: center; color: var(--muted); font-size: 22px; }
.escolhas { display: grid; gap: 10px; }
.escolha { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.escolha button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
.escolha button:hover { border-color: var(--accent); }
.escolha small { flex-basis: 100%; color: var(--muted); display: none; font-size: 14px; }
.escolha.respondido small { display: block; }
.escolha button.certo { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.escolha button.certo::before { content: "✓ "; }
.escolha button.errado { border-color: var(--err); background: var(--err-soft); color: var(--err); text-decoration: line-through; }
.virgula-jogo { text-align: center; padding: 12px 0 6px; background: var(--bg); border-radius: 14px; }

","temas":["1.4.2","1.5.1"],"nota":"revisão leve e dormir cedo"},{"dia":10,"data":"2026-10-30","rotulo":"Sex 30/10","area":"PROVA","texto":"Avaliação Diagnóstica INVEST"}],"submodulos":[{"num":"1.1","titulo":"Leitura e Compreensão Textual","intro":"Neste submódulo, ela aprende as estratégias que valem para qualquer texto da prova: localizar, inferir e interpretar, reconhecendo gêneros, humor, ironia e fatos e opiniões. Essas habilidades também ajudam em todas as questões de gramática, que costumam vir acompanhadas de um texto.","temas":[{"id":"1.1.1","cod":"LP-01","titulo":"Leitura e compreensão textual: gêneros e estratégias","bncc":"EF69LP03, EF69LP05, EF69LP47","tempo":"1h30","dia":"Dia 1 (21/10)","objetivo":"Localizar informações, fazer inferências, reconhecer gêneros textuais e interpretar o sentido global, o humor e a finalidade de um texto.","secoes":[{"id":"1.1.1-s1","video":{"url":"","sugestao":""},"tipo":"aquecimento","titulo":"Aquecimento","check":"Fiz o aquecimento","itens":[{"tipo":"flips","cartas":[{"frente":"Qual a diferença entre \u003cstrong>assunto\u003c/strong> e \u003cstrong>tema\u003c/strong> de um texto?","verso":"assunto é sobre o que o texto fala (um celular sem bateria); tema é a ideia maior que ele discute (o valor do contato entre as pessoas)."},{"frente":"O que é um \u003cstrong>fato\u003c/strong> e o que é uma \u003cstrong>opinião\u003c/strong>?","verso":"fato pode ser comprovado (“a horta tem 300 garrafas”); opinião é um julgamento de alguém (“a horta é linda”)."},{"frente":"Quem conta a história em uma narrativa?","verso":"o narrador, que pode participar da história (1ª pessoa: “eu”) ou apenas observá-la (3ª pessoa: “ele”, “ela”)."}]}]},{"id":"1.1.1-s2","video":{"url":"","sugestao":"Professor Noslen: interpretação de texto","link":"https://www.youtube.com/results?search_query=interpreta%C3%A7%C3%A3o%20de%20texto"},"tipo":"leitura","titulo":"Aprenda com o esquema","check":"Vi o esquema","itens":[{"tipo":"infografico","html":"\n\u003cdiv class=\"ig ig-escada\">\n  \u003cp class=\"ig-titulo\">A escada da interpretação\u003c/p>\n  \u003cp class=\"ig-sub\">Toque em cada degrau para ver a pergunta típica da prova.\u003c/p>\n  \u003cdiv class=\"degraus\">\n    \u003cbutton class=\"degrau d1\" data-acao=\"revelar\">\u003cspan class=\"deg-n\">1\u003c/span>\u003cb>Localizar\u003c/b>\u003cspan>A informação aparece escrita no texto.\u003c/span>\u003cem class=\"oculto\">“Segundo o texto, onde aconteceu o fato?”\u003c/em>\u003c/button>\n    \u003cbutton class=\"degrau d2\" data-acao=\"revelar\">\u003cspan class=\"deg-n\">2\u003c/span>\u003cb>Inferir\u003c/b>\u003cspan>A resposta é deduzida por pistas.\u003c/span>\u003cem class=\"oculto\">“O que o trecho sugere sobre o personagem?”\u003c/em>\u003c/button>\n    \u003cbutton class=\"degrau d3\" data-acao=\"revelar\">\u003cspan class=\"deg-n\">3\u003c/span>\u003cb>Interpretar\u003c/b>\u003cspan>Reúna as pistas para entender a ideia.\u003c/span>\u003cem class=\"oculto\">“Qual é a ideia central do texto?”\u003c/em>\u003c/button>\n  \u003c/div>\n\u003c/div>"},{"tipo":"quadro","estilo":"esquema","titulo":"Três perguntas que resolvem boa parte da interpretação","html":"\u003cp>A informação está escrita? Então LOCALIZE. Precisa relacionar pistas? Faça INFERÊNCIA. A questão pede a mensagem global ou a finalidade? INTERPRETE O CONJUNTO. Sempre justifique com um trecho do texto, não com opinião pessoal.\u003c/p>"}]},{"id":"1.1.1-s3","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Compreender e interpretar","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Ler bem é fazer duas coisas ao mesmo tempo. \u003cstrong>Compreender\u003c/strong> é entender o que o texto diz, as informações que estão nele. \u003cstrong>Interpretar\u003c/strong> é perceber o que o texto quer dizer: as ideias sugeridas, a intenção do autor, o efeito que ele quer provocar no leitor.\u003c/p>\u003cp>Nas provas de seleção, quase todas as questões de leitura pedem uma de três operações, cada vez mais difíceis:\u003c/p>"},{"tipo":"img","src":"img:p_niveis","legenda":"Os três níveis de leitura cobrados nas provas."},{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Nível\u003c/th>\u003cth>O que a questão pede\u003c/th>\u003cth>Como costuma ser escrita\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Localizar\u003c/td>\u003ctd>Encontrar uma informação que está escrita no texto, às vezes com outras palavras.\u003c/td>\u003ctd>“Segundo o texto…”, “De acordo com o autor…”, “O texto informa que…”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Inferir\u003c/td>\u003ctd>Deduzir algo que não está escrito, usando as pistas do texto.\u003c/td>\u003ctd>“Pode-se concluir que…”, “O trecho sugere que…”, “Infere-se que…”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Interpretar o todo\u003c/td>\u003ctd>Entender o tema, a finalidade, o humor, a ironia ou a ideia principal.\u003c/td>\u003ctd>“A ideia central é…”, “O objetivo do texto é…”, “O humor da tirinha decorre de…”\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.1.1-s4","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Gêneros textuais: para que serve cada texto","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Gênero textual é uma prática comunicativa reconhecida socialmente, com organização e finalidade para cumprir uma função na sociedade. Uma notícia, uma receita e um poema são gêneros diferentes porque têm \u003cstrong>finalidades diferentes\u003c/strong>. Para reconhecer o gênero, faça três perguntas: \u003cem>Para que esse texto foi escrito? Onde ele circula? Como ele está organizado?\u003c/em>\u003c/p>\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Gênero\u003c/th>\u003cth>Finalidade\u003c/th>\u003cth>Como reconhecer\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Notícia\u003c/td>\u003ctd>Informar um fato recente\u003c/td>\u003ctd>Título (manchete), linguagem objetiva, 3ª pessoa; responde a: o quê, quem, quando, onde, como, por quê\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reportagem\u003c/td>\u003ctd>Aprofundar um assunto\u003c/td>\u003ctd>Mais longa que a notícia; traz entrevistas, dados, opiniões de especialistas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Crônica\u003c/td>\u003ctd>Refletir sobre o cotidiano\u003c/td>\u003ctd>Fato do dia a dia, tom leve, humor ou reflexão; final que faz pensar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Conto\u003c/td>\u003ctd>Narrar uma história ficcional curta\u003c/td>\u003ctd>Poucos personagens, um conflito principal, clímax e desfecho\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fábula\u003c/td>\u003ctd>Ensinar uma lição de moral\u003c/td>\u003ctd>Personagens animais com comportamento humano; moral no final\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Poema\u003c/td>\u003ctd>Expressar sentimentos e ideias\u003c/td>\u003ctd>Versos e estrofes, ritmo, às vezes rima, linguagem figurada; voz do eu lírico\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tirinha / HQ\u003c/td>\u003ctd>Divertir, criticar\u003c/td>\u003ctd>Quadrinhos, balões de fala e de pensamento, humor no último quadro\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Charge\u003c/td>\u003ctd>Criticar um fato atual com humor\u003c/td>\u003ctd>Desenho único, caricatura, relação com notícias recentes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Anúncio / campanha\u003c/td>\u003ctd>Convencer o leitor a agir\u003c/td>\u003ctd>Verbos no imperativo (doe, compre, participe), frases de efeito, imagem\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Artigo de opinião\u003c/td>\u003ctd>Defender um ponto de vista\u003c/td>\u003ctd>Tese, argumentos, conclusão; marcas de opinião\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Texto instrucional\u003c/td>\u003ctd>Ensinar a fazer algo\u003c/td>\u003ctd>Passos numerados, verbos no imperativo (misture, corte)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Verbete\u003c/td>\u003ctd>Definir uma palavra ou conceito\u003c/td>\u003ctd>Linguagem objetiva, comum em dicionários e enciclopédias\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.1.1-s5","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Os elementos da narrativa","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Muitos textos de prova são narrativos (contos, crônicas, fábulas). Em toda narrativa, procure:\u003c/p>\u003cul>\u003cli>\u003cstrong>Narrador:\u003c/strong> quem conta. \u003cem>Narrador-personagem\u003c/em> (1ª pessoa: “Eu acordei cedo…”) ou \u003cem>narrador-observador\u003c/em> (3ª pessoa: “Ela acordou cedo…”).\u003c/li>\u003cli>\u003cstrong>Personagens:\u003c/strong> quem participa. O principal é o protagonista; quem se opõe a ele é o antagonista.\u003c/li>\u003cli>\u003cstrong>Tempo:\u003c/strong> quando acontece (de manhã, no século passado, durante as férias).\u003c/li>\u003cli>\u003cstrong>Espaço:\u003c/strong> onde acontece (na escola, numa cidade do interior).\u003c/li>\u003cli>\u003cstrong>Enredo:\u003c/strong> a sequência dos fatos: situação inicial, conflito, clímax e desfecho.\u003c/li>\u003c/ul>"}]},{"id":"1.1.1-s6","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Pistas que ajudam a inferir","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cul>\u003cli>\u003cstrong>Palavras de retomada:\u003c/strong> pronomes (ele, isso, aquela), sinônimos e expressões (“o rapaz”, “o animal”) sempre retomam algo já dito. Volte no texto para descobrir a quem se referem.\u003c/li>\u003cli>\u003cstrong>Linguagem figurada:\u003c/strong> quando uma bateria “ri” ou um casaco é “um abraço”, o sentido não é literal. Pergunte: o que essa imagem representa?\u003c/li>\u003cli>\u003cstrong>Aspas:\u003c/strong> podem marcar a fala de alguém, uma citação, uma ironia ou uma palavra usada em sentido especial.\u003c/li>\u003cli>\u003cstrong>Pontuação expressiva:\u003c/strong> exclamações indicam emoção; reticências indicam hesitação, suspense ou algo que ficou no ar.\u003c/li>\u003cli>\u003cstrong>O final do texto:\u003c/strong> em crônicas, contos e tirinhas, o último trecho costuma revelar o tema, a moral ou o motivo do humor.\u003c/li>\u003cli>\u003cstrong>Imagem e texto juntos:\u003c/strong> em tirinhas e anúncios, a expressão dos personagens e o desenho também “dizem” coisas.\u003c/li>\u003c/ul>"}]},{"id":"1.1.1-s7","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"O humor e a ironia","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>O humor de uma tirinha quase sempre nasce de uma \u003cstrong>quebra de expectativa\u003c/strong>: o leitor espera uma coisa e acontece outra. Também pode nascer quando o leitor sabe algo que um personagem não sabe. Observe a tirinha abaixo antes de ler a explicação.\u003c/p>"},{"tipo":"img","src":"img:p_tirinha","legenda":"Tirinha criada para esta apostila."},{"tipo":"html","html":"\u003cp>No 1º quadro, o menino pede para jogar e a mãe impõe uma condição. No 2º quadro, ele empurra tudo para baixo da cama (veja as caixas e a onomatopeia “vupt!”). No 3º, a mãe elogia, mas o balão de pensamento revela o segredo. O humor vem do contraste: \u003cstrong>a mãe acredita que o quarto foi arrumado, e o leitor sabe que a bagunça só foi escondida.\u003c/strong>\u003c/p>\u003cp>Já a \u003cstrong>ironia\u003c/strong> é dizer o contrário do que se pensa, com intenção crítica ou bem-humorada. Exemplo: ao ver o irmão chegar todo sujo de lama, a irmã diz: “Que elegância!”.\u003c/p>"}]},{"id":"1.1.1-s8","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Fato ou opinião?","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Um \u003cstrong>fato\u003c/strong> pode ser verificado. Uma \u003cstrong>opinião\u003c/strong> é uma avaliação pessoal. Palavras que costumam marcar opinião: adjetivos de julgamento (\u003cem>lindo, péssimo, melhor\u003c/em>), verbos como \u003cem>acho, acredito, considero\u003c/em>, e advérbios como \u003cem>infelizmente, felizmente\u003c/em>.\u003c/p>\u003cp class=\"frase-exemplo\">Fato: “A escola usou 300 garrafas na horta.”\u003c/p>\u003cp class=\"frase-exemplo\">Opinião: “É o projeto mais bonito que a escola já teve.”\u003c/p>"}]},{"id":"1.1.1-s9","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Passo a passo para resolver qualquer questão de leitura","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003col>\u003cli>Leia o texto inteiro uma vez, sem parar, para entender a ideia geral.\u003c/li>\u003cli>Leia a pergunta e identifique o que ela pede: localizar, inferir ou interpretar.\u003c/li>\u003cli>Volte ao texto e sublinhe o trecho que responde à pergunta.\u003c/li>\u003cli>Leia todas as alternativas e elimine as que têm problemas (veja o quadro “Fique atento”).\u003c/li>\u003cli>Escolha a alternativa que você consegue \u003cstrong>provar\u003c/strong> com um trecho do texto.\u003c/li>\u003c/ol>"},{"tipo":"quadro","estilo":"dica","titulo":"Dica de prova","html":"\u003cp>A resposta certa quase nunca é a mais “bonita” ou a mais completa. É aquela que o texto comprova. Se você não consegue apontar o trecho que justifica a alternativa, desconfie dela.\u003c/p>"}]},{"id":"1.1.1-s10","video":{"url":"","sugestao":"Professora Pamba: Pamba interpretação e compreensão de textos","link":"https://www.youtube.com/results?search_query=Pamba%20interpreta%C3%A7%C3%A3o%20e%20compreens%C3%A3o%20de%20textos"},"tipo":"leitura","titulo":"Fique atento e resumo","check":"Revisei o resumo","itens":[{"tipo":"quadro","estilo":"atencao","titulo":"Fique atento: erros mais comuns","html":"\u003cul>\u003cli>\u003cstrong>Extrapolação:\u003c/strong> a alternativa vai além do texto e afirma algo que ele não diz. Palavras como \u003cem>sempre, nunca, todos, nenhum, só\u003c/em> são um alerta.\u003c/li>\u003cli>\u003cstrong>Redução:\u003c/strong> a alternativa está certa, mas fala de uma parte pequena do texto quando a pergunta pede a ideia principal.\u003c/li>\u003cli>\u003cstrong>Contradição:\u003c/strong> a alternativa diz o contrário do texto, muitas vezes usando palavras do próprio texto para parecer correta.\u003c/li>\u003cli>\u003cstrong>Ler ao pé da letra uma linguagem figurada:\u003c/strong> “nenhuma bateria guarda” não fala de memória de celular.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"resumo","titulo":"Resumo para revisar","html":"\u003cul>\u003cli>Toda pergunta pede localizar, inferir ou interpretar o todo.\u003c/li>\u003cli>O gênero se reconhece pela finalidade, pelo lugar onde circula e pela organização.\u003c/li>\u003cli>Na narrativa: narrador, personagens, tempo, espaço e enredo.\u003c/li>\u003cli>Humor nasce da quebra de expectativa; ironia é dizer o contrário do que se pensa.\u003c/li>\u003cli>A resposta certa é a que você consegue provar com um trecho.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"saiba","titulo":"Para saber mais","html":"\u003cul>\u003cli>\u003ca href=\"https://www.todamateria.com.br\" target=\"_blank\" rel=\"noopener\">Toda Matéria — busque “gêneros textuais” e “interpretação de texto”\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://brasilescola.uol.com.br\" target=\"_blank\" rel=\"noopener\">Brasil Escola — seção de Redação e Gramática\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professor Noslen\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=interpreta%C3%A7%C3%A3o%20de%20texto\" target=\"_blank\" rel=\"noopener\">buscar “interpretação de texto”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professora Pamba\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=Pamba%20interpreta%C3%A7%C3%A3o%20e%20compreens%C3%A3o%20de%20textos\" target=\"_blank\" rel=\"noopener\">buscar “Pamba interpretação e compreensão de textos”\u003c/a>\u003c/li>\u003c/ul>"}]},{"id":"1.1.1-s11","video":{"url":"","sugestao":""},"tipo":"exemplos","titulo":"Exemplos resolvidos","check":"Vi os exemplos","itens":[{"tipo":"exemplo","nivel":"facil","enun":"\u003cdiv class=\"texto-apoio\">\u003cp class=\"texto-titulo\">Aviso na porta de uma padaria\u003c/p>\u003cp>\u003cstrong>PÃO QUENTINHO ÀS 6H E ÀS 17H.\u003c/strong> Quem chega cedo leva o melhor. Encomendas de bolo com dois dias de antecedência.\u003c/p>\u003c/div>\u003cp>Em que horários sai pão quente?\u003c/p>","res":"\u003cp>A pergunta pede para \u003cstrong>localizar\u003c/strong>. A resposta está escrita no aviso: às \u003cstrong>6h e às 17h\u003c/strong>.\u003c/p>"},{"tipo":"exemplo","nivel":"medio","enun":"\u003cdiv class=\"texto-apoio\">\u003cp class=\"texto-titulo\">A raposa e as uvas (fábula de Esopo, recontada)\u003c/p>\u003cp>Uma raposa faminta viu cachos de uvas maduras pendurados numa parreira alta. Pulou uma vez, pulou duas, pulou dez vezes, e não alcançou nenhum. Cansada, afastou-se dizendo:\u003c/p>\u003cp>— Estão verdes. Nem queria mesmo.\u003c/p>\u003c/div>\u003cp>O que a fala final revela sobre a raposa?\u003c/p>","res":"\u003cp>A pergunta pede para \u003cstrong>inferir\u003c/strong>. As uvas estavam “maduras” (o narrador diz isso), então a raposa não fala a verdade.\u003c/p>\u003cp>Ela \u003cstrong>desvaloriza o que não conseguiu alcançar\u003c/strong> para disfarçar a frustração. Essa é a moral da fábula: é comum desprezar aquilo que não se consegue ter.\u003c/p>"},{"tipo":"exemplo","nivel":"dificil","enun":"\u003cp>Volte ao aviso da padaria. Assinale a alternativa correta.\u003c/p>\u003cul>\u003cli>(A) A padaria abre às 6h.\u003c/li>\u003cli>(B) A padaria só vende pão duas vezes por dia.\u003c/li>\u003cli>(C) O aviso informa horários e orienta o cliente sobre como fazer pedidos.\u003c/li>\u003cli>(D) Os bolos dessa padaria são os melhores do bairro.\u003c/li>\u003c/ul>","res":"\u003cp>(A) é \u003cstrong>extrapolação\u003c/strong>: o aviso diz quando o pão sai do forno, não quando a padaria abre.\u003c/p>\u003cp>(B) também é extrapolação: o pão \u003cstrong>quente\u003c/strong> sai duas vezes, mas pode haver pão à venda o dia todo.\u003c/p>\u003cp>(D) é uma \u003cstrong>opinião\u003c/strong> que não aparece no texto.\u003c/p>\u003cp>\u003cstrong>(C) é a correta\u003c/strong>: as duas partes (horários e regra das encomendas) podem ser provadas com o aviso.\u003c/p>"},{"tipo":"quadro","estilo":"caso","titulo":"Estudo de caso: Qual alternativa é uma inferência legítima?","html":"\u003cp>Texto: “Marina fechou o guarda-chuva molhado e deixou os sapatos na entrada.” Evidência: o objeto e os sapatos molhados sugerem chuva ou chão úmido; não provam que ela tomou um ônibus. Inferência bem fundamentada é limitada às pistas.\u003c/p>"}]},{"id":"1.1.1-s12","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Texto 1 e questões","check":"Fiz as questões","intro":"Prova objetiva: leia um texto e responda imediatamente às cinco questões dele. Em cada item, escolha apenas uma alternativa. Justifique mentalmente com pistas concretas; o gabarito comentado aparece ao final do módulo.","itens":[{"tipo":"texto","titulo":"Texto 1 — O carregador (crônica)","html":"\u003cp>Na segunda-feira, o carregador do meu celular resolveu se aposentar. Sem aviso, sem festa de despedida. Encostei o cabo na tomada e nada: a bateria marcava 4% e parecia rir de mim.\u003c/p>\u003cp>Passei a tarde em pânico silencioso. Como eu ia saber o horário do ônibus? E o grupo da turma? E a música no caminho da escola? Minha avó, sentada na varanda, me olhava com a calma de quem já viveu muitas segundas-feiras.\u003c/p>\u003cp>— Por que não pergunta o horário ao motorista? — sugeriu, como quem resolve uma equação simples.\u003c/p>\u003cp>Fui até o ponto, perguntei, e o motorista não só me disse o horário como contou que fazia aquela linha havia vinte anos. Conversamos até a escola. Descobri que ele torcia para o mesmo time que eu e que tinha uma filha da minha idade.\u003c/p>\u003cp>No dia seguinte, comprei um carregador novo. Mas, de vez em quando, deixo o celular na mochila e pergunto as coisas para as pessoas. Tem resposta que nenhuma bateria guarda.\u003c/p>","fonte":"Texto escrito para esta apostila."},{"tipo":"questao","id":"LP-01-q1","nivel":"facil","enun":"\u003cp>Qual acontecimento desencadeia o problema do narrador?\u003c/p>","opts":["O carregador do celular deixou de funcionar.","A avó perdeu o ônibus.","O motorista proibiu celulares.","A escola anunciou uma prova."],"ans":"A","exp":"O narrador explica logo na abertura que o carregador parou; as demais situações não aparecem."},{"tipo":"questao","id":"LP-01-q2","nivel":"medio","enun":"\u003cp>A expressão “a bateria [...] parecia rir de mim” é um exemplo de:\u003c/p>","opts":["hipérbole matemática.","personificação.","linguagem técnica.","comparação literal."],"ans":"B","exp":"A bateria é apresentada com um comportamento humano, “rir”; isso é personificação."},{"tipo":"questao","id":"LP-01-q3","nivel":"medio","enun":"\u003cp>Por que a avó sugere perguntar ao motorista?\u003c/p>","opts":["Porque o motorista é professor.","Porque quer impedir o neto de ouvir música.","Porque enxerga uma solução simples no contato com outra pessoa.","Porque o celular deve ser proibido por lei."],"ans":"C","exp":"A calma da avó e a expressão “equação simples” sustentam que ela percebe alternativa simples."},{"tipo":"questao","id":"LP-01-q4","nivel":"dificil","enun":"\u003cp>A mudança de atitude do narrador no final pode ser descrita como:\u003c/p>","opts":["abandono de toda tecnologia.","arrependimento por conhecer o motorista.","decisão de nunca mais pegar ônibus.","valorização das conversas presenciais, mesmo mantendo o celular."],"ans":"D","exp":"Ele compra carregador novo, mas passa a perguntar mais às pessoas: não rejeita o aparelho."},{"tipo":"questao","id":"LP-01-q5","nivel":"dificil","enun":"\u003cp>Qual é a ideia central da crônica?\u003c/p>","opts":["A comunicação humana oferece experiências que vão além das respostas da tecnologia.","A escola deve substituir ônibus por aplicativos.","Carregadores baratos apresentam defeitos.","Avós conhecem sempre o trajeto dos ônibus."],"ans":"A","exp":"A frase “nenhuma bateria guarda” retoma a descoberta provocada pela conversa com o motorista."}]},{"id":"1.1.1-s13","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Texto 2 e questões","check":"Fiz as questões","intro":"Prova objetiva: leia um texto e responda imediatamente às cinco questões dele. Em cada item, escolha apenas uma alternativa. Justifique mentalmente com pistas concretas; o gabarito comentado aparece ao final do módulo.","itens":[{"tipo":"texto","titulo":"Texto 2 — Estudantes criam horta vertical com garrafas recicladas (notícia)","html":"\u003cp>Alunos do 8º ano de uma escola municipal de Santa Luzia inauguraram, nesta sexta-feira, uma horta vertical feita com 300 garrafas PET recolhidas pela comunidade. O projeto começou em março, durante as aulas de Ciências, e levou cerca de seis meses para ficar pronto.\u003c/p>\u003cp>Segundo a professora responsável, a horta já produz alface, cebolinha e coentro, que passaram a ser usados na merenda escolar. Para a diretora, “é o projeto mais bonito que a escola já teve”.\u003c/p>\u003cp>A escola pretende ampliar a horta no próximo ano e oferecer oficinas para os moradores do bairro.\u003c/p>","fonte":"Notícia fictícia escrita para esta apostila."},{"tipo":"infografico","html":"\n\u003cdiv class=\"ig\">\n  \u003cp class=\"ig-titulo\">Lendo uma notícia em 5 perguntas\u003c/p>\n  \u003cp class=\"ig-sub\">Toque em cada pergunta para ver a resposta no Texto 2.\u003c/p>\n  \u003cdiv class=\"cinco\">\n    \u003cbutton class=\"q5 c-menta\" data-acao=\"revelar\">\u003cb>O quê?\u003c/b>\u003cspan class=\"oculto\">Horta vertical\u003c/span>\u003c/button>\n    \u003cbutton class=\"q5 c-coral\" data-acao=\"revelar\">\u003cb>Quem?\u003c/b>\u003cspan class=\"oculto\">Alunos do 8º ano\u003c/span>\u003c/button>\n    \u003cbutton class=\"q5 c-lavanda\" data-acao=\"revelar\">\u003cb>Onde?\u003c/b>\u003cspan class=\"oculto\">Escola municipal de Santa Luzia\u003c/span>\u003c/button>\n    \u003cbutton class=\"q5 c-amarelo\" data-acao=\"revelar\">\u003cb>Quando?\u003c/b>\u003cspan class=\"oculto\">Nesta sexta-feira\u003c/span>\u003c/button>\n    \u003cbutton class=\"q5 c-menta\" data-acao=\"revelar\">\u003cb>Como?\u003c/b>\u003cspan class=\"oculto\">Com 300 garrafas PET\u003c/span>\u003c/button>\n  \u003c/div>\n  \u003cp class=\"ig-sub\">Atenção: a notícia é fictícia. O esquema organiza as informações do texto.\u003c/p>\n\u003c/div>"},{"tipo":"questao","id":"LP-01-q6","nivel":"facil","enun":"\u003cp>Qual foi a finalidade inicial das garrafas PET recolhidas pela comunidade?\u003c/p>","opts":["Construir uma quadra.","Criar uma horta vertical.","Vender em um supermercado.","Montar aparelhos eletrônicos."],"ans":"B","exp":"A primeira frase da notícia indica a horta vertical feita com 300 garrafas."},{"tipo":"questao","id":"LP-01-q7","nivel":"medio","enun":"\u003cp>O projeto começou durante aulas de qual disciplina?\u003c/p>","opts":["Arte.","Geografia.","Ciências.","Educação Física."],"ans":"C","exp":"O texto informa explicitamente “durante as aulas de Ciências”."},{"tipo":"questao","id":"LP-01-q8","nivel":"medio","enun":"\u003cp>Que trecho contém uma avaliação subjetiva?\u003c/p>","opts":["“o projeto começou em março”.","“300 garrafas PET”.","“a horta já produz alface”.","“o projeto mais bonito que a escola já teve”."],"ans":"D","exp":"“Mais bonito” depende do julgamento da diretora; as outras informações são verificáveis."},{"tipo":"questao","id":"LP-01-q9","nivel":"dificil","enun":"\u003cp>Quando a notícia diz que a escola “pretende ampliar” a horta, apresenta:\u003c/p>","opts":["um planejamento futuro, ainda não realizado.","um evento concluído antes de março.","um fato já comprovado pelo cultivo atual.","uma opinião sobre a beleza da escola."],"ans":"A","exp":"Pretender expressa intenção; não permite dizer que a ampliação já ocorreu."},{"tipo":"questao","id":"LP-01-q10","nivel":"dificil","enun":"\u003cp>Uma fotografia real de outra horta escolar, ao lado dessa notícia fictícia, deveria aparecer com a legenda:\u003c/p>","opts":["“Registro da inauguração citada”, mesmo sem ser a mesma horta.","“Imagem ilustrativa; não registra o fato narrado”.","“Prova de que todas as escolas têm hortas iguais”.","“Notícia comprovada pela fotografia”."],"ans":"B","exp":"Fotografia ilustrativa ajuda a imaginar o projeto, mas não confirma um fato narrado em texto fictício."}]},{"id":"1.1.1-s14","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Texto 3 e questões","check":"Fiz as questões","intro":"Prova objetiva: leia um texto e responda imediatamente às cinco questões dele. Em cada item, escolha apenas uma alternativa. Justifique mentalmente com pistas concretas; o gabarito comentado aparece ao final do módulo.","itens":[{"tipo":"texto","titulo":"Texto 3 — Campanha","html":"\u003cp>\u003cstrong>CAMPANHA DO AGASALHO\u003c/strong>\u003c/p>\u003cp>Aquele casaco esquecido no fundo do armário pode ser o abraço que alguém espera neste inverno.\u003c/p>\u003cp>Doe roupas em bom estado na secretaria da escola até 30 de junho.\u003c/p>\u003cp>Quem doa aquece duas vezes: o corpo de quem recebe e o coração de quem dá.\u003c/p>","fonte":"Texto escrito para esta apostila."},{"tipo":"infografico","html":"\n\u003cdiv class=\"ig ig-cartaz\">\n  \u003csvg viewBox=\"0 0 200 200\" class=\"casaco\" role=\"img\" aria-label=\"Ilustração de um casaco azul\">\n    \u003cpath d=\"M70 30 L100 45 L130 30 L170 55 L160 95 L145 90 L145 180 L55 180 L55 90 L40 95 L30 55 Z\" fill=\"#2E5E8C\"/>\n    \u003cpath d=\"M70 30 L100 45 L130 30 L118 70 L100 60 L82 70 Z\" fill=\"#1F4466\"/>\n    \u003cline x1=\"100\" y1=\"60\" x2=\"100\" y2=\"180\" stroke=\"#EAF2FA\" stroke-width=\"3\"/>\n    \u003ccircle cx=\"108\" cy=\"90\" r=\"4\" fill=\"#F2C14E\"/>\u003ccircle cx=\"108\" cy=\"120\" r=\"4\" fill=\"#F2C14E\"/>\u003ccircle cx=\"108\" cy=\"150\" r=\"4\" fill=\"#F2C14E\"/>\n  \u003c/svg>\n  \u003cdiv class=\"cartaz-texto\">\n    \u003cp class=\"cartaz-titulo\">Campanha do Agasalho\u003c/p>\n    \u003cp>Um casaco esquecido pode ser o abraço que alguém espera.\u003c/p>\n    \u003cp class=\"cartaz-acao\">Doe · acolha · aqueça\u003c/p>\n  \u003c/div>\n\u003c/div>"},{"tipo":"questao","id":"LP-01-q11","nivel":"facil","enun":"\u003cp>Qual é a ação solicitada ao leitor?\u003c/p>","opts":["Comprar roupas novas.","Assinar uma revista.","Doar agasalhos em bom estado.","Escrever uma notícia."],"ans":"C","exp":"A campanha pede explicitamente a doação de roupas em bom estado."},{"tipo":"questao","id":"LP-01-q12","nivel":"facil","enun":"\u003cp>Em que local as doações devem ser entregues?\u003c/p>","opts":["Na casa do diretor.","No ponto de ônibus.","Em qualquer loja.","Na secretaria da escola."],"ans":"D","exp":"O cartaz determina a secretaria da escola como ponto de coleta."},{"tipo":"questao","id":"LP-01-q13","nivel":"medio","enun":"\u003cp>A expressão “pode ser o abraço que alguém espera” apresenta:\u003c/p>","opts":["linguagem figurada para transmitir acolhimento.","descrição literal de uma pessoa que abraça o casaco.","linguagem científica sobre tecidos.","uma ironia para criticar a escola."],"ans":"A","exp":"O casaco aquece e simboliza cuidado; abraço é metáfora afetiva."},{"tipo":"questao","id":"LP-01-q14","nivel":"medio","enun":"\u003cp>Qual recurso linguístico torna a campanha persuasiva?\u003c/p>","opts":["Um cálculo financeiro obrigatório.","Um pedido no imperativo: “Doe”.","Uma narração em primeira pessoa.","Uma apresentação de personagens históricos."],"ans":"B","exp":"O verbo “Doe” convoca o leitor a agir, traço frequente de campanhas."},{"tipo":"questao","id":"LP-01-q15","nivel":"dificil","enun":"\u003cp>O sentido de “Quem doa aquece duas vezes” depende da combinação entre:\u003c/p>","opts":["duas peças de roupas.","duas datas de arrecadação.","calor físico e sentimento de solidariedade.","dois lugares para doar."],"ans":"C","exp":"A segunda parte relaciona o corpo de quem recebe e o “coração” de quem doa."}]},{"id":"1.1.1-s15","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Texto 4 e questões","check":"Fiz as questões","intro":"Prova objetiva: leia um texto e responda imediatamente às cinco questões dele. Em cada item, escolha apenas uma alternativa. Justifique mentalmente com pistas concretas; o gabarito comentado aparece ao final do módulo.","itens":[{"tipo":"texto","titulo":"Texto 4 — Canção do exílio (1ª estrofe), Gonçalves Dias, 1843","html":"\u003cp>Minha terra tem palmeiras,\u003c/p>\u003cp>Onde canta o Sabiá;\u003c/p>\u003cp>As aves, que aqui gorjeiam,\u003c/p>\u003cp>Não gorjeiam como lá.\u003c/p>","fonte":"Obra em domínio público."},{"tipo":"questao","id":"LP-01-q16","nivel":"facil","enun":"\u003cp>Qual paisagem é citada pelo eu lírico como característica de sua terra?\u003c/p>","opts":["Montanhas e neve.","Casas e avenidas.","Praias e rios.","Palmeiras e sabiá."],"ans":"D","exp":"O primeiro e o segundo versos mencionam palmeiras e sabiá."},{"tipo":"questao","id":"LP-01-q17","nivel":"medio","enun":"\u003cp>Os advérbios “aqui” e “lá” estabelecem principalmente uma relação de:\u003c/p>","opts":["distanciamento entre o lugar atual e a terra natal.","oposição entre noite e dia.","comparação entre escola e casa.","alternância entre passado e futuro."],"ans":"A","exp":"O contraste de lugares expressa distância e pertencimento à terra de origem."},{"tipo":"questao","id":"LP-01-q18","nivel":"medio","enun":"\u003cp>Quanto à forma, o texto é reconhecido como poema porque apresenta:\u003c/p>","opts":["parágrafos expositivos e dados estatísticos.","versos organizados em estrofe.","perguntas de entrevista.","instruções numeradas."],"ans":"B","exp":"Os quatro versos compõem uma estrofe com organização poética."},{"tipo":"questao","id":"LP-01-q19","nivel":"dificil","enun":"\u003cp>Qual sentimento pode ser inferido da comparação feita pelo eu lírico?\u003c/p>","opts":["Alegria por abandonar a própria terra.","Indiferença em relação às aves.","Saudade e idealização de sua terra.","Medo de conversar com estrangeiros."],"ans":"C","exp":"A comparação favorece a terra natal, sugerindo saudade."},{"tipo":"questao","id":"LP-01-q20","nivel":"dificil","enun":"\u003cp>O contraste “não gorjeiam como lá” produz o efeito de:\u003c/p>","opts":["provar cientificamente que todas as aves cantam igual.","mostrar que o lugar onde está é sua terra natal.","criticar a reprodução dos sabiás em laboratório.","valorizar o canto da terra lembrada em comparação com o lugar atual."],"ans":"D","exp":"A comparação reforça a singularidade afetiva da terra de origem."}]}]}]},{"num":"1.2","titulo":"Morfologia e Semântica","intro":"Aqui estudamos as palavras: a que classe pertencem (substantivo, verbo, advérbio…) e que sentidos podem ter (sinônimos, homônimos, figuras de linguagem). É a base para entender a sintaxe do próximo submódulo.","temas":[{"id":"1.2.1","cod":"LP-02","titulo":"Classes gramaticais","bncc":"EF06LP04, EF07LP08","tempo":"1h30","dia":"Dia 1 (21/10)","objetivo":"Reconhecer as dez classes de palavras pela função que exercem na frase e perceber que a mesma palavra pode mudar de classe conforme o contexto.","secoes":[{"id":"1.2.1-s1","video":{"url":"","sugestao":""},"tipo":"aquecimento","titulo":"Aquecimento","check":"Fiz o aquecimento","itens":[{"tipo":"flips","cartas":[{"frente":"Em “O cachorro latiu”, qual palavra indica a ação?","verso":"latiu (é um verbo)."},{"frente":"O que muda na palavra “menino” quando ela vira “meninas”?","verso":"o gênero (masculino → feminino) e o número (singular → plural)."},{"frente":"Qual palavra dá uma característica em “casa amarela”?","verso":"amarela (é um adjetivo)."}]}]},{"id":"1.2.1-s2","video":{"url":"","sugestao":"Professor Noslen: classes gramaticais","link":"https://www.youtube.com/results?search_query=classes%20gramaticais"},"tipo":"leitura","titulo":"Aprenda com o esquema","check":"Vi o esquema","itens":[{"tipo":"infografico","html":"\n\u003cdiv class=\"ig\">\n  \u003cp class=\"ig-titulo\">Uma palavra, funções diferentes\u003c/p>\n  \u003cp class=\"ig-sub\">Vire os cartões: a mesma palavra muda de classe conforme o que ela modifica.\u003c/p>\n  \u003cdiv class=\"cartas\">\n    \u003cbutton class=\"carta c-coral\" data-acao=\"virar\">\u003cspan class=\"frente\">\u003cb>A atleta RÁPIDA chegou.\u003c/b>\u003csmall>Qual a classe de “rápida”?\u003c/small>\u003c/span>\u003cspan class=\"verso\">\u003cb>Adjetivo\u003c/b>“Rápida” caracteriza o substantivo \u003ci>atleta\u003c/i> e concorda com ele.\u003c/span>\u003c/button>\n    \u003cbutton class=\"carta c-menta\" data-acao=\"virar\">\u003cspan class=\"frente\">\u003cb>A atleta correu RÁPIDO.\u003c/b>\u003csmall>Qual a classe de “rápido”?\u003c/small>\u003c/span>\u003cspan class=\"verso\">\u003cb>Advérbio\u003c/b>“Rápido” indica como ocorreu a ação de \u003ci>correr\u003c/i>. Não varia.\u003c/span>\u003c/button>\n  \u003c/div>\n  \u003cp class=\"ig-regra\">O teste decisivo: descubra qual palavra está sendo modificada. Substantivo → adjetivo. Verbo, adjetivo ou advérbio → advérbio.\u003c/p>\n\u003c/div>"},{"tipo":"quadro","estilo":"esquema","titulo":"Teste funcional: não decore apenas a aparência das palavras","html":"\u003cp>Em “meninas rápidas”, rápidas caracteriza meninas: ADJETIVO. Em “meninas caminham rápido”, rápido modifica caminham: ADVÉRBIO. Em “elas ficaram muito felizes”, muito intensifica felizes: ADVÉRBIO DE INTENSIDADE. A função na frase decide a classe.\u003c/p>"}]},{"id":"1.2.1-s3","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"O que são classes gramaticais","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>As palavras da língua portuguesa são agrupadas em \u003cstrong>dez classes\u003c/strong>, de acordo com a função que exercem. Algumas mudam de forma (gênero, número, tempo verbal): são as \u003cstrong>variáveis\u003c/strong>. Outras nunca mudam: são as \u003cstrong>invariáveis\u003c/strong>.\u003c/p>"},{"tipo":"img","src":"img:p_classes","legenda":"As dez classes de palavras."},{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Classe\u003c/th>\u003cth>Função\u003c/th>\u003cth>Exemplos\u003c/th>\u003cth>Dica para reconhecer\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Substantivo\u003c/td>\u003ctd>Nomeia seres, objetos, lugares, sentimentos\u003c/td>\u003ctd>casa, Ana, Brasil, saudade\u003c/td>\u003ctd>Aceita artigo antes: \u003cem>a\u003c/em> casa, \u003cem>a\u003c/em> saudade\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Artigo\u003c/td>\u003ctd>Acompanha o substantivo, definindo ou não\u003c/td>\u003ctd>o, a, os, as, um, uma\u003c/td>\u003ctd>Vem antes do substantivo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Adjetivo\u003c/td>\u003ctd>Dá qualidade, estado ou característica\u003c/td>\u003ctd>bonito, cansada, brasileiro\u003c/td>\u003ctd>Responde “como é?”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Numeral\u003c/td>\u003ctd>Indica quantidade, ordem, fração, multiplicação\u003c/td>\u003ctd>dois, segundo, metade, dobro\u003c/td>\u003ctd>Pense em números\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pronome\u003c/td>\u003ctd>Substitui ou acompanha o substantivo\u003c/td>\u003ctd>eu, ele, meu, este, alguém\u003c/td>\u003ctd>Indica pessoa do discurso, posse, posição\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Verbo\u003c/td>\u003ctd>Indica ação, estado ou fenômeno da natureza\u003c/td>\u003ctd>correr, ser, chover\u003c/td>\u003ctd>Muda com o tempo: corro, corri, correrei\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Advérbio\u003c/td>\u003ctd>Modifica verbo, adjetivo ou outro advérbio\u003c/td>\u003ctd>ontem, aqui, muito, bem, não\u003c/td>\u003ctd>Indica circunstância: tempo, lugar, modo…\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Preposição\u003c/td>\u003ctd>Liga duas palavras\u003c/td>\u003ctd>a, de, em, para, com, por, sem\u003c/td>\u003ctd>Palavrinha de ligação entre termos\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Conjunção\u003c/td>\u003ctd>Liga orações ou termos semelhantes\u003c/td>\u003ctd>e, mas, porque, quando, embora\u003c/td>\u003ctd>Liga ideias: adição, oposição, causa…\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Interjeição\u003c/td>\u003ctd>Expressa emoção ou apelo\u003c/td>\u003ctd>Oba! Ufa! Ai! Psiu!\u003c/td>\u003ctd>Vem com exclamação\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.2.1-s4","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Substantivo","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Nomeia tudo o que existe ou imaginamos. Classificações mais cobradas:\u003c/p>\u003cul>\u003cli>\u003cstrong>Comum\u003c/strong> (cidade, menina) × \u003cstrong>próprio\u003c/strong> (Curitiba, Júlia), escrito com inicial maiúscula.\u003c/li>\u003cli>\u003cstrong>Concreto\u003c/strong> (existe por si: mesa, fada, vento) × \u003cstrong>abstrato\u003c/strong> (depende de alguém: amor, beleza, corrida, saudade).\u003c/li>\u003cli>\u003cstrong>Simples\u003c/strong> (flor) × \u003cstrong>composto\u003c/strong> (couve-flor, girassol); \u003cstrong>primitivo\u003c/strong> (pedra) × \u003cstrong>derivado\u003c/strong> (pedreiro).\u003c/li>\u003cli>\u003cstrong>Coletivo\u003c/strong>: nomeia um conjunto (cardume = peixes; alcateia = lobos; enxame = abelhas; constelação = estrelas; arquipélago = ilhas).\u003c/li>\u003c/ul>"}]},{"id":"1.2.1-s5","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Artigo, adjetivo e numeral","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>\u003cstrong>Artigo definido\u003c/strong> (o, a, os, as) indica algo específico; \u003cstrong>indefinido\u003c/strong> (um, uma, uns, umas) indica algo qualquer. O artigo pode \u003cstrong>transformar qualquer palavra em substantivo\u003c/strong>: “\u003cem>O\u003c/em> andar dela é elegante”, “Recebi \u003cem>um\u003c/em> sim”.\u003c/p>\u003cp>\u003cstrong>Adjetivo\u003c/strong> caracteriza o substantivo e concorda com ele em gênero e número: \u003cem>menino alto, meninas altas\u003c/em>. A \u003cstrong>locução adjetiva\u003c/strong> é uma expressão com preposição que vale como adjetivo:\u003c/p>\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Locução\u003c/th>\u003cth>Adjetivo\u003c/th>\u003cth>Locução\u003c/th>\u003cth>Adjetivo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>de pai\u003c/td>\u003ctd>paterno\u003c/td>\u003ctd>de chuva\u003c/td>\u003ctd>pluvial\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de mãe\u003c/td>\u003ctd>materno\u003c/td>\u003ctd>de cidade\u003c/td>\u003ctd>urbano\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de ouro\u003c/td>\u003ctd>áureo / dourado\u003c/td>\u003ctd>de prata\u003c/td>\u003ctd>argênteo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>de aluno\u003c/td>\u003ctd>discente\u003c/td>\u003ctd>de professor\u003c/td>\u003ctd>docente\u003c/td>\u003c/tr>\u003ctr>\u003ctd>do sol\u003c/td>\u003ctd>solar\u003c/td>\u003ctd>da lua\u003c/td>\u003ctd>lunar\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cstrong>Numeral\u003c/strong>: cardinal (três), ordinal (terceiro), multiplicativo (triplo) e fracionário (um terço).\u003c/p>"}]},{"id":"1.2.1-s6","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Pronome","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Tipo\u003c/th>\u003cth>Exemplos\u003c/th>\u003cth>Uso\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pessoal reto\u003c/td>\u003ctd>eu, tu, ele, ela, nós, vós, eles, elas\u003c/td>\u003ctd>Normalmente é sujeito\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pessoal oblíquo\u003c/td>\u003ctd>me, te, se, o, a, lhe, nos, vos, os, as, lhes, mim, ti, comigo\u003c/td>\u003ctd>Normalmente é complemento\u003c/td>\u003c/tr>\u003ctr>\u003ctd>De tratamento\u003c/td>\u003ctd>você, senhor, Vossa Excelência\u003c/td>\u003ctd>Formas de tratar as pessoas\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Possessivo\u003c/td>\u003ctd>meu, teu, seu, nosso, vosso\u003c/td>\u003ctd>Indica posse\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Demonstrativo\u003c/td>\u003ctd>este, esse, aquele, isto, isso, aquilo\u003c/td>\u003ctd>Indica posição no espaço, no tempo ou no texto\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Indefinido\u003c/td>\u003ctd>alguém, ninguém, algum, nenhum, todo, nada, cada\u003c/td>\u003ctd>Refere-se de modo vago\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Interrogativo\u003c/td>\u003ctd>que, quem, qual, quanto (em perguntas)\u003c/td>\u003ctd>Usado para perguntar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Relativo\u003c/td>\u003ctd>que, o qual, quem, cujo, onde\u003c/td>\u003ctd>Retoma um termo anterior e inicia nova oração\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.2.1-s7","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"Verbo","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>Indica \u003cstrong>ação\u003c/strong> (correr), \u003cstrong>estado\u003c/strong> (estar, ficar) ou \u003cstrong>fenômeno da natureza\u003c/strong> (chover, ventar). É a classe que mais varia: muda em \u003cstrong>pessoa\u003c/strong> (eu canto, ele canta), \u003cstrong>número\u003c/strong> (canta, cantam), \u003cstrong>tempo\u003c/strong> (cantei, canto, cantarei) e \u003cstrong>modo\u003c/strong> (indicativo: canto; subjuntivo: que eu cante; imperativo: cante!). Formas nominais: infinitivo (cantar), gerúndio (cantando), particípio (cantado).\u003c/p>"}]},{"id":"1.2.1-s8","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"As invariáveis","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cul>\u003cli>\u003cstrong>Advérbio\u003c/strong> indica circunstância: tempo (ontem, já), lugar (aqui, longe), modo (bem, devagar e quase todos terminados em \u003cem>-mente\u003c/em>), intensidade (muito, pouco, bastante), negação (não), afirmação (sim, certamente), dúvida (talvez).\u003c/li>\u003cli>\u003cstrong>Preposição\u003c/strong> liga termos: a, ante, após, até, com, contra, de, desde, em, entre, para, perante, por, sem, sob, sobre, trás. Pode se juntar ao artigo: de + o = \u003cstrong>do\u003c/strong>; em + a = \u003cstrong>na\u003c/strong>; a + a = \u003cstrong>à\u003c/strong>; por + o = \u003cstrong>pelo\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Conjunção\u003c/strong> liga orações: \u003cem>e, nem\u003c/em> (adição); \u003cem>mas, porém, contudo\u003c/em> (oposição); \u003cem>ou\u003c/em> (alternância); \u003cem>logo, portanto\u003c/em> (conclusão); \u003cem>porque, pois\u003c/em> (explicação/causa); \u003cem>quando\u003c/em> (tempo); \u003cem>embora\u003c/em> (concessão); \u003cem>se\u003c/em> (condição).\u003c/li>\u003cli>\u003cstrong>Interjeição\u003c/strong> expressa emoção: Oba! (alegria), Ai! (dor), Ufa! (alívio), Psiu! (silêncio), Nossa! (espanto).\u003c/li>\u003c/ul>"}]},{"id":"1.2.1-s9","video":{"url":"","sugestao":""},"tipo":"leitura","titulo":"A mesma palavra, classes diferentes","check":"Li esta parte","itens":[{"tipo":"html","html":"\u003cp>A classe depende da \u003cstrong>função na frase\u003c/strong>, não da palavra isolada. Compare:\u003c/p>\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Frase\u003c/th>\u003cth>Palavra\u003c/th>\u003cth>Classe\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>O \u003cstrong>jantar\u003c/strong> estava ótimo.\u003c/td>\u003ctd>jantar\u003c/td>\u003ctd>substantivo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Vamos \u003cstrong>jantar\u003c/strong> fora.\u003c/td>\u003ctd>jantar\u003c/td>\u003ctd>verbo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>O prédio é \u003cstrong>alto\u003c/strong>.\u003c/td>\u003ctd>alto\u003c/td>\u003ctd>adjetivo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ela fala \u003cstrong>alto\u003c/strong>.\u003c/td>\u003ctd>alto\u003c/td>\u003ctd>advérbio (modo)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Comprei \u003cstrong>meia\u003c/strong> dúzia.\u003c/td>\u003ctd>meia\u003c/td>\u003ctd>numeral\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ela está \u003cstrong>meio\u003c/strong> cansada.\u003c/td>\u003ctd>meio\u003c/td>\u003ctd>advérbio (invariável)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>O livro \u003cstrong>que\u003c/strong> li é bom.\u003c/td>\u003ctd>que\u003c/td>\u003ctd>pronome relativo (= o qual)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Espero \u003cstrong>que\u003c/strong> você venha.\u003c/td>\u003ctd>que\u003c/td>\u003ctd>conjunção\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},{"id":"1.2.1-s10","video":{"url":"","sugestao":"Professora Pamba: Pamba classes de palavras","link":"https://www.youtube.com/results?search_query=Pamba%20classes%20de%20palavras"},"tipo":"leitura","titulo":"Fique atento e resumo","check":"Revisei o resumo","itens":[{"tipo":"quadro","estilo":"atencao","titulo":"Fique atento: erros mais comuns","html":"\u003cul>\u003cli>\u003cstrong>Adjetivo × advérbio:\u003c/strong> o advérbio não varia. Diga “elas estão \u003cstrong>meio\u003c/strong> cansadas” (e não “meias cansadas”).\u003c/li>\u003cli>\u003cstrong>“Um” pode ser artigo ou numeral:\u003c/strong> “Comprei \u003cem>um\u003c/em> livro” (artigo, qualquer livro) × “Comprei \u003cem>um\u003c/em> livro, não dois” (numeral, quantidade).\u003c/li>\u003cli>\u003cstrong>“Que” tem várias classes:\u003c/strong> se puder trocar por “o qual/a qual”, é pronome relativo.\u003c/li>\u003cli>\u003cstrong>Palavra substantivada:\u003c/strong> qualquer palavra com artigo antes vira substantivo (“o porquê”, “um não”).\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"resumo","titulo":"Resumo para revisar","html":"\u003cul>\u003cli>São 10 classes: 6 variáveis (substantivo, artigo, adjetivo, numeral, pronome, verbo) e 4 invariáveis (advérbio, preposição, conjunção, interjeição).\u003c/li>\u003cli>Advérbio modifica verbo, adjetivo ou advérbio e não varia.\u003c/li>\u003cli>Preposição liga palavras; conjunção liga orações e ideias.\u003c/li>\u003cli>A classe depende da função da palavra na frase.\u003c/li>\u003c/ul>"},{"tipo":"quadro","estilo":"saiba","titulo":"Para saber mais","html":"\u003cul>\u003cli>\u003ca href=\"https://www.todamateria.com.br\" target=\"_blank\" rel=\"noopener\">Toda Matéria — busque “classes gramaticais”\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://brasilescola.uol.com.br\" target=\"_blank\" rel=\"noopener\">Brasil Escola — busque “classes de palavras”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professor Noslen\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=classes%20gramaticais\" target=\"_blank\" rel=\"noopener\">buscar “classes gramaticais”\u003c/a>\u003c/li>\u003cli>Vídeos: canal \u003cstrong>Professora Pamba\u003c/strong> — \u003ca href=\"https://www.youtube.com/results?search_query=Pamba%20classes%20de%20palavras\" target=\"_blank\" rel=\"noopener\">buscar “Pamba classes de palavras”\u003c/a>\u003c/li>\u003c/ul>"}]},{"id":"1.2.1-s11","video":{"url":"","sugestao":""},"tipo":"exemplos","titulo":"Exemplos resolvidos","check":"Vi os exemplos","itens":[{"tipo":"exemplo","nivel":"facil","enun":"\u003cp>Classifique as palavras da frase: “A menina comprou dois livros novos.”\u003c/p>","res":"\u003cdiv class=\"tabela-wrap\">\u003ctable class=\"tabela\">\u003cthead>\u003ctr>\u003cth>Palavra\u003c/th>\u003cth>Classe\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A\u003c/td>\u003ctd>artigo definido\u003c/td>\u003c/tr>\u003ctr>\u003ctd>menina\u003c/td>\u003ctd>substantivo comum\u003c/td>\u003c/tr>\u003ctr>\u003ctd>comprou\u003c/td>\u003ctd>verbo (ação, passado)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>dois\u003c/td>\u003ctd>numeral cardinal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>livros\u003c/td>\u003ctd>substantivo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>novos\u003c/td>\u003ctd>adjetivo\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"tipo":"exemplo","nivel":"medio","enun":"\u003cp>Qual a classe de “bem” nas frases: (I) “Ela canta \u003cstrong>bem\u003c/strong>.” (II) “Ele é um \u003cstrong>bem\u003c/strong> para a família.”\u003c/p>","res":"\u003cp>(I) “bem” modifica o verbo \u003cem>canta\u003c/em>, indicando modo: \u003cstrong>advérbio\u003c/strong>.\u003c/p>\u003cp>(II) “bem” vem depois do artigo \u003cem>um\u003c/em> e nomeia algo: \u003cstrong>substantivo\u003c/strong>.\u003c/p>"},{"tipo":"exemplo","nivel":"dificil","enun":"\u003cp>Na frase “Ontem, aquela turma estudou muito, mas ninguém se sentiu cansado”, identifique um advérbio de tempo, um de intensidade, um pronome demonstrativo, um pronome indefinido e uma conjunção.\u003c/p>","res":"\u003cp>Advérbio de tempo: \u003cstrong>ontem\u003c/strong>. Advérbio de intensidade: \u003cstrong>muito\u003c/strong> (modifica \u003cem>estudou\u003c/em>).\u003c/p>\u003cp>Pronome demonstrativo: \u003cstrong>aquela\u003c/strong>. Pronome indefinido: \u003cstrong>ninguém\u003c/strong>.\u003c/p>\u003cp>Conjunção: \u003cstrong>mas\u003c/strong> (indica oposição entre estudar muito e não se cansar).\u003c/p>"},{"tipo":"quadro","estilo":"caso","titulo":"Estudo de caso: Analisando “ela estudou intensamente”.","html":"\u003cp>“Intensamente” modifica o verbo “estudou” e informa como ocorreu a ação: ADVÉRBIO de modo. Teste: “Ela estudou intenso” não funciona; “O estudo intenso” traz adjetivo associado ao substantivo “estudo”.\u003c/p>"}]},{"id":"1.2.1-s12","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Exercícios de fixação","check":"Fiz as questões","intro":"Resolva sem consultar a explicação. Nas questões de múltipla escolha, assinale apenas uma opção; nas atividades discursivas, registre uma justificativa curta. Confira o gabarito ao final.","itens":[{"tipo":"questao","id":"LP-02-q1","nivel":"facil","enun":"\u003cp>Na frase “O gato preto dormiu no sofá”, a palavra “preto” é:\u003c/p>","opts":["substantivo.","adjetivo.","advérbio.","verbo."],"ans":"B","exp":"Dá uma característica ao substantivo \u003cem>gato\u003c/em>. Responde “como é o gato?”."},{"tipo":"questao","id":"LP-02-q2","nivel":"facil","enun":"\u003cp>Assinale a alternativa em que todas as palavras são substantivos:\u003c/p>","opts":["correr, casa, bonito","ontem, livro, feliz","muito, escola, pular","mesa, alegria, Pedro"],"ans":"D","exp":"Mesa (concreto), alegria (abstrato) e Pedro (próprio) são substantivos. Nas outras há verbos (correr, pular), adjetivos (bonito, feliz) e advérbios (ontem, muito)."},{"tipo":"questao","id":"LP-02-q3","nivel":"medio","enun":"\u003cp>Em “Ela canta muito bem”, as palavras “muito” e “bem” são:\u003c/p>","opts":["adjetivos.","pronomes indefinidos.","advérbios de intensidade e de modo.","substantivos."],"ans":"C","exp":"“Bem” modifica o verbo \u003cem>canta\u003c/em> (modo) e “muito” modifica o advérbio \u003cem>bem\u003c/em> (intensidade). Advérbio pode modificar outro advérbio."},{"tipo":"questao","id":"LP-02-q4","nivel":"facil","discursiva":true,"linhas":4,"enun":"\u003cp>Classifique as palavras destacadas: “\u003cstrong>Ontem\u003c/strong>, \u003cstrong>o\u003c/strong> \u003cstrong>meu\u003c/strong> irmão \u003cstrong>viajou\u003c/strong> \u003cstrong>para\u003c/strong> Natal \u003cstrong>com\u003c/strong> \u003cstrong>dois\u003c/strong> amigos.”\u003c/p>","resposta":"Ontem: advérbio de tempo; o: artigo definido; meu: pronome possessivo; viajou: verbo; para: preposição; com: preposição; dois: numeral cardinal.","exp":"Ponto inteiro com 6 ou 7 acertos; meio ponto com 4 ou 5."},{"tipo":"questao","id":"LP-02-q5","nivel":"medio","enun":"\u003cp>Em “O andar da tartaruga é lento”, a palavra “andar” é:\u003c/p>","opts":["substantivo, pois vem precedida de artigo.","verbo no infinitivo.","adjetivo.","advérbio de modo."],"ans":"A","exp":"O artigo \u003cem>o\u003c/em> substantivou o verbo: “o andar” = o modo de andar. Por isso funciona como substantivo."},{"tipo":"questao","id":"LP-02-q6","nivel":"dificil","enun":"\u003cp>Na frase “Elas ficaram meio preocupadas e comeram meia pizza”, as palavras “meio” e “meia” são, respectivamente:\u003c/p>","opts":["adjetivo e adjetivo.","numeral e advérbio.","advérbio e numeral.","substantivo e numeral."],"ans":"C","exp":"“Meio” modifica o adjetivo \u003cem>preocupadas\u003c/em> (= um pouco): advérbio, invariável. “Meia” indica metade da pizza: numeral fracionário, que concorda com o substantivo."},{"tipo":"questao","id":"LP-02-q7","nivel":"medio","discursiva":true,"linhas":3,"enun":"\u003cp>Identifique e classifique os pronomes: “Esta mochila é minha; aquela é sua. Alguém viu a minha garrafa?”\u003c/p>","resposta":"Esta: demonstrativo; minha: possessivo; aquela: demonstrativo; sua: possessivo; Alguém: indefinido; minha: possessivo.","exp":"Ponto inteiro com 5 ou 6 acertos; meio ponto com 3 ou 4."},{"tipo":"questao","id":"LP-02-q8","nivel":"facil","enun":"\u003cp>Em “Ufa! Terminei a prova a tempo”, a palavra “Ufa” expressa:\u003c/p>","opts":["dor, e é um advérbio.","alívio, e é uma interjeição.","alegria, e é um verbo.","susto, e é um substantivo."],"ans":"B","exp":"“Ufa!” exprime alívio. Palavras que expressam emoção são interjeições."},{"tipo":"questao","id":"LP-02-q9","nivel":"medio","enun":"\u003cp>Em “Estudei bastante, mas a prova estava difícil”, a palavra “mas” é uma conjunção que indica:\u003c/p>","opts":["adição.","conclusão.","causa.","oposição."],"ans":"D","exp":"“Mas” liga duas ideias contrárias à expectativa (estudar bastante × prova difícil): conjunção adversativa, de oposição."},{"tipo":"questao","id":"LP-02-q10","nivel":"dificil","enun":"\u003cp>Observe: (I) “O livro \u003cstrong>que\u003c/strong> comprei é ótimo.” (II) “Espero \u003cstrong>que\u003c/strong> você venha.” A palavra “que” é, respectivamente:\u003c/p>","opts":["pronome relativo e conjunção.","conjunção e pronome relativo.","pronome relativo nas duas.","conjunção nas duas."],"ans":"A","exp":"Em (I), “que” retoma \u003cem>livro\u003c/em> e pode ser trocado por “o qual”: pronome relativo. Em (II), apenas liga a oração ao verbo \u003cem>espero\u003c/em>, sem retomar nada: conjunção (integrante)."},{"tipo":"questao","id":"LP-02-q11","nivel":"medio","enun":"\u003cp>Assinale a correspondência INCORRETA entre locução adjetiva e adjetivo:\u003c/p>","opts":["de pai = paterno","de cidade = urbano","de ouro = argênteo","de professor = docente"],"ans":"C","exp":"Argênteo significa “de prata”. “De ouro” corresponde a \u003cem>áureo\u003c/em> ou \u003cem>dourado\u003c/em>."},{"tipo":"questao","id":"LP-02-q12","nivel":"dificil","discursiva":true,"linhas":4,"enun":"\u003cp>Escreva duas frases com a palavra “alto”: uma em que ela seja adjetivo e outra em que seja advérbio. Explique a diferença.\u003c/p>","resposta":"Exemplo: “O muro é alto.” (adjetivo: caracteriza o substantivo \u003cem>muro\u003c/em> e concordaria no plural: muros altos). “O menino fala alto.” (advérbio: modifica o verbo \u003cem>fala\u003c/em>, indicando modo, e não varia: os meninos falam alto).","exp":"Ponto inteiro com as duas frases corretas e a explicação; meio ponto sem explicação."}]},{"id":"1.2.1-s13","video":{"url":"","sugestao":""},"tipo":"questoes","titulo":"Desafio extra: mais 6 questões objetivas","check":"Fiz o desafio","itens":[{"tipo":"questao","id":"LP-02-d13","nivel":"objetiva","enun":"\u003cp>Na frase “A menina respondeu calmamente”, “calmamente” é:\u003c/p>","opts":["adjetivo que caracteriza menina.","advérbio que modifica respondeu.","pronome que substitui menina.","substantivo abstrato."],"ans":"B","exp":"Calmamente indica o modo de responder, portanto modifica o verbo."},{"tipo":"questao","id":"LP-02-d14","nivel":"objetiva","enun":"\u003cp>Em “Ela estava bastante animada”, “bastante” é:\u003c/p>","opts":["artigo definido.","substantivo.","advérbio de intensidade.","preposição."],"ans":"C","exp":"Bastante intensifica o adjetivo animada."},{"tipo":"questao","id":"LP-02-d15","nivel":"objetiva","enun":"\u003cp>Em “Estas tarefas são minhas”, as palavras destacadas são:\u003c/p>","opts":["pronome demonstrativo e possessivo.","artigo e numeral.","adjetivo e advérbio.","verbo e substantivo."],"ans":"A","exp":"Estas aponta proximidade; minhas indica posse."},{"tipo":"questao","id":"LP-02-d16","nivel":"objetiva","enun":"\u003cp>Em “Ela leu dois livros interessantes”, “dois” funciona como:\u003c/p>",
